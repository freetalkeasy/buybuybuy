    @keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
    @keyframes popIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }

    .anim-slide { animation: slideUp 0.5s ease-out forwards; }
    .anim-pop { animation: popIn 0.3s ease-out forwards; }
    .card-hover { transition: all 0.25s ease; }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    .toast-enter { animation: slideUp 0.3s ease-out; }
    .btn-primary { background: linear-gradient(135deg, #ea580c, #dc2626); transition: all 0.2s; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .copy-flash { animation: popIn 0.2s ease-out; }
    .bg-pattern {
      background-color: #fff7ed;
      background-image: radial-gradient(circle at 20% 50%, rgba(251,146,60,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(239,68,68,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(251,191,36,0.06) 0%, transparent 50%);
    }
    .dash-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
    }
    .dash-card:hover {
      transform: translateY(-8px) scale(1.02);

    .ocr-overlay { backdrop-filter: blur(8px); background: rgba(0,0,0,0.6); }
    .menu-img-thumb { width:60px; height:60px; object-fit:cover; border-radius:8px; }
    .tab-active { border-bottom: 3px solid #ea580c; color: #9a3412; font-weight: 700; }
    .tab-inactive { border-bottom: 3px solid transparent; color: #9a9a9a; }
    .tab-btn { padding: 10px 16px; transition: all 0.2s; cursor: pointer; white-space: nowrap; }
    .tab-btn:hover { color: #ea580c; }
    input[type="file"] { display: none; }
    .progress-bar { transition: width 0.3s ease; }
    .modal-backdrop { backdrop-filter: blur(4px); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const { createClient } = supabase;

    // ========== Supabase 配置 ==========
    const SUPABASE_URL = 'https://hxyzapgushermrxpglyi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4eXphcGd1c2hlcm1yeHBnbHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMjIwMTYsImV4cCI6MjA4NjU5ODAxNn0.prtAWZ8O19hSrQNEKJQqWi0vvB_VCIQPH4MfEhE0f-U';
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ========== 工具函數 ==========
    const genCode = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];

    const isActive = (endDate) => new Date(endDate) >= new Date(new Date().toDateString());
    const today = () => new Date().toISOString().split('T')[0];
    const maxDate = () => new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0];

    // ========== Toast 通知 ==========
    function Toast({ message, type='success', onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
      const colors = { success:'bg-green-600', error:'bg-red-600', info:'bg-blue-600', warning:'bg-yellow-600' };
      const icons = { success:'✅', error:'❌', info:'ℹ️', warning:'⚠️' };
      return (
        <div className="fixed top-4 right-4 z-[100] toast-enter">
          <div className={`${colors[type]} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 max-w-sm`}>
            <span>{icons[type]}</span>
            <span className="font-medium text-sm">{message}</span>
            <button onClick={onClose} className="ml-2 opacity-70 hover:opacity-100">✕</button>
          </div>
        </div>
      );
    }

    // ========== Modal 共用 ==========
    function Modal({ children, onClose, title, wide }) {
      return (
        <div className="fixed inset-0 bg-black/50 modal-backdrop z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className={`bg-white rounded-2xl shadow-2xl ${wide ? 'max-w-3xl' : 'max-w-lg'} w-full max-h-[90vh] overflow-hidden anim-pop flex flex-col`} onClick={e => e.stopPropagation()}>
            {title && (
              <div className="bg-gradient-to-r from-orange-500 to-red-500 px-6 py-4 text-white flex items-center justify-between shrink-0">
                <h3 className="text-lg font-bold">{title}</h3>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition">✕</button>
              </div>
            )}
            <div className="overflow-y-auto flex-1">{children}</div>
          </div>
        </div>
      );
    }

    // ========== 分享彈窗 ==========
    function ShareModal({ groupBuy, onClose }) {
      const [copied, setCopied] = useState(null);
      const shareUrl = getShareUrl(groupBuy.code);
      const copyTo = async (text, type) => {
        try { await navigator.clipboard.writeText(text); } catch {
          const ta = document.createElement('textarea'); ta.value = text;
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        setCopied(type); setTimeout(() => setCopied(null), 2000);
      };
      const lineMsg = `🍱 團購開團啦！\n\n📌 ${groupBuy.title}\n🏪 商家：${groupBuy.shop_name}\n📅 截止：${formatDate(groupBuy.end_date)}\n${groupBuy.description ? '📝 '+groupBuy.description+'\n' : ''}\n👉 點擊加入：${shareUrl}\n🔑 團購代碼：${groupBuy.code}${groupBuy.password ? '\n🔐 密碼：'+groupBuy.password : ''}`;

      return (
        <Modal onClose={onClose} title="🎉 團購建立成功！">
          <div className="p-6 space-y-5">
            <div className="bg-orange-50 rounded-xl p-4 border border-orange-100">
              <p className="font-bold text-orange-900 text-lg">{groupBuy.title}</p>
              <p className="text-orange-700 text-sm mt-1">🏪 {groupBuy.shop_name} ・ 📅 截止 {formatDate(groupBuy.end_date)}</p>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-500 mb-2 block">分享連結</label>
              <div className="flex gap-2">
                <input readOnly value={shareUrl} className="flex-1 px-4 py-3 bg-gray-50 border rounded-xl text-sm font-mono truncate" />
                <button onClick={() => copyTo(shareUrl,'url')} className={`px-5 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${copied==='url' ? 'bg-green-500 text-white' : 'bg-orange-100 text-orange-700 hover:bg-orange-200'}`}>
                  {copied==='url' ? '✅ 已複製' : '📋 複製'}
                </button>
              </div>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-500 mb-2 block">團購代碼</label>
              <div className="flex gap-2">
                <div className="flex-1 px-4 py-3 bg-gray-50 border rounded-xl text-center">
                  <span className="text-2xl font-black tracking-[0.3em] text-orange-900">{groupBuy.code}</span>
                </div>
                <button onClick={() => copyTo(groupBuy.code,'code')} className={`px-5 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${copied==='code' ? 'bg-green-500 text-white' : 'bg-orange-100 text-orange-700 hover:bg-orange-200'}`}>
                  {copied==='code' ? '✅ 已複製' : '📋 複製'}
                </button>
              </div>
            </div>
            {groupBuy.password && (
              <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-3">
                <p className="text-sm text-yellow-800">🔐 團購密碼：<strong>{groupBuy.password}</strong></p>
              </div>
            )}
            <button onClick={() => copyTo(lineMsg,'line')}
              className={`w-full py-4 rounded-xl font-bold text-base transition-all flex items-center justify-center gap-2 ${copied==='line' ? 'bg-green-500 text-white' : 'btn-primary text-white shadow-lg'}`}>
              {copied==='line' ? '✅ 已複製完整訊息！' : '📲 一鍵複製分享訊息（貼到 Line）'}
            </button>
            <details className="group">
              <summary className="text-sm text-gray-400 cursor-pointer hover:text-gray-600 transition">預覽分享訊息 ▾</summary>
              <div className="mt-2 p-3 bg-gray-50 rounded-xl text-sm text-gray-600 whitespace-pre-line border">{lineMsg}</div>
            </details>
          </div>
        </Modal>
      );
    }

    // ========== OCR 菜單掃描 ==========
    function OcrScanner({ onResult, onClose }) {
      const [progress, setProgress] = useState(0);
      const [status, setStatus] = useState('準備中...');
      const [scanning, setScanning] = useState(false);
      const [imagePreview, setImagePreview] = useState(null);
      const [result, setResult] = useState('');
      const fileRef = useRef();

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => { setImagePreview(ev.target.result); };
        reader.readAsDataURL(file);
      };

      const handleCapture = () => { fileRef.current?.click(); };

      const startOcr = async () => {
        if (!imagePreview) return;
        setScanning(true);
        setStatus('正在辨識中文文字...');
        setProgress(10);
        try {
          const worker = await Tesseract.createWorker('chi_tra+eng', 1, {
            logger: m => {
              if (m.status === 'recognizing text') {
                setProgress(Math.round(m.progress * 100));
                setStatus(`辨識中... ${Math.round(m.progress * 100)}%`);
              }
            }
          });
          const { data: { text } } = await worker.recognize(imagePreview);
          await worker.terminate();
          setResult(text);
          setStatus('辨識完成！');
          setProgress(100);
        } catch (err) {
          setStatus('辨識失敗：' + err.message);
          setProgress(0);
        }
        setScanning(false);
      };

      const handleUseResult = () => {
        if (result) onResult(result);
      };

      return (
        <Modal onClose={onClose} title="📸 拍照/上傳菜單 - OCR辨識" wide>
          <div className="p-6 space-y-4">
            <p className="text-sm text-gray-500">上傳菜單照片，系統將自動辨識文字內容，轉為菜單項目。</p>
            <div className="flex flex-wrap gap-3">
              <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFile} />
              <button onClick={handleCapture} className="px-5 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700 transition flex items-center gap-2">
                📷 拍照 / 選擇圖片
              </button>
              {imagePreview && !scanning && (
                <button onClick={startOcr} className="px-5 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition flex items-center gap-2">
                  🔍 開始辨識
                </button>
              )}
            </div>

            {imagePreview && (
              <div className="border-2 border-dashed border-orange-200 rounded-xl p-3 bg-orange-50">
                <img src={imagePreview} alt="菜單預覽" className="max-h-64 mx-auto rounded-lg" />
              </div>
            )}

            {scanning && (
              <div className="space-y-2">
                <div className="flex items-center gap-3">
                  <div className="w-6 h-6 border-3 border-orange-500 border-t-transparent rounded-full spinner"></div>
                  <span className="text-sm text-orange-700">{status}</span>
                </div>
                <div className="w-full bg-gray-200 rounded-full h-3">
                  <div className="bg-orange-500 h-3 rounded-full progress-bar" style={{width:`${progress}%`}}></div>
                </div>
              </div>
            )}

            {result && (
              <div className="space-y-3">
                <label className="text-sm font-bold text-orange-900">辨識結果（可編輯）：</label>
                <textarea value={result} onChange={e => setResult(e.target.value)}
                  rows={8} className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition resize-none text-sm" />
                <p className="text-xs text-gray-400">提示：每行一個品項，格式建議「品名 價格」，例如：雞腿便當 85</p>
                <button onClick={handleUseResult}
                  className="w-full py-3 btn-primary text-white rounded-xl font-bold shadow-lg">
                  ✅ 使用此辨識結果建立菜單
                </button>
              </div>
            )}

            {!imagePreview && (
              <div className="border-2 border-dashed border-gray-200 rounded-xl p-12 text-center text-gray-400">
                <p className="text-4xl mb-3">📷</p>
                <p>點擊上方按鈕拍照或選擇菜單圖片</p>
                <p className="text-xs mt-2">支援 JPG、PNG 格式，建議拍攝清晰的菜單照片</p>
              </div>
            )}
          </div>
        </Modal>
      );
    }

    // ========== 主應用 ==========
    function GroupBuyApp() {
      const [view, setView] = useState('home');
      const [user, setUser] = useState(null);
      const [isGuest, setIsGuest] = useState(false);
      const [guestName, setGuestName] = useState('');
      const [groupBuys, setGroupBuys] = useState([]);
      const [merchants, setMerchants] = useState([]);
      const [menus, setMenus] = useState([]);
      const [selected, setSelected] = useState(null);
      const [toast, setToast] = useState(null);
      const [shareModal, setShareModal] = useState(null);
      const [loading, setLoading] = useState(true);

      const showToast = (message, type='success') => setToast({ message, type });
      const currentUserName = () => {
        if (isGuest) return guestName;
        if (user) return user.user_metadata?.full_name || user.email;
        return '';
      };
      const isLoggedIn = user || isGuest;

      // 認證監聽
      useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => setUser(session?.user ?? null));
        const { data: { subscription } } = sb.auth.onAuthStateChange((_ev, session) => setUser(session?.user ?? null));
        return () => subscription.unsubscribe();
      }, []);

      // 載入資料
      const loadGroupBuys = useCallback(async () => {
        setLoading(true);
        const { data } = await sb.from('group_buys').select('*').order('created_at', { ascending: false });
        if (data) setGroupBuys(data);
        setLoading(false);
      }, []);

      const loadMerchants = useCallback(async () => {
        const { data } = await sb.from('merchants').select('*').order('created_at', { ascending: false });
        if (data) setMerchants(data);
      }, []);

      const loadMenus = useCallback(async (merchantId) => {
        let q = sb.from('menus').select('*').order('category').order('name');
        if (merchantId) q = q.eq('merchant_id', merchantId);
        const { data } = await q;
        if (data) setMenus(data);
      }, []);

      useEffect(() => { loadGroupBuys(); loadMerchants(); loadMenus(); }, []);

      // URL ?code=XXX
      useEffect(() => {
        const code = new URLSearchParams(window.location.search).get('code');
        if (code) {
          sb.from('group_buys').select('*').eq('code', code.toUpperCase()).single()
            .then(({ data }) => {
              if (data) { setSelected(data); setView('detail'); }
              else showToast('找不到此團購代碼', 'error');
              window.history.replaceState({}, '', window.location.pathname);
            });
        }
      }, []);

      const signInWithGoogle = async () => {
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
        if (error) showToast('登入失敗: ' + error.message, 'error');
      };

      const signOut = async () => {
        await sb.auth.signOut();
        setIsGuest(false); setGuestName(''); setView('home');
      };

      // ========== 頂部導航列 ==========
      const NavBar = () => (
        <header className="bg-white/90 backdrop-blur-md border-b border-orange-100 sticky top-0 z-40">
          <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 className="text-2xl font-black text-orange-900 cursor-pointer flex items-center gap-2" onClick={() => { setView('home'); setSelected(null); }}>
              🍱 團購GO
            </h1>
            <div className="flex gap-2 items-center">
              {isLoggedIn ? (
                <>
                  <span className="text-sm text-orange-700 hidden sm:inline">
                    {isGuest ? '👤 ' : '🔒 '}{currentUserName()}
                  </span>
                  <button onClick={signOut} className="px-3 py-2 text-orange-600 hover:bg-orange-50 rounded-xl text-sm transition">登出</button>
                </>
              ) : (
                <button onClick={() => setView('login')} className="px-5 py-2 btn-primary text-white rounded-xl font-bold text-sm shadow-md">登入</button>
              )}
            </div>
          </div>
        </header>
      );

      // ========== 儀表板首頁 ==========
      const HomePage = () => {
        const [joinCode, setJoinCode] = useState('');
        const [joinPwd, setJoinPwd] = useState('');
        const [showPwd, setShowPwd] = useState(false);
        const [joinTarget, setJoinTarget] = useState(null);

        const handleJoinByCode = async () => {
          if (!joinCode.trim()) return;
          const { data } = await sb.from('group_buys').select('*').eq('code', joinCode.trim().toUpperCase()).single();
          if (data) {
            if (data.password) {
              setJoinTarget(data);
              setShowPwd(true);
            } else {
              setSelected(data); setView('detail'); setJoinCode('');
            }
          } else {
            showToast('找不到此代碼的團購', 'error');
          }
        };

        const confirmPwdJoin = () => {
          if (joinTarget && joinPwd === joinTarget.password) {
            setSelected(joinTarget); setView('detail');
            setJoinCode(''); setJoinPwd(''); setShowPwd(false); setJoinTarget(null);
          } else {
            showToast('密碼錯誤', 'error');
          }
        };

        const dashCards = [
          { icon: '🛒', title: '發起團購', desc: '建立新的團購，邀請同事加入', color: 'from-orange-500 to-red-500', onClick: () => isLoggedIn ? setView('create') : setView('login') },
          { icon: '🏪', title: '商家管理', desc: '建立與管理常用商家資訊', color: 'from-blue-500 to-indigo-500', onClick: () => setView('merchants') },
          { icon: '📋', title: '菜單管理', desc: '建立菜單、拍照OCR自動辨識', color: 'from-green-500 to-teal-500', onClick: () => setView('menus') },
          { icon: '📊', title: '我的團購', desc: '查看進行中與歷史團購紀錄', color: 'from-purple-500 to-pink-500', onClick: () => {
            document.getElementById('group-list')?.scrollIntoView({ behavior: 'smooth' });
          }},
        ];

        return (
          <div className="min-h-screen bg-pattern">
            <NavBar />
            <main className="max-w-6xl mx-auto px-4 py-8">
              {/* 功能區塊 */}

                  <div key={i} onClick={c.onClick}
                    className="dash-card bg-white rounded-2xl shadow-lg cursor-pointer overflow-hidden anim-fade"
                    style={{ animationDelay: `${i * 80}ms` }}>
                    <div className={`bg-gradient-to-br ${c.color} p-5 text-white`}>
                      <div className="text-4xl mb-2">{c.icon}</div>
                      <h3 className="text-lg font-bold">{c.title}</h3>
                    </div>
                    <div className="p-4">
                      <p className="text-sm text-gray-500">{c.desc}</p>
                    </div>
                  </div>
                ))}
              </div>

              {/* 快速加入 */}
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-orange-100 anim-fade" style={{animationDelay:'350ms'}}>
                <p className="text-orange-900 font-bold mb-3">🔑 用代碼加入團購</p>
                <div className="flex gap-2">
                  <input type="text" placeholder="輸入8碼團購代碼" value={joinCode}
                    onChange={e => setJoinCode(e.target.value.toUpperCase())}
                    onKeyDown={e => e.key === 'Enter' && handleJoinByCode()}
                    className="flex-1 px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-400 focus:outline-none font-mono tracking-wider text-center text-lg" maxLength={8} />
                  <button onClick={handleJoinByCode} className="px-6 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700 transition">加入</button>
                </div>
                {showPwd && (
                  <div className="mt-3 flex gap-2 anim-fade">
                    <input type="password" placeholder="輸入團購密碼" value={joinPwd}

      // ========== 菜單管理頁 ==========
      const MenusPage = () => {
        const [selectedMerchant, setSelectedMerchant] = useState('');
        const [showOcr, setShowOcr] = useState(false);
        const [form, setForm] = useState({ name:'', price:'', category:'main', description:'', is_public:true });
        const [editing, setEditing] = useState(null);
        const [filteredMenus, setFilteredMenus] = useState([]);
        const [menuImageFile, setMenuImageFile] = useState(null);
        const [menuImagePreview, setMenuImagePreview] = useState(null);
        const menuImgRef = useRef();
        const [tab, setTab] = useState('main');

        const categories = [
          { key:'main', label:'🍱 主食' },
          { key:'drink', label:'🧋 飲料' },
          { key:'shopping', label:'🛍️ 網購' },
        ];

        useEffect(() => {
          let filtered = menus;
          if (selectedMerchant) filtered = filtered.filter(m => m.merchant_id === selectedMerchant);
          if (tab !== 'all') filtered = filtered.filter(m => m.category === tab);
          setFilteredMenus(filtered);
        }, [menus, selectedMerchant, tab]);

        const handleMenuImage = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          setMenuImageFile(file);
          const reader = new FileReader();
          reader.onload = (ev) => setMenuImagePreview(ev.target.result);
          reader.readAsDataURL(file);
        };

        const saveMenu = async (e) => {
          e.preventDefault();
          if (!form.name.trim() || !form.price) return;

          let image_url = null;
          // 如果有圖片，上傳到 Supabase Storage（如果沒有 storage，就存 base64 到 image_url）
          if (menuImagePreview) {
            image_url = menuImagePreview; // 存 base64 (簡化版)
          }

          const payload = {
            name: form.name, price: parseFloat(form.price), category: form.category,
            description: form.description || null, is_public: form.is_public,
            merchant_id: selectedMerchant || null,
            image_url: image_url,
            created_by: user?.id || null
          };

          if (editing) {
            const { error } = await sb.from('menus').update(payload).eq('id', editing);
            if (!error) { showToast('菜單已更新'); setEditing(null); }
            else showToast('更新失敗','error');
          } else {
            const { error } = await sb.from('menus').insert([payload]);
            if (!error) showToast('菜單項目已新增');
            else showToast('新增失敗: '+error.message,'error');
          }
          setForm({ name:'', price:'', category:'main', description:'', is_public:true });
          setMenuImageFile(null); setMenuImagePreview(null);
          loadMenus();
        };

        const deleteMenu = async (id) => {
          if (!confirm('確定刪除此菜單項目？')) return;
          await sb.from('menus').delete().eq('id', id);
          showToast('已刪除'); loadMenus();
        };

        const handleOcrResult = (text) => {
          setShowOcr(false);
          // 嘗試解析OCR結果為菜單項目
          const lines = text.split('\n').filter(l => l.trim());
          let addedCount = 0;
          const items = [];
          lines.forEach(line => {
            // 嘗試匹配 「品名 價格」格式
            const match = line.match(/(.+?)\s+(\d+)/);
            if (match) {
              items.push({ name: match[1].trim(), price: parseInt(match[2]) });
            } else if (line.trim().length > 1) {
              items.push({ name: line.trim(), price: 0 });
            }
          });
          // 批次寫入
          if (items.length > 0) {
            const inserts = items.map(item => ({
              name: item.name, price: item.price, category: tab || 'main',
              merchant_id: selectedMerchant || null, is_public: true, created_by: user?.id || null
            }));
            sb.from('menus').insert(inserts).then(({ error }) => {
              if (!error) { showToast(`已新增 ${items.length} 個菜單項目`); loadMenus(); }
              else showToast('批次新增失敗','error');
            });
          } else {
            showToast('無法解析菜單內容，請手動輸入','warning');
          }
        };

        return (
          <div className="min-h-screen bg-pattern">
            <NavBar />
            <main className="max-w-5xl mx-auto px-4 py-8">
              <button onClick={() => setView('home')} className="text-orange-600 hover:text-orange-800 transition mb-4 inline-block">← 返回首頁</button>

                </button>
              </div>

              <div className="bg-white rounded-2xl shadow-lg p-4 mb-6 border border-orange-100">
                <div className="flex flex-wrap items-center gap-4">
                  <div className="flex-1 min-w-[200px]">
                    <label className="block text-xs font-bold text-gray-500 mb-1">選擇商家</label>
                    <select value={selectedMerchant} onChange={e => setSelectedMerchant(e.target.value)}
                      className="w-full px-3 py-2 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none">
                      <option value="">全部商家</option>
                      {merchants.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                    </select>
                  </div>
                  <div className="flex gap-1 overflow-x-auto">
                    {categories.map(c => (
                      <button key={c.key} onClick={() => setTab(c.key)}
                        className={`tab-btn text-sm rounded-lg ${tab===c.key ? 'bg-orange-100 text-orange-800 font-bold' : 'text-gray-500 hover:bg-gray-100'}`}>
                        {c.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* 新增菜單表單 */}
              <div className="bg-white rounded-2xl shadow-lg p-6 border border-orange-100 mb-8 anim-slide">
                <h3 className="text-lg font-bold text-orange-900 mb-4">{editing ? '✏️ 編輯菜單' : '➕ 新增菜單項目'}</h3>
                <form onSubmit={saveMenu} className="space-y-4">
                  <div className="grid sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-orange-900 mb-1">品名 *</label>
                      <input type="text" required value={form.name} onChange={e => setForm({...form, name:e.target.value})}
                        placeholder="雞腿便當" className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-orange-900 mb-1">價格 (NT$) *</label>
                      <input type="number" required value={form.price} onChange={e => setForm({...form, price:e.target.value})}
                        min="0" step="1" placeholder="85" className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-orange-900 mb-1">分類</label>
                      <select value={form.category} onChange={e => setForm({...form, category:e.target.value})}
                        className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition">
                        <option value="main">🍱 主食</option>
                        <option value="drink">🧋 飲料</option>
                        <option value="shopping">🛍️ 網購</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-orange-900 mb-1">說明（選填）</label>
                      <input type="text" value={form.description} onChange={e => setForm({...form, description:e.target.value})}
                        placeholder="品項描述" className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-orange-900 mb-1">菜單照片</label>
                      <div className="flex items-center gap-2">
                        <input ref={menuImgRef} type="file" accept="image/*" onChange={handleMenuImage} />
                        <button type="button" onClick={() => menuImgRef.current?.click()}
                          className="px-4 py-3 border-2 border-dashed border-orange-200 rounded-xl text-sm text-orange-500 hover:bg-orange-50 transition w-full text-left">
                          {menuImagePreview ? '📷 已選擇圖片（點擊更換）' : '📷 上傳照片'}
                        </button>
                      </div>
                      {menuImagePreview && <img src={menuImagePreview} className="mt-2 menu-img-thumb" />}
                    </div>
                  </div>
                  <div className="flex items-center gap-4">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={form.is_public} onChange={e => setForm({...form, is_public:e.target.checked})}
                        className="w-4 h-4 rounded text-orange-600" />
                      <span className="text-sm text-gray-600">公開菜單</span>
                    </label>
                  </div>
                  <div className="flex gap-3">
                    <button type="submit" className="px-6 py-3 btn-primary text-white rounded-xl font-bold shadow-lg">
                      {editing ? '💾 儲存' : '➕ 新增'}
                    </button>
                    {editing && (
                      <button type="button" onClick={() => { setEditing(null); setForm({name:'',price:'',category:'main',description:'',is_public:true}); setMenuImagePreview(null); }}
                        className="px-6 py-3 bg-gray-200 text-gray-600 rounded-xl font-bold">取消</button>
                    )}
                  </div>
                </form>
              </div>

              {/* 菜單列表 */}
              {filteredMenus.length === 0 ? (
                <div className="text-center py-16 text-gray-400">
                  <p className="text-4xl mb-3">📋</p>
                  <p>此分類尚無菜單項目</p>
                </div>
              ) : (
                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredMenus.map((item, i) => (
                    <div key={item.id} className="bg-white rounded-xl shadow-md p-4 border border-orange-50 anim-fade flex gap-3"
                      style={{animationDelay:`${i*40}ms`}}>

            loadGroupBuys();

                      </div>

                      <div>

                          <select value={form.merchantId} onChange={e => setForm({...form, merchantId:e.target.value})}

                            <option value="">-- 從已有商家選擇，或自行輸入 --</option>

                          <input type="text" required value={form.shopName} onChange={e => setForm({...form, shopName:e.target.value, merchantId:''})}

                      </div>

                      <div>
                        <label className="block text-sm font-bold text-orange-900 mb-1.5">截止日期 *</label>
                        <input type="date" required value={form.endDate} onChange={e => setForm({...form, endDate:e.target.value})}

                      </div>

                      <div>
                        <label className="block text-sm font-bold text-orange-900 mb-1.5">說明（選填）</label>
                        <textarea value={form.description} onChange={e => setForm({...form, description:e.target.value})}
                          placeholder="團購說明或注意事項" rows={3} maxLength={500}

                      </div>

                      <label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-orange-50 transition">

                          className="w-5 h-5 rounded text-orange-600" />
                        <div>
                          <span className="text-orange-900 font-medium">🔒 設為私人團購</span>
                          <p className="text-xs text-orange-400">僅有連結/代碼+密碼的人可以加入</p>
                        </div>
                      </label>

                      {form.isPrivate && (
                        <div className="anim-fade">
                          <label className="block text-sm font-bold text-orange-900 mb-1.5">團購密碼</label>
                          <input type="text" value={form.password} onChange={e => setForm({...form, password:e.target.value})}
                            placeholder="設定加入密碼（選填）" maxLength={20}
                            className="w-full px-4 py-3 border-2 border-yellow-300 rounded-xl focus:border-yellow-500 focus:outline-none transition" />
                        </div>
                      )}

                      <button type="submit" disabled={submitting}
                        className={`w-full py-4 btn-primary text-white rounded-xl font-bold text-lg shadow-lg ${submitting ? 'opacity-50' : ''}`}>
                        {submitting ? '建立中...' : '🚀 建立團購'}
                      </button>
                    </form>
                  </div>
                </div>

                {/* 菜單預覽面板 */}

                  <div className="bg-white rounded-2xl shadow-lg border border-orange-100 overflow-hidden anim-fade sticky top-20" style={{animationDelay:'200ms'}}>
                    <div className="bg-gradient-to-r from-green-500 to-teal-500 px-5 py-3 text-white">

                    <div className="p-4">
                      {merchantMenus.length > 0 ? (

                          <div className="flex gap-1 mb-3 overflow-x-auto">

                              <button key={c.key} onClick={() => setMenuTab(c.key)}
                                className={`px-3 py-1 rounded-lg text-xs font-bold transition ${menuTab===c.key ? 'bg-green-100 text-green-800' : 'text-gray-400 hover:bg-gray-100'}`}>
                                {c.label}
                              </button>
                            ))}
                          </div>
                          <div className="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                            {filteredMerchantMenus.map(item => (
                              <div key={item.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-green-50 transition">
                                {item.image_url && <img src={item.image_url} className="w-10 h-10 rounded-lg object-cover shrink-0" />}
                                <div className="flex-1 min-w-0">
                                  <p className="text-sm font-bold text-gray-800 truncate">{item.name}</p>
                                  {item.description && <p className="text-xs text-gray-400 truncate">{item.description}</p>}
                                </div>
                                <span className="text-sm font-bold text-green-700 shrink-0">NT${item.price}</span>
                              </div>
                            ))}
                          </div>
                        </>
                      ) : (
                        <div className="text-center py-8 text-gray-300">
                          <p className="text-3xl mb-2">📋</p>
                          <p className="text-sm">{form.merchantId ? '此商家尚無菜單' : '選擇商家後顯示菜單'}</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      };

      // ========== 團購詳情頁 ==========
      const DetailPage = () => {
        const [orders, setOrders] = useState([]);
        const [form, setForm] = useState({ customerName: currentUserName(), items:'', amount:'' });
        const [loadingOrders, setLoadingOrders] = useState(true);
        const [editingId, setEditingId] = useState(null);
        const [editForm, setEditForm] = useState({});
        const [shareCopied, setShareCopied] = useState(false);
        const [detailMenus, setDetailMenus] = useState([]);
        const [showMenuPanel, setShowMenuPanel] = useState(false);

        const gb = selected;
        const active = isActive(gb.end_date);
        const shareUrl = getShareUrl(gb.code);

        // 載入相關菜單
        useEffect(() => {
          // 嘗試用 shop_name 找 merchant，再找菜單
          sb.from('merchants').select('id').eq('name', gb.shop_name).then(({ data: mData }) => {
            if (mData && mData.length > 0) {
              sb.from('menus').select('*').eq('merchant_id', mData[0].id).order('category').order('name')
                .then(({ data }) => { if (data) setDetailMenus(data); });
            }
          });
        }, [gb.shop_name]);

        const loadOrders = useCallback(async () => {
          setLoadingOrders(true);
          const { data } = await sb.from('orders').select('*').eq('group_buy_id', gb.id).order('created_at', { ascending: true });
          if (data) setOrders(data);
          setLoadingOrders(false);
        }, [gb.id]);

        useEffect(() => { loadOrders(); }, [loadOrders]);

        const handleAddOrder = async (e) => {
          e.preventDefault();
          if (!form.customerName.trim() || !form.items.trim() || !form.amount) return;
          const { error } = await sb.from('orders').insert([{
            group_buy_id: gb.id, customer_name: form.customerName.trim(),
            items: form.items.trim(), amount: parseFloat(form.amount), user_id: user?.id || null
          }]);
          if (error) showToast('新增失敗: '+error.message,'error');
          else { showToast('訂單新增成功！'); setForm({ customerName: currentUserName(), items:'', amount:'' }); loadOrders(); }
        };

        const handleDeleteOrder = async (id) => {
          if (!confirm('確定要刪除此訂單？')) return;
          await sb.from('orders').delete().eq('id', id);
          showToast('已刪除'); loadOrders();
        };

        const startEdit = (o) => { setEditingId(o.id); setEditForm({ items:o.items, amount:o.amount }); };
        const saveEdit = async (id) => {
          await sb.from('orders').update({ items:editForm.items, amount:parseFloat(editForm.amount) }).eq('id', id);
          showToast('已更新'); setEditingId(null); loadOrders();
        };

        const totalAmount = orders.reduce((s,o) => s + parseFloat(o.amount||0), 0);

        const copyShareLink = async () => {
          const msg = `🍱 團購開團：${gb.title}\n🏪 ${gb.shop_name}\n📅 截止 ${formatDate(gb.end_date)}\n👉 ${shareUrl}\n🔑 代碼：${gb.code}${gb.password ? '\n🔐 密碼：'+gb.password : ''}`;
          try { await navigator.clipboard.writeText(msg); } catch {
            const ta = document.createElement('textarea'); ta.value = msg;
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
          }
          setShareCopied(true); setTimeout(() => setShareCopied(false), 2000);
        };

        const summary = {};
        orders.forEach(o => {
          if (!summary[o.customer_name]) summary[o.customer_name] = { items: [], total: 0 };
          summary[o.customer_name].items.push(o.items);
          summary[o.customer_name].total += parseFloat(o.amount || 0);
        });

        const addFromMenu = (item) => {
          setForm(f => ({
            ...f,
            items: f.items ? f.items + '\n' + item.name : item.name,
            amount: f.amount ? String(parseFloat(f.amount) + item.price) : String(item.price)
          }));
          showToast(`已加入 ${item.name}`,'info');
        };

        return (
          <div className="min-h-screen bg-pattern">
            <NavBar />
            <main className="max-w-5xl mx-auto px-4 py-6 space-y-6">
              {/* 團購資訊卡 */}
              <div className="bg-white rounded-2xl shadow-lg p-6 border border-orange-100 anim-fade">
                <div className="flex flex-wrap justify-between items-start gap-4">
                  <div>
                    <h2 className="text-2xl font-black text-orange-900">{gb.title}</h2>
                    <p className="text-orange-600 mt-1">🏪 {gb.shop_name} ・ 👤 {gb.organizer_name}</p>
                    {gb.description && <p className="mt-3 text-orange-700 bg-orange-50 px-4 py-2 rounded-xl text-sm">{gb.description}</p>}

                  <div className="text-right shrink-0">
                    <span className={`px-3 py-1.5 rounded-full text-sm font-bold ${active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                      {active ? '🟢 進行中' : '🔴 已結束'}
                    </span>
                    <p className="text-sm text-orange-500 mt-2">截止 {formatDate(gb.end_date)}</p>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-3 mt-5">
                  <div className="bg-orange-50 rounded-xl p-3 text-center">
                    <p className="text-2xl font-black text-orange-900">NT$ {totalAmount.toLocaleString()}</p>
                    <p className="text-xs text-orange-500">總金額</p>
                  </div>
                  <div className="bg-orange-50 rounded-xl p-3 text-center">
                    <p className="text-2xl font-black text-orange-900">{orders.length}</p>
                    <p className="text-xs text-orange-500">筆訂單</p>
                  </div>
                  <div className="bg-orange-50 rounded-xl p-3 text-center">
                    <p className="text-2xl font-black text-orange-900">{Object.keys(summary).length}</p>
                    <p className="text-xs text-orange-500">人參加</p>
                  </div>
                </div>

                <div className="mt-5 p-4 bg-gray-50 rounded-xl border flex flex-wrap gap-2 items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-sm text-gray-500">代碼</span>
                    <span className="font-mono font-black text-lg text-orange-900 tracking-wider">{gb.code}</span>
                  </div>
                  <button onClick={copyShareLink}
                    className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${shareCopied ? 'bg-green-500 text-white' : 'btn-primary text-white shadow-md'}`}>
                    {shareCopied ? '✅ 已複製分享訊息' : '📲 複製分享訊息到 Line'}
                  </button>
                </div>
              </div>

              <div className="grid md:grid-cols-2 gap-6">

                            <span className="text-green-600 font-bold">${item.price}</span>

                        <input type="text" required value={form.customerName}
                          onChange={e => setForm({...form, customerName:e.target.value})}
                          className="w-full px-4 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-orange-800 mb-1">品項 *</label>
                        <textarea required value={form.items} onChange={e => setForm({...form, items:e.target.value})}
                          placeholder="例如：雞腿便當 x1&#10;珍珠奶茶 大杯 x1" rows={3}
                          className="w-full px-4 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition resize-none" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-orange-800 mb-1">金額 (NT$) *</label>
                        <input type="number" required value={form.amount} onChange={e => setForm({...form, amount:e.target.value})}
                          min="0" step="1" placeholder="0"
                          className="w-full px-4 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none transition" />
                      </div>
                      <button type="submit" className="w-full py-3 btn-primary text-white rounded-xl font-bold shadow-lg">加入訂單</button>
                    </form>
                  ) : (
                    <div className="text-center py-8 text-gray-400">
                      <p className="text-3xl mb-2">⏰</p>
                      <p>此團購已截止，無法新增訂單</p>
                    </div>

                </div>

                {/* 訂單明細 */}
                <div className="bg-white rounded-2xl shadow-lg p-6 border border-orange-100 anim-fade" style={{animationDelay:'200ms'}}>

                  <div className="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    {loadingOrders ? (
                      <p className="text-center py-8 text-orange-400">載入中...</p>

                      <p className="text-center py-8 text-orange-400">尚無訂單</p>

                      <div key={order.id} className="p-4 bg-orange-50 rounded-xl border border-orange-100 group">
                        {editingId === order.id ? (
                          <div className="space-y-2">
                            <textarea value={editForm.items} onChange={e => setEditForm({...editForm, items:e.target.value})}
                              className="w-full px-3 py-2 border border-orange-200 rounded-lg text-sm" rows={2} />
                            <input type="number" value={editForm.amount} onChange={e => setEditForm({...editForm, amount:e.target.value})}

                              <button onClick={() => saveEdit(order.id)} className="px-3 py-1 bg-green-500 text-white rounded-lg text-sm">儲存</button>
                              <button onClick={() => setEditingId(null)} className="px-3 py-1 bg-gray-200 text-gray-600 rounded-lg text-sm">取消</button>

                              <button onClick={() => handleDeleteOrder(order.id)} className="text-xs text-red-400 hover:text-red-600">🗑 刪除</button>

                        {Object.entries(summary).map(([name, data]) => (
                          <tr key={name} className="border-b border-orange-50">
                            <td className="py-3 pr-4 font-bold text-orange-900">{name}</td>
                            <td className="py-3 pr-4 text-sm text-orange-700">{data.items.join('、')}</td>
                            <td className="py-3 text-right font-bold text-orange-600">NT$ {data.total.toLocaleString()}</td>
                          </tr>
                        ))}
                      </tbody>
                      <tfoot>
                        <tr className="border-t-2 border-orange-300">
                          <td className="py-3 font-black text-orange-900" colSpan={2}>合計</td>
                          <td className="py-3 text-right font-black text-orange-900 text-lg">NT$ {totalAmount.toLocaleString()}</td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      };

      // ========== 路由渲染 ==========
      const renderView = () => {
        switch (view) {
          case 'login': return <LoginPage />;
          case 'create': return <CreatePage />;
          case 'merchants': return <MerchantsPage />;
          case 'menus': return <MenusPage />;
          case 'detail': return selected ? <DetailPage /> : <HomePage />;
          default: return <HomePage />;
        }
      };

      return (
        <>
          {renderView()}
          {toast && <Toast {...toast} onClose={() => setToast(null)} />}
          {shareModal && <ShareModal groupBuy={shareModal} onClose={() => { setShareModal(null); setView('home'); }} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GroupBuyApp />);
  </script>
</body>
</html>
