                <p className="text-5xl mb-3">☝️</p>
                <p className="font-black text-amber-700 text-base">請先選擇上方商家</p>
                <p className="text-sm text-amber-500 mt-1">點商家卡片的「📋 修改菜單」按鈕，即可在此管理菜單品項</p>
              </div>
            )}
          </div>
            </div>

          </div>
        </main>
      </div>
    );
  };

  const Create = () => {
    const dayLabel = (n) => { if (n === 0) return '今日'; if (n === 1) return '明日'; if (n === 2) return '後天'; return `${n}天後` };
    const fmtShortDate = (n) => { const d = new Date(Date.now() + n * 864e5); return `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）` };
    const quickActions = [{ label: `🍱 今日午餐 ${fmtShortDate(0)}`, title: `${dayLabel(0)}午餐團購 ${fmtShortDate(0)}`, date: todayS() }, { label: `🍱 明日午餐 ${fmtShortDate(1)}`, title: `${dayLabel(1)}午餐團購 ${fmtShortDate(1)}`, date: addDays(1) }, { label: `🍱 後天午餐 ${fmtShortDate(2)}`, title: `${dayLabel(2)}午餐團購 ${fmtShortDate(2)}`, date: addDays(2) },];
    const [f, setF] = useState({ title: '', shopName: '', endDate: '', endTime: '12:00', desc: '', priv: false, pwd: '', mid: '' }); const [sub, setSub] = useState(false); const [mm, setMm] = useState([]); const [mt, setMt] = useState('all');
    useEffect(() => { if (f.mid) { const m = merchants.find(x => x.id === f.mid); if (m) setF(p => ({ ...p, shopName: m.name })); sb.from('menus').select('*').eq('merchant_id', f.mid).order('category').order('name').then(({ data }) => { if (data) setMm(data) }) } else setMm([]) }, [f.mid]);
    const fmm = mt === 'all' ? mm : mm.filter(x => x.category === mt);
    const go = async (e) => { e.preventDefault(); if (sub) return; setSub(true); const code = genCode(); const descWithTime = (f.endTime ? "__et:" + f.endTime + "__" : "") + (f.desc || ""); const { data, error } = await sb.from('group_buys').insert([{ title: f.title, shop_name: f.shopName, end_date: f.endDate, is_private: f.priv, description: descWithTime || null, password: f.priv && f.pwd ? f.pwd : null, code, organizer_name: cName(), organizer_id: user?.id || null }]).select().single(); if (error) show('失敗: ' + error.message, 'error'); else { setShareModal(data); ldGbs() } setSub(false) };
    const applyQuick = (q) => { setF(p => ({ ...p, title: q.title, endDate: q.date })) };
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-4xl mx-auto px-4 py-6"><button onClick={goHome} className="text-orange-600 hover:text-orange-800 mb-3 inline-block text-sm">← 返回首頁</button><h2 className="text-xl font-black text-orange-900 mb-4">🛒 發起新團購</h2><div className="flex flex-wrap gap-2 mb-5"><span className="text-sm text-gray-500 py-2">快速建立：</span>{quickActions.map((q, i) => <button key={i} onClick={() => applyQuick(q)} className="quick-chip text-sm">{q.label}</button>)}</div><div className="grid lg:grid-cols-5 gap-5"><div className="lg:col-span-3"><div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 anim-slide"><form onSubmit={go} className="space-y-4"><div><label className="block text-sm font-bold text-orange-900 mb-1">團購名稱 *</label><input type="text" required value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="週五午餐便當" maxLength={100} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div><label className="block text-sm font-bold text-orange-900 mb-1">商家 *</label><select value={f.mid} onChange={e => setF({ ...f, mid: e.target.value })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl mb-2"><option value="">-- 選擇已有商家 --</option>{merchants.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select><input type="text" required value={f.shopName} onChange={e => setF({ ...f, shopName: e.target.value, mid: '' })} placeholder="或直接輸入商家名稱" maxLength={100} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div><label className="block text-sm font-bold text-orange-900 mb-1">截止日期 / 時間 *</label><div className="flex gap-2"><input type="date" required value={f.endDate} onChange={e => setF({ ...f, endDate: e.target.value })} min={todayS()} max={maxDS()} className="flex-1 px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /><input type="time" required value={f.endTime} onChange={e => setF({ ...f, endTime: e.target.value })} className="flex-1 px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none text-center" /></div></div><div><label className="block text-sm font-bold text-orange-900 mb-1">說明</label><textarea value={f.desc} onChange={e => setF({ ...f, desc: e.target.value })} rows={2} maxLength={500} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl resize-none" /></div><label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-orange-50"><input type="checkbox" checked={f.priv} onChange={e => setF({ ...f, priv: e.target.checked })} className="w-4 h-4 rounded accent-orange-600" /><span className="text-orange-900 font-medium text-sm">🔒 私人團購（需密碼）</span></label>{f.priv && <div className="anim-fade"><input type="text" value={f.pwd} onChange={e => setF({ ...f, pwd: e.target.value })} placeholder="設定密碼" maxLength={20} className="w-full px-3 py-2.5 border-2 border-yellow-300 rounded-xl" /></div>}<button type="submit" disabled={sub} className={`w-full py-3.5 btn-p rounded-xl font-bold text-lg shadow-lg ${sub ? 'opacity-50' : ''}`}>{sub ? '建立中...' : '🚀 建立團購'}</button></form></div></div><div className="lg:col-span-2"><div className="bg-white rounded-2xl shadow-md border overflow-hidden anim-fade sticky top-16"><div className="bg-gradient-to-r from-green-500 to-teal-500 px-4 py-3 text-white"><h3 className="font-bold text-sm">📋 菜單預覽</h3></div><div className="p-3">{mm.length > 0 ? (<><div className="flex gap-1 mb-2 flex-wrap">{[{ k: 'all', l: '全部' }, ...CATS.map(c => ({ k: c.k, l: c.s }))].map(c => <button key={c.k} onClick={() => setMt(c.k)} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${mt === c.k ? 'bg-green-100 text-green-800' : 'text-gray-400 hover:bg-gray-100'}`}>{c.l}</button>)}</div><div className="space-y-1.5 max-h-[400px] overflow-y-auto pr-1">{fmm.map(it => <div key={it.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-green-50 text-sm"><div className="flex-1 min-w-0"><p className="font-bold text-gray-800 truncate">{it.name}</p>{Array.isArray(it.sizes)&&it.sizes.length>0 && <p className="text-xs text-gray-400">{it.sizes.map(s => s.label).join(' / ')}</p>}</div><span className="font-bold text-green-700 shrink-0 text-xs">{Array.isArray(it.sizes)&&it.sizes.length>0 ? it.sizes.map(s => `$${s.price}`).join('/') : (`NT$${it.price}`)}</span></div>)}</div></>) : <div className="text-center py-8 text-gray-300"><p className="text-2xl mb-1">📋</p><p className="text-xs">{f.mid ? '此商家尚無菜單' : '選擇商家顯示菜單'}</p></div>}</div></div></div></div></main></div>);
  };

  const AdminPage = () => {
    const [adminGbs, setAdminGbs] = useState([]); const delGb = async (id) => { if (!confirm('確定刪除？')) return; await sb.from('group_buys').delete().eq('id', id); setAdminGbs(p => p.filter(g => g.id !== id)); show('已刪除') };
    useEffect(() => { sb.from('group_buys').select('*').order('created_at', { ascending: false }).then(({ data }) => setAdminGbs(data || [])) }, []);
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-6xl mx-auto px-4 py-8"><h2 className="text-2xl font-black text-red-900 mb-6">🛡️ 管理者後台</h2><div className="bg-white p-6 rounded-3xl shadow-md"><h3 className="font-bold text-gray-800 mb-4">所有團購列表</h3><div className="space-y-2">{adminGbs.map(g => <div key={g.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl"><span>{g.title} ({g.shop_name})</span><button onClick={() => delGb(g.id)} className="text-red-500 text-sm">刪除</button></div>)}</div></div></main></div>);
  };

  const R = () => { 
    switch (view) { 
      case 'login': return <Login />; 
      case 'create': return <Create />; 
      case 'detail': return <Detail />; 
      case 'merchants': return <MerchantsPage />; 
      case 'orderSelect': return <OrderSelectPage />; 
      case 'orderPrint': return <OrderPrintPage />; 
      case 'admin': return isAdmin ? <AdminPage /> : <Home />; 
      default: return <Home /> 
    } 
  };
  return (<>{R()}{toast && <Toast {...toast} onClose={() => setToast(null)} />}{shareModal && <ShareModal groupBuy={shareModal} onClose={() => { setShareModal(null); setView('home') }} />}{showHelp && <HelpModal onClose={() => setShowHelp(false)} />}{showAdminLogin && <Modal onClose={() => setShowAdminLogin(false)} title="🛡️ 管理者登入"><div className="p-6 space-y-4"><input type="password" id="admin-pwd-input" placeholder="管理者密碼" className="w-full h-[52px] px-4 border-2 border-red-200 rounded-xl text-center text-lg focus:border-red-500 focus:outline-none" onKeyDown={e => { if (e.key === 'Enter') { checkAdminPwd(e.target.value) } }} /><button onClick={() => { const v = document.getElementById('admin-pwd-input')?.value; checkAdminPwd(v) }} className="w-full h-[52px] bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition shadow-lg">登入管理後台</button></div></Modal>}{showProfile && user && <ProfileModal user={user} profile={userProfile} onClose={() => setShowProfile(false)} onSave={() => sb.from('profiles').select('*').eq('id', user.id).single().then(({data})=>setUserProfile(data))} />}</>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><GroupBuyApp /></ErrorBoundary>);
setTimeout(() => document.getElementById('loading-screen').classList.add('hide'), 1000);
</script>
</body>
</html>
