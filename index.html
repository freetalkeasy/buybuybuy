function Modal({ children, onClose, title, wide }) {

function OcrScanner({ onResult, onClose, merchantName }) {
  const [tab, setTab] = useState('gemini');
  const [prog, setProg] = useState(0); const [stat, setStat] = useState(''); const [scanning, setScanning] = useState(false);
  const [img, setImg] = useState(null); const [result, setResult] = useState('');
  const [geminiKey, setGeminiKey] = useState(() => { try { return localStorage.getItem('gemini_key') || ''; } catch(e) { return ''; } });
  const [showKey, setShowKey] = useState(false);
  const [jsonText, setJsonText] = useState(''); const [jsonError, setJsonError] = useState('');
  const fRef = useRef(); const canvasRef = useRef();

  const saveKey = (k) => { setGeminiKey(k); try { localStorage.setItem('gemini_key', k); } catch(e) {} };

  const onFile = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => { setImg(ev.target.result); setResult(''); } ; r.readAsDataURL(f); };

  const preprocessImage = (imgSrc) => new Promise((resolve) => {
    const canvas = canvasRef.current || document.createElement('canvas'); const ctx = canvas.getContext('2d'); const image = new Image();
    image.onload = () => {
      const scale = Math.max(1, 1500 / Math.max(image.width, image.height)); canvas.width = image.width * scale; canvas.height = image.height * scale; ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) { const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; const v = gray > 140 ? 255 : (gray > 80 ? gray * 1.5 : 0); d[i] = d[i + 1] = d[i + 2] = Math.min(255, v); }
      ctx.putImageData(imgData, 0, 0); resolve(canvas.toDataURL('image/png'));
    }; image.src = imgSrc;
  });

  const cleanOcrText = (text) => { let t = text.replace(/[|｜l1]/g, m => m === '|' || m === '｜' ? '' : m); t = t.replace(/([^\d\s])(\d{2,})/g, '$1 $2'); t = t.replace(/[^\u4e00-\u9fff\u3400-\u4dbf\w\s\.\-\+\(\)（）\/,，、$＄:：·]+/g, ' '); t = t.replace(/[ \t]+/g, ' '); t = t.split('\n').filter(l => l.trim().length > 1).join('\n'); return t.trim(); };

  const GEMINI_PROMPT = `請分析這張菜單圖片，只保留品項名稱和價格，完全忽略店名、地址、電話、廣告、營業時間、社群帳號等無關內容。
輸出格式：每行一個品項，格式為「品項名稱 價格」。
如果有分類標題（不含價格），請單獨寫一行分類名稱。
如果同一品項有多種尺寸（大中小），格式為「品項名稱 價格1 價格2」。
只輸出純文字品項清單，不要任何說明、標記或多餘文字。`;

  // ── 壓縮圖片給 Gemini：最長邊限 1280px，JPEG quality 0.75，確保 < 1MB ──
  const compressForGemini = (imgSrc) => new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const image = new Image();
    image.onload = () => {
      const MAX = 1280;
      let { width, height } = image;
      if (Math.max(width, height) > MAX) {
        const scale = MAX / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      canvas.width = width; canvas.height = height;
      ctx.drawImage(image, 0, 0, width, height);
      // 嘗試 JPEG 0.75，若還太大就再降
      let dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      if (dataUrl.length > 1200000) dataUrl = canvas.toDataURL('image/jpeg', 0.5);
      if (dataUrl.length > 1200000) dataUrl = canvas.toDataURL('image/jpeg', 0.35);
      resolve(dataUrl);
    };
    image.src = imgSrc;
  });

  const doGeminiOcr = async () => {
    if (!img) return;
    setScanning(true); setStat('壓縮圖片中...'); setProg(10);
    try {
      // 壓縮到 < 1MB，避免超過 Edge Function 2MB body 限制
      const compressed = await compressForGemini(img);
      const base64 = compressed.split(',')[1];
      const mimeType = 'image/jpeg';
      const kbSize = Math.round(base64.length * 0.75 / 1024);
      setProg(35); setStat(`傳送圖片給伺服器（${kbSize}KB）...`);
      // ── 透過 Supabase Edge Function 呼叫 Gemini（API Key 在伺服器端，不外漏）──
      const res = await fetch(`${SURL}/functions/v1/gemini-ocr`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SKEY}` },
        body: JSON.stringify({ imageBase64: base64, mimeType })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);
      if (!data.text) throw new Error('Gemini 未回傳任何內容');
      setProg(100); setStat('✅ Gemini AI 辨識完成！正在寫入菜單...');
      // 直接自動呼叫 onResult，不需使用者手動按按鈕
      onResult(data.text, compressed);
    } catch(e) { setStat('❌ 辨識失敗：' + e.message + '　→ 可改用本地辨識或 JSON 匯入'); setProg(0); }
    setScanning(false);
  };

  const doLocalOcr = async () => {
    if (!img) return; setScanning(true); setStat('前處理圖片...'); setProg(5);
    try { const processed = await preprocessImage(img); setProg(10); setStat('載入 Tesseract 引擎（首次需下載 ~30MB）...');
      const w = await Tesseract.createWorker('chi_tra+eng', 1, { logger: m => { if (m.status === 'recognizing text') { setProg(10 + Math.round(m.progress * 85)); setStat(`辨識中... ${Math.round(m.progress * 100)}%`); } } });
      await w.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      const { data: { text } } = await w.recognize(processed); await w.terminate();
      const cleaned = cleanOcrText(text);
      setStat('✅ 本地辨識完成！正在寫入菜單...'); setProg(100);
      onResult(cleaned, processed);
    } catch (err) { setStat('❌ 失敗：' + err.message); setProg(0); }
    setScanning(false);
  };

  const JSON_PROMPT = `請分析這張菜單，輸出以下 JSON 格式，忽略店名/電話/地址/廣告/營業時間：
{
  "items": [
    {"name":"雞腿便當","price":90,"category":"main"},
    {"name":"珍珠奶茶","sizes":[{"label":"中杯","price":55},{"label":"大杯","price":65}],"category":"drink"},
    {"name":"滷肉飯","price":60,"category":"main"}
  ]
}
category 只能填：main（主餐）、drink（飲料）、other（其他）
只輸出 JSON，不要其他說明文字。`;

  const parseJsonImport = () => {
    setJsonError('');
    try {
      const clean = jsonText.replace(/```json|```/g, '').trim();
      const data = JSON.parse(clean);
      if (!data.items || !Array.isArray(data.items)) throw new Error('格式錯誤：需要包含 items 陣列');
      if (data.items.length === 0) throw new Error('items 陣列是空的');
      const lines = data.items.map(it => {
        if (it.sizes && Array.isArray(it.sizes) && it.sizes.length > 0) {
          return `${it.name} ${it.sizes.map(s => s.price).join(' ')}`;
        }
        return `${it.name} ${it.price || 0}`;
      });
      setResult(lines.join('\n'));
      setTab('gemini');
    } catch(e) { setJsonError('解析失敗：' + e.message); }
  };

  const copyPrompt = (txt) => { try { navigator.clipboard.writeText(txt); } catch(e) {} };

  const TABS = [
    { k: 'gemini', icon: '🤖', l: 'Gemini AI', sub: '最高準確率' },
    { k: 'local',  icon: '📷', l: '本地辨識', sub: '離線備援' },
    { k: 'json',   icon: '📋', l: 'JSON匯入', sub: '手動備援' },
  ];

  return (
    <Modal onClose={onClose} title={`📸 菜單辨識${merchantName ? ' — ' + merchantName : ''}`} wide>
      <div className="p-5 space-y-4">
        <canvas ref={canvasRef} style={{ display: 'none' }} />
        <input ref={fRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onFile} />

        {/* ── Tab 切換 ── */}
        <div className="flex gap-1 bg-gray-100 rounded-xl p-1">
          {TABS.map(t => (
            <button key={t.k} onClick={() => setTab(t.k)} className={`flex-1 py-2 rounded-lg text-sm font-bold transition leading-tight ${tab === t.k ? 'bg-white shadow text-orange-700' : 'text-gray-400 hover:text-gray-600'}`}>
              <span className="block">{t.icon} {t.l}</span>
              <span className="block text-xs font-normal opacity-60">{t.sub}</span>
            </button>
          ))}
        </div>

        {/* ══ Gemini AI Tab ══ */}
        {tab === 'gemini' && (
          <div className="space-y-3">
            <div className="bg-blue-50 rounded-xl p-3 border border-blue-100">
              <p className="text-xs text-blue-800 font-bold">🤖 Gemini AI 智慧辨識</p>
              <p className="text-xs text-blue-600 mt-0.5">支援複雜排版・直式文字・自動過濾非菜單內容・API Key 由管理員統一設定</p>
            </div>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => fRef.current?.click()} className="px-5 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700">📷 拍照 / 選圖</button>
              {img && !scanning && <button onClick={doGeminiOcr} className="px-5 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">🤖 Gemini 辨識</button>}
            </div>
            {img && !result && <div className="border-2 border-dashed border-orange-200 rounded-xl p-2 bg-orange-50"><img src={img} className="max-h-48 mx-auto rounded-lg" /></div>}
            {scanning && <div className="space-y-2 bg-blue-50 rounded-xl p-4 border border-blue-100">
              <div className="flex items-center gap-3"><div className="spinner" style={{borderTopColor:'#2563eb'}}></div><span className="text-sm text-blue-700 font-bold">{stat}</span></div>
              <div className="w-full bg-gray-200 rounded-full h-2"><div className="bg-blue-500 h-2 rounded-full transition-all duration-500" style={{ width: `${prog}%` }}></div></div>
            </div>}
            {!img && !scanning && !result && <div className="border-2 border-dashed border-gray-200 rounded-xl p-8 text-center text-gray-400">
              <p className="text-4xl mb-2">🤖</p>
              <p className="font-bold text-gray-500">Gemini AI 智慧辨識</p>
              <p className="text-xs mt-1">支援複雜排版 · 直式文字 · 自動過濾非菜單內容</p>
            </div>}
          </div>
        )}

        {/* ══ 本地辨識 Tab ══ */}
        {tab === 'local' && (
          <div className="space-y-3">
            <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-xs text-yellow-800">
              ⚠️ 本地 Tesseract 辨識準確率較低，建議優先使用 Gemini AI。<br/>首次使用需自動下載約 30MB 語言包（之後會快）。
            </div>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => fRef.current?.click()} className="px-5 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700">📷 拍照 / 選圖</button>
              {img && !scanning && <button onClick={doLocalOcr} className="px-5 py-3 btn-b rounded-xl font-bold">🔍 開始辨識</button>}
            </div>
            {img && !result && <div className="border-2 border-dashed border-orange-200 rounded-xl p-2 bg-orange-50"><img src={img} className="max-h-48 mx-auto rounded-lg" /></div>}
            {scanning && <div className="space-y-2 bg-orange-50 rounded-xl p-4 border border-orange-100">
              <div className="flex items-center gap-3"><div className="spinner"></div><span className="text-sm text-orange-700 font-bold">{stat}</span></div>
              <div className="w-full bg-gray-200 rounded-full h-2"><div className="bg-orange-500 h-2 rounded-full transition-all duration-300" style={{ width: `${prog}%` }}></div></div>

// ── 品牌 OCR 解析器 ─────────────────────────────────────────
function parseBrandOcrToTemplate(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  // 找出每行的數字群
  const parsed = lines.map(l => {
    const nums = [...l.matchAll(/\d{2,4}/g)].map(m => parseInt(m[0])).filter(n => n >= 10 && n <= 9999);
    const name = l.replace(/[\d\s\$＄NT,，\.。·\-]+$/g, '').replace(/^[\d\s\$＄NT,，\.。]+/, '').trim();
    return { raw: l, name, nums };
  });
  // 偵測最多幾個價格欄（眾數）
  const numCounts = parsed.map(p => p.nums.length).filter(n => n > 0);
  const maxCols = numCounts.length ? Math.max(...numCounts.slice(0, 30)) : 1;
  const colCount = Math.min(maxCols, 4);
  // 自動產生尺寸標籤
  const defaultSizeLabels = { 1: ['一般'], 2: ['M(中杯)', 'L(大杯)'], 3: ['S(小杯)', 'M(中杯)', 'L(大杯)'], 4: ['S', 'M', 'L', 'XL'] };
  const sizeLabels = defaultSizeLabels[colCount] || defaultSizeLabels[2];
  // 分組：無數字=分類標題；有數字=品項
  const cats = []; let curCat = null;
  for (const p of parsed) {
    const hasPrice = p.nums.length > 0;
    const looksLikeCat = !hasPrice && p.name.length > 0 && p.name.length <= 20 && !/^\d/.test(p.name);
    if (looksLikeCat) {
      curCat = { n: p.name, items: [] };
      cats.push(curCat);
    } else if (hasPrice && p.name.length > 0) {
      if (!curCat) { curCat = { n: '飲品', items: [] }; cats.push(curCat); }
      const prices = sizeLabels.map((_, si) => p.nums[si] != null ? p.nums[si] : null);
      curCat.items.push({ n: p.name, p: prices, t: '' });
    }
  }
  const finalCats = cats.filter(c => c.items.length > 0);
  if (!finalCats.length) {
    // fallback: 全部視為品項，無分類
    const items = parsed.filter(p => p.name.length > 1).map(p => ({ n: p.name, p: sizeLabels.map((_, si) => p.nums[si] || null), t: '' }));
    finalCats.push({ n: '飲品', items });
  }
  return { sizes: sizeLabels, cats: finalCats };
}

                  <input value={nbf.sizes} onChange={e => setNbf({ ...nbf, sizes: e.target.value })} placeholder="尺寸（逗號分隔）" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm" />

                </div>

          </div>
        )}
      </div>
    </Modal>
  );
  const totalItems = d.cats.reduce((s, c) => s + c.items.length, 0);
  return (<Modal onClose={onClose} title={`${d.emoji} ${d.brand}`} wide><div className="flex flex-col" style={{ maxHeight: '80vh' }}><div className="bg-orange-50 px-5 py-3 border-b border-orange-200 flex items-center justify-between shrink-0 flex-wrap gap-2"><button onClick={back} className="text-orange-600 text-sm font-bold hover:text-orange-800">← 返回品牌</button><div className="flex items-center gap-2 flex-wrap">{!editMode && <><button onClick={selectAll} className="text-xs text-blue-600 font-bold">{selCount === totalItems ? '取消全選' : '全選'}</button><span className="text-sm text-orange-700 font-bold">已選 {selCount}</span></>}{d._id && onSave && <button onClick={editMode ? cancelEdit : startEdit} className={`px-3 py-1 rounded-lg text-xs font-bold ${editMode ? 'bg-gray-200 text-gray-600' : 'bg-blue-100 text-blue-700'}`}>{editMode ? '✕ 取消' : '✏️ 編輯菜單'}</button>}{editMode && <><input ref={imgRef} type="file" accept="image/*" className="hidden" onChange={handleImg} /><button onClick={() => imgRef.current?.click()} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-lg text-xs font-bold">📷 上傳菜單照片</button></>}</div></div>{d.image_url && <div className="px-5 pt-3"><img src={d.image_url} className="w-full max-h-48 object-contain rounded-xl border-2 border-orange-100" /></div>}<div className="overflow-y-auto flex-1 px-5 py-4 space-y-5">{d.cats.map((cat, ci) => { const catAllSel = cat.items.every((_, i) => sel[`${ci}-${i}`]); const catSomeSel = cat.items.some((_, i) => sel[`${ci}-${i}`]); return (<div key={ci} className="anim-fade" style={{ animationDelay: `${ci * 30}ms` }}><div className="flex items-center gap-2 mb-2 cursor-pointer select-none" onClick={editMode ? undefined : () => toggleCat(ci)}>{!editMode && <input type="checkbox" checked={catAllSel} readOnly className="w-4 h-4 accent-orange-600 pointer-events-none" ref={el => { if (el) el.indeterminate = catSomeSel && !catAllSel }} />}{editMode ? <><input value={cat.n} onChange={e => updCatN(ci, e.target.value)} className="font-black text-orange-900 bg-white border-2 border-blue-200 rounded-lg px-2 py-1 text-sm flex-1" /><button onClick={() => rmCat(ci)} className="text-xs text-red-400 font-bold ml-1">🗑</button></> : <h3 className="font-black text-orange-900">{cat.n}</h3>}<span className="text-xs text-gray-400">（{cat.items.length}）</span></div><div className="overflow-x-auto"><table className="w-full text-sm border-collapse"><thead><tr className="border-b-2 border-orange-200 bg-orange-50/50">{!editMode && <th className="py-1.5 px-1 w-8"></th>}<th className="py-1.5 px-2 text-left text-xs text-orange-700 font-bold">品項</th>{d.sizes.map((s, si) => <th key={si} className="py-1.5 px-2 text-center text-xs text-orange-700 font-bold min-w-[52px]">{s}</th>)}<th className="py-1.5 px-2 text-left text-xs text-gray-400 font-bold">備註</th>{editMode && <th className="w-8"></th>}</tr></thead><tbody>{cat.items.map((it, ii) => { const isSel = !!sel[`${ci}-${ii}`]; return (<tr key={ii} onClick={editMode ? undefined : () => toggleItem(ci, ii)} className={`border-b border-orange-50 ${editMode ? '' : 'cursor-pointer'} transition ${isSel && !editMode ? 'bg-orange-50' : 'hover:bg-gray-50'}`}>{!editMode && <td className="py-2 px-1 text-center"><input type="checkbox" checked={isSel} readOnly className="w-3.5 h-3.5 accent-orange-600 pointer-events-none" /></td>}<td className="py-2 px-2 whitespace-nowrap">{editMode ? <input value={it.n} onChange={e => updN(ci, ii, e.target.value)} className="w-full px-2 py-1 border rounded-lg text-sm font-bold" placeholder="品名" /> : <span className="font-bold text-gray-800">{it.r && <span className="text-orange-500 mr-0.5">◆</span>}{it.n}{it.cf && <span className="ml-1.5 text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full">無咖啡因</span>}{it.co && <span className="ml-1.5 text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">冷</span>}</span>}</td>{d.sizes.map((s, si) => <td key={si} className="py-2 px-2 text-center">{editMode ? <input type="number" value={it.p[si] != null ? it.p[si] : ''} onChange={e => updP(ci, ii, si, e.target.value)} className="w-14 px-1 py-1 border rounded text-center text-sm" placeholder="-" /> : <span className="font-bold">{it.p[si] != null ? <span className="text-orange-700">{it.p[si]}</span> : <span className="text-gray-300">-</span>}</span>}</td>)}<td className="py-2 px-2 text-xs text-gray-400 max-w-[140px]">{editMode ? <input value={it.t || ''} onChange={e => updT(ci, ii, e.target.value)} className="w-full px-1 py-1 border rounded text-xs" placeholder="備註" /> : <span className="truncate block">{it.t || ''}</span>}</td>{editMode && <td className="py-2 px-1"><button onClick={() => rmItem(ci, ii)} className="text-red-400 hover:text-red-600 text-sm">×</button></td>}</tr>); })}</tbody></table></div>{editMode && <button onClick={() => addItem(ci)} className="mt-1 text-xs text-blue-600 font-bold ml-2">＋ 新增品項</button>}</div>); })} {editMode && <button onClick={addCat} className="w-full py-2 border-2 border-dashed border-blue-300 rounded-xl text-blue-600 text-sm font-bold hover:bg-blue-50">＋ 新增分類</button>}{d.toppings && d.toppings.length > 0 && <div className="bg-yellow-50 rounded-xl p-4 border border-yellow-200"><h4 className="font-bold text-yellow-900 text-sm mb-2">🧊 加料選項</h4><div className="space-y-1">{d.toppings.map(([price, items], i) => <div key={i} className="flex gap-2 text-sm"><span className="font-bold text-yellow-700 shrink-0">+{price}元</span><span className="text-yellow-800">{items.join('、')}</span></div>)}</div></div>}<div className="bg-gray-50 rounded-xl p-4 border border-gray-200 text-sm"><div className="flex flex-wrap gap-4"><div><span className="font-bold text-gray-600">甜度：</span><span className="text-gray-500">{d.sugars.join('、')}</span></div><div><span className="font-bold text-gray-600">冰塊：</span><span className="text-gray-500">{d.ices.join('、')}</span></div></div></div></div><div className="bg-white border-t border-orange-200 px-5 py-3 flex items-center justify-between shrink-0 flex-wrap gap-2">{editMode ? (<><p className="text-sm text-blue-700 font-bold">📝 編輯模式 — 直接修改價格、品項</p><div className="flex gap-2"><button onClick={cancelEdit} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button><button onClick={saveEdit} disabled={saving} className={`px-6 py-2.5 btn-b rounded-xl font-bold text-sm shadow ${saving ? 'opacity-50' : ''}`}>{saving ? '儲存中...' : '💾 儲存到資料庫'}</button></div></>) : (<><p className="text-sm text-orange-700"><strong>{selCount}</strong> 個品項已選取</p><div className="flex gap-2"><button onClick={onClose} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button><button onClick={doImport} disabled={!selCount} className={`px-6 py-2.5 btn-g rounded-xl font-bold text-sm shadow ${!selCount ? 'opacity-40' : ''}`}>✅ 匯入 {selCount} 項</button></div></>)}</div></div></Modal>);
}

function ShareModal({ groupBuy: g, onClose }) {
  const [cp, setCp] = useState(null); const url = shareUrl(g.code, g.password);
  const doCp = async (t, tp) => { try { await navigator.clipboard.writeText(t) } catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); document.body.removeChild(a) } setCp(tp); setTimeout(() => setCp(null), 2000); };

  const addSize = () => setSizes(p => [...p, { label: '', price: '' }]); const rmSize = (i) => setSizes(p => p.filter((_, j) => j !== i)); const updSize = (i, k, v) => setSizes(p => p.map((s, j) => j === i ? { ...s, [k]: v } : s));

izeHint}）</p>{sizes.map((s, i) => <div key={i} className="flex gap-2 items-center"><input type="text" value={s.label} onChange={e => updSize(i, 'label', e.target.value)} placeholder="規格名稱" className="flex-1 px-3 py-2 border rounded-lg text-sm" /><input type="number" value={s.price} onChange={e => updSize(i, 'price', e.target.value)} placeholder="價格" min="0" className="w-24 px-3 py-2 border rounded-lg text-sm" />{sizes.length > 1 && <button type="button" onClick={() => rmSize(i)} className="text-red-400 hover:text-red-600 text-lg px-1">×</button>}</div>)}<button type="button" onClick={addSize} className="text-sm text-blue-600 hover:text-blue-800 font-bold">＋ 新增規格</button></div>}<div className="flex items-center justify-between pt-1"><label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={f.is_public} onChange={e => setF({ ...f, is_public: e.target.checked })} className="w-4 h-4 rounded accent-orange-600" /><span className="text-sm text-gray-600">公開</span></label><div className="flex gap-2">{editData && <button type="button" onClick={onCancel} className="px-4 py-2 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button>}<button type="submit" className="px-5 py-2 btn-p rounded-xl font-bold text-sm shadow">{editData ? '💾 儲存' : '➕ 新增'}</button></div></div></form>);

function BatchMenuForm({ onBatchSave, onClose }) {
  const emptyRow = () => ({ _key: Date.now() + Math.random(), name: '', price: '', category: 'main', has_custom_options: false });
  const [rows, setRows] = useState([emptyRow(), emptyRow(), emptyRow()]); const [saved, setSaved] = useState([]); const [saving, setSaving] = useState(false);
  const updRow = (i, k, v) => setRows(p => p.map((r, j) => j === i ? { ...r, [k]: v } : r)); const rmRow = (i) => setRows(p => p.length <= 1 ? [emptyRow()] : p.filter((_, j) => j !== i)); const addRows = (n = 3) => setRows(p => { const nr = [...p]; for (let i = 0; i < n; i++)nr.push(emptyRow()); return nr; });
  const validRows = rows.filter(r => r.name.trim() && r.price);
  const submit = async () => { if (!validRows.length) { alert('請至少輸入一個品項'); return; } setSaving(true); const items = validRows.map(r => ({ name: r.name.trim(), price: parseFloat(r.price), category: r.category, has_custom_options: r.has_custom_options, is_public: true })); const ok = await onBatchSave(items); if (ok) { setSaved(p => [...p, ...items]); setRows([emptyRow(), emptyRow(), emptyRow()]) } setSaving(false); };
  return (<div className="space-y-4">{saved.length > 0 && <div className="bg-green-50 rounded-xl p-3 border border-green-200 anim-fade"><p className="text-sm font-bold text-green-800 mb-1">✅ 已儲存 {saved.length} 個品項</p></div>}<div className="space-y-2"><div className="grid grid-cols-12 gap-2 px-1 text-xs font-bold text-orange-700"><span className="col-span-5">品名</span><span className="col-span-2">價格</span><span className="col-span-3">分類</span><span className="col-span-1">客製</span><span className="col-span-1"></span></div>{rows.map((r, i) => <div key={r._key} className="grid grid-cols-12 gap-2 items-center"><input type="text" value={r.name} onChange={e => updRow(i, 'name', e.target.value)} placeholder="品名" className="col-span-5 px-2.5 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none" /><input type="number" value={r.price} onChange={e => updRow(i, 'price', e.target.value)} placeholder="$" min="0" className="col-span-2 px-2.5 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none" /><select value={r.category} onChange={e => updRow(i, 'category', e.target.value)} className="col-span-3 px-2 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none">{CATS.map(c => <option key={c.k} value={c.k}>{c.s}</option>)}</select><div className="col-span-1 flex justify-center"><input type="checkbox" checked={r.has_custom_options} onChange={e => updRow(i, 'has_custom_options', e.target.checked)} className="w-4 h-4 accent-orange-600" title="甜度冰塊" /></div><button type="button" onClick={() => rmRow(i)} className="col-span-1 text-red-300 hover:text-red-500 text-lg text-center">×</button></div>)}</div><div className="flex flex-wrap gap-2"><button type="button" onClick={() => addRows(3)} className="px-4 py-2 bg-orange-50 text-orange-700 border-2 border-orange-200 rounded-xl font-bold text-sm hover:bg-orange-100">＋ 新增 3 行</button></div><div className="flex items-center justify-between pt-3 border-t border-orange-100"><p className="text-sm text-orange-700 font-bold">{validRows.length} 個品項待儲存</p><div className="flex gap-2"><button type="button" onClick={onClose} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">收起</button><button type="button" onClick={submit} disabled={!validRows.length || saving} className={`px-6 py-2.5 btn-g rounded-xl font-bold text-sm shadow ${(!validRows.length || saving) ? 'opacity-40' : ''}`}>{saving ? '儲存中...' : '✅ 全部儲存'}</button></div></div></div>);
}

// 帳號資訊編輯 Modal
function ProfileModal({ user, profile, onClose, onSave }) {
  const [f, setF] = useState({ full_name: profile?.full_name || '', organization: profile?.organization || '', unit: profile?.unit || '' });
  const [saving, setSaving] = useState(false);
  const [pwd, setPwd] = useState({ current: '', next: '', confirm: '' });
  const [pwdSaving, setPwdSaving] = useState(false);
  const [pwdMsg, setPwdMsg] = useState(null); // { text, ok }

  const save = async () => {
    setSaving(true);
    const { error } = await sb.from('profiles').upsert({ id: user.id, ...f, updated_at: new Date() });
    setSaving(false);
    if (error) alert('更新失敗'); else { onSave(); onClose(); }
  };

  const changePwd = async () => {
    setPwdMsg(null);
    if (!pwd.current || !pwd.next || !pwd.confirm) { setPwdMsg({ text: '請填寫所有密碼欄位', ok: false }); return; }
    if (pwd.next.length < 6) { setPwdMsg({ text: '新密碼至少需要 6 碼', ok: false }); return; }
    if (pwd.next !== pwd.confirm) { setPwdMsg({ text: '新密碼與確認密碼不符', ok: false }); return; }
    setPwdSaving(true);
    // 先用現有密碼重新登入驗證
    const { error: signInErr } = await sb.auth.signInWithPassword({ email: user.email, password: pwd.current });
    if (signInErr) { setPwdMsg({ text: '目前密碼錯誤', ok: false }); setPwdSaving(false); return; }
    const { error: updateErr } = await sb.auth.updateUser({ password: pwd.next });
    setPwdSaving(false);
    if (updateErr) { setPwdMsg({ text: '更新失敗：' + updateErr.message, ok: false }); }
    else { setPwdMsg({ text: '✅ 密碼已成功更新', ok: true }); setPwd({ current: '', next: '', confirm: '' }); }
  };

  return (
    <Modal onClose={onClose} title="👤 個人資料設定">
      <div className="p-5 space-y-4">
        {/* 個人資料 */}
        <div><label className="block text-sm font-bold text-gray-700 mb-1">姓名</label><input type="text" value={f.full_name} onChange={e => setF({...f, full_name: e.target.value})} className="w-full px-3 py-2 border rounded-xl" /></div>
        <div><label className="block text-sm font-bold text-gray-700 mb-1">服務機關</label><input type="text" value={f.organization} onChange={e => setF({...f, organization: e.target.value})} placeholder="例如：市政府" className="w-full px-3 py-2 border rounded-xl" /></div>
        <div><label className="block text-sm font-bold text-gray-700 mb-1">服務單位/課別</label><input type="text" value={f.unit} onChange={e => setF({...f, unit: e.target.value})} placeholder="例如：資訊課" className="w-full px-3 py-2 border rounded-xl" /></div>
        <button onClick={save} disabled={saving} className="w-full py-3 btn-p rounded-xl font-bold">{saving ? '儲存中...' : '💾 儲存個人資料'}</button>

        {/* 分隔線 */}
        <div className="border-t border-gray-200 pt-4">
          <p className="text-sm font-black text-gray-700 mb-3">🔑 變更密碼</p>
          <div className="space-y-2">
            <input type="password" placeholder="目前密碼" value={pwd.current} onChange={e => setPwd({...pwd, current: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
            <input type="password" placeholder="新密碼（至少 6 碼）" value={pwd.next} onChange={e => setPwd({...pwd, next: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
            <input type="password" placeholder="確認新密碼" value={pwd.confirm} onChange={e => setPwd({...pwd, confirm: e.target.value})} onKeyDown={e => e.key === 'Enter' && changePwd()} className="w-full px-3 py-2 border rounded-xl text-sm" />
          </div>
          {pwdMsg && <p className={`text-sm mt-2 px-3 py-2 rounded-lg ${pwdMsg.ok ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'}`}>{pwdMsg.text}</p>}
          <button onClick={changePwd} disabled={pwdSaving} className="w-full py-2.5 mt-3 bg-gray-700 hover:bg-gray-800 text-white rounded-xl font-bold text-sm transition">{pwdSaving ? '更新中...' : '🔒 更新密碼'}</button>
        </div>
      </div>
    </Modal>
  );
}

function GroupBuyApp() {
  const [view, setView] = useState('home');

  const [brandTpls, setBrandTpls] = useState([]);
  const [sel, setSel] = useState(null); const [toast, setToast] = useState(null); const [shareModal, setShareModal] = useState(null); const [loading, setLoading] = useState(true);
  const show = (m, t = 'success') => setToast({ message: m, type: t });
  
  // 顯示名稱邏輯：Guest -> guestName, User -> Profile Name (Unit) or Metadata Name
  const cName = () => { 
    if (isGuest) return guestName; 
    if (user) {
      if (userProfile?.full_name) return `${userProfile.unit ? userProfile.unit + ' ' : ''}${userProfile.full_name}`;
      return user.user_metadata?.full_name || user.email; 
    }
    return ''; 
  };
  const loggedIn = user || isGuest;
  const [isAdmin, setIsAdmin] = useState(false); const [showAdminLogin, setShowAdminLogin] = useState(false); const [showProfile, setShowProfile] = useState(false); const [showHelp, setShowHelp] = useState(false);

  // Auth & Profile Logic
  useEffect(() => { 
    const fetchProfile = async (uid) => {
      const { data } = await sb.from('profiles').select('*').eq('id', uid).single();
      if (data) setUserProfile(data);
      else setUserProfile({ full_name: user?.user_metadata?.full_name || '', organization: '', unit: '' });
    };

    sb.auth.getSession().then(({ data: { session: s } }) => {
      setUser(s?.user ?? null);
      if (s?.user) fetchProfile(s.user.id);
    });
    const { data: { subscription: sub } } = sb.auth.onAuthStateChange((_, s) => {
      setUser(s?.user ?? null);
      if (s?.user) fetchProfile(s.user.id); else setUserProfile(null);
    }); 
    return () => sub.unsubscribe() 
  }, []);

  const ldGbs = useCallback(async () => { setLoading(true); const { data } = await sb.from('group_buys').select('*').order('created_at', { ascending: false }); if (data) setGbs(data); setLoading(false) }, []);
  const ldM = useCallback(async () => { const { data } = await sb.from('merchants').select('*').order('created_at', { ascending: false }); if (data) setMerchants(data) }, []);
  const ldMenus = useCallback(async () => { const { data } = await sb.from('menus').select('*').order('category').order('name'); if (data) setAllMenus(data) }, []);
  
  const ldBrands = useCallback(async () => {
    const { data, error } = await sb.from('brand_templates').select('*').order('brand');
    if (error) { setBrandTpls(SEED_BRANDS); return }
    if (data && data.length > 0) { setBrandTpls(data.map(d => ({ ...d.config, brand: d.brand, emoji: d.emoji, _id: d.id, image_url: d.image_url }))); } else { const ins = SEED_BRANDS.map(s => ({ brand: s.brand, emoji: s.emoji, config: { sizes: s.sizes, sugars: s.sugars, ices: s.ices, toppings: s.toppings, cats: s.cats } })); const { error: e2 } = await sb.from('brand_templates').insert(ins); if (!e2) { const { data: d2 } = await sb.from('brand_templates').select('*').order('brand'); if (d2) setBrandTpls(d2.map(d => ({ ...d.config, brand: d.brand, emoji: d.emoji, _id: d.id, image_url: d.image_url }))) } else setBrandTpls(SEED_BRANDS); }
  }, []);

  const saveBrandTpl = async (brand) => { const { _id, brand: name, emoji, image_url, ...rest } = brand; const config = { sizes: rest.sizes, sugars: rest.sugars, ices: rest.ices, toppings: rest.toppings, cats: rest.cats }; if (_id) { await sb.from('brand_templates').update({ brand: name, emoji, config, image_url }).eq('id', _id) } else { await sb.from('brand_templates').insert([{ brand: name, emoji, config }]) } ldBrands(); };
  const delBrandTpl = async (id) => { await sb.from('brand_templates').delete().eq('id', id); ldBrands() };
  const uploadImg = async (file) => { const ext = file.name.split('.').pop(); const fn = `brand-${Date.now()}.${ext}`; const { error } = await sb.storage.from('menu-images').upload(fn, file, { upsert: true }); if (error) { show('圖片上傳失敗', 'error'); return null } return sb.storage.from('menu-images').getPublicUrl(fn).data.publicUrl; };

  useEffect(() => { ldGbs(); ldM(); ldMenus(); ldBrands(); }, []);
  
  const gOut = async () => { await sb.auth.signOut(); setIsGuest(false); setGuestName(''); setUserProfile(null); setView('home') };
  const goHome = () => { setView('home'); setSel(null); };
  const checkAdminPwd = async (inputPwd) => {
    if (!inputPwd) return;
    const { data } = await sb.from('system_config').select('value').eq('key', 'admin_pwd').maybeSingle();
    if (data && data.value === inputPwd) { setIsAdmin(true); setShowAdminLogin(false); show('管理者登入成功', 'success'); setView('admin'); } else { show('密碼錯誤', 'error'); }
  };

  // ── 解析 Gemini 回傳的 JSON（含分類）並存入資料庫 ──
  const parseOcr = (text, mid) => {
    if (!text || !text.trim()) { show('❌ OCR 未回傳任何內容', 'error'); return; }
    console.log('[parseOcr] text length:', text.length, 'mid:', mid);
    console.log('[parseOcr] text preview:', text.slice(0, 200));

    // 嘗試解析 JSON（Edge Function V9 回傳 JSON）
    try {
      const clean = text.replace(/```json|```/g, '').trim();
      const start = clean.indexOf('{'); const end = clean.lastIndexOf('}');
      if (start !== -1 && end !== -1) {
        const data = JSON.parse(clean.slice(start, end + 1));
        if (data.items && Array.isArray(data.items) && data.items.length > 0) {
          console.log('[parseOcr] JSON parsed, items:', data.items.length);
          const ins = data.items.map(it => ({
            name: it.name,
            price: it.price || 0,
            category: (it.category === 'drink' || it.category === 'other') ? it.category : 'main',
            sizes: it.sizes && it.sizes.length > 0 ? it.sizes : null,
            merchant_id: mid || null,
            is_public: true,
            created_by: user?.id || null
          }));
          sb.from('menus').insert(ins).then(({ error }) => {
            if (!error) {
              const cats = ins.reduce((a, i) => { a[i.category] = (a[i.category]||0)+1; return a; }, {});
              const catStr = Object.entries(cats).map(([k,v]) => `${k}×${v}`).join('、');
              show(`✅ 已新增 ${ins.length} 個品項（${catStr}）`); ldMenus();
            } else {
              console.error('[parseOcr] insert error:', error);
              show('寫入失敗：' + error.message, 'error');
            }
          });
          return;
        } else {
          console.log('[parseOcr] JSON parsed but items empty or missing');
        }
      }
    } catch(e) { console.log('[parseOcr] JSON parse failed:', e.message, '→ fallback text parse'); }

    // Fallback：純文字解析（含關鍵字自動判斷分類）
    const DRINK_KW = ['茶','咖啡','飲料','奶','拿鐵','冰','沙瓦','汽水','果汁','豆漿','鮮奶','珍珠','布丁','布丁奶','紅茶','綠茶','烏龍','可樂','啤酒','酒','水','氣泡','酸梅','梅','仙草','愛玉','粉','漿','shake','latte','tea','coffee','milk','juice','soda','drink'];
    const OTHER_KW = ['運費','湯','蛋','加購','配料','加料','加麵','加飯','甜點','布丁','蛋糕','甜'];
    const guessCategory = (name) => {
      const n = name.toLowerCase();
      if (DRINK_KW.some(k => n.includes(k))) return 'drink';
      if (OTHER_KW.some(k => n.includes(k))) return 'other';
      return 'main';
    };
    const lines = text.split('\n').filter(l => l.trim()); const items = [];
    lines.forEach(l => { let mt = l.match(/(.+?)\s+[NT$＄]*(\d+)/); if (!mt) mt = l.match(/(.+?)[\s\t]+(\d+)/); if (mt && mt[1].trim().length > 0) items.push({ name: mt[1].trim().replace(/[\.\-\s]+$/, ''), price: parseInt(mt[2]) }); else if (l.trim().length > 1 && !/^\d+$/.test(l.trim())) items.push({ name: l.trim(), price: 0 }); });
    if (!items.length) { show('無法解析，請手動輸入', 'warning'); return }
    const ins = items.map(it => ({ name: it.name, price: it.price, category: guessCategory(it.name), merchant_id: mid || null, is_public: true, created_by: user?.id || null }));
    sb.from('menus').insert(ins).then(({ error }) => { if (!error) { show(`已新增 ${items.length} 個品項`); ldMenus() } else show('批次新增失敗', 'error') });

  const OrderPrintPage = () => {
    const [ords, setOrds] = useState([]); const [ld, setLd] = useState(true);
    const g = sel;
    useEffect(() => { if (g) { setLd(true); sb.from('orders').select('*').eq('group_buy_id', g.id).order('created_at', { ascending: true }).then(({ data }) => { setOrds(data || []); setLd(false); }); } }, [g]);
    const tot = ords.reduce((s, o) => s + parseFloat(o.amount || 0), 0);
    if (!g) return null;
    return (
      <div className="min-h-screen bg-white main-container">
        <Nav />
        <main className="max-w-5xl mx-auto px-4 py-6 print-area">
          <div className="flex justify-between items-start mb-6 no-print"><button onClick={() => setView('orderSelect')} className="text-orange-500 font-bold">← 返回選擇團購</button><button onClick={() => window.print()} className="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md flex items-center gap-2">🖨️ 列印訂單</button></div>
          <div className="border-2 border-gray-800 rounded-lg p-6 mb-6 text-center"><h2 className="text-2xl font-black text-gray-900 mb-2">{g.title} - 訂單明細</h2><p className="text-gray-700 font-bold">🏪 商家：{g.shop_name} &nbsp;|&nbsp; 📅 截止：{fmtDT(g.end_date, g.description)} &nbsp;|&nbsp; 👤 主揪：{g.organizer_name}</p></div>
          {ld ? <div className="text-center py-10">載入中...</div> : (
            <div className="overflow-x-auto"><table className="w-full border-collapse border border-gray-300"><thead><tr className="bg-gray-100"><th className="border border-gray-300 p-3 text-left w-16">#</th><th className="border border-gray-300 p-3 text-left w-32">姓名</th><th className="border border-gray-300 p-3 text-left">訂購項目</th><th className="border border-gray-300 p-3 text-right w-28">金額</th></tr></thead><tbody>{ords.map((o, i) => (<tr key={o.id} className="hover:bg-gray-50"><td className="border border-gray-300 p-3 text-center text-gray-500">{i + 1}</td><td className="border border-gray-300 p-3 font-bold text-gray-800">{o.customer_name}</td><td className="border border-gray-300 p-3 text-gray-700 whitespace-pre-wrap">{o.items} {o.note ? <span className="text-xs text-gray-500 block mt-1">備註: {o.note}</span> : ''}</td><td className="border border-gray-300 p-3 text-right font-bold">NT${parseFloat(o.amount).toLocaleString()}</td></tr>))}<tr className="bg-gray-50 font-black text-lg"><td colSpan="3" className="border border-gray-300 p-3 text-right">總計金額</td><td className="border border-gray-300 p-3 text-right text-red-600">NT${tot.toLocaleString()}</td></tr></tbody></table></div>
          )}
        </main>
      </div>
    );
  };

  const OrderSelectPage = () => {
    const [pwdTarget, setPwdTarget] = useState(null); // 待驗證的團購
    const [pwdInput, setPwdInput] = useState('');
    const doEnter = (g) => {
      if (g.password) { setPwdTarget(g); setPwdInput(''); }
      else { setSel(g); setView('orderPrint'); }
    };
    const confirmPwd = () => {
      if (pwdInput === pwdTarget.password) { setSel(pwdTarget); setView('orderPrint'); setPwdTarget(null); setPwdInput(''); }
      else show('密碼錯誤', 'error');
    };
    return (
      <div className="min-h-screen bg-pattern">
        <Nav />
        <main className="max-w-6xl mx-auto px-4 py-6">
          <button onClick={goHome} className="text-orange-500 font-bold mb-4 inline-block">← 返回首頁</button>
          <div className="flex items-center justify-between mb-4"><h2 className="text-2xl font-black text-orange-900">📑 選擇要查看訂單的團購</h2><button onClick={ldGbs} className="text-sm text-orange-500 hover:text-orange-700">🔄 重整</button></div>
          {loading ? <div className="text-center py-16 text-orange-400">載入中...</div> : gbs.length === 0 ? <div className="text-center py-16"><p>沒有團購資料</p></div> : 
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{gbs.map((g, i) => (<div key={g.id} className="bg-white rounded-2xl shadow-sm cursor-pointer p-4 border border-orange-50 hover:border-blue-400 hover:shadow-lg transition anim-fade" style={{ animationDelay: `${Math.min(i, 6) * 50}ms` }} onClick={() => doEnter(g)}><div className="flex justify-between items-start mb-2"><h3 className="font-bold text-gray-900 leading-tight">{g.title}</h3><span className="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-500">{g.password ? '🔒 需要密碼' : '點擊查看'}</span></div><div className="space-y-1 text-sm text-gray-600"><p>🏪 {g.shop_name}</p><p>📅 {fmtDT(g.end_date, g.description)}</p><p>👤 {g.organizer_name}</p></div></div>))}</div>
          }
          {pwdTarget && (
            <div className="fixed inset-0 bg-black/50 modal-bk z-50 flex items-center justify-center p-4" onClick={() => setPwdTarget(null)}>
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full anim-pop" onClick={e => e.stopPropagation()}>
                <h3 className="text-lg font-black text-orange-900 mb-1">🔒 需要密碼</h3>
                <p className="text-sm text-gray-500 mb-4">「{pwdTarget.title}」設有密碼保護</p>
                <input
                  type="password"
                  placeholder="請輸入團購密碼"
                  value={pwdInput}
                  onChange={e => setPwdInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && confirmPwd()}
                  autoFocus
                  className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl text-center text-lg focus:border-orange-500 focus:outline-none mb-4"
                />
                <div className="flex gap-2">
                  <button onClick={() => setPwdTarget(null)} className="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold">取消</button>
                  <button onClick={confirmPwd} className="flex-1 py-2.5 btn-p rounded-xl font-bold shadow">確認</button>
                </div>
              </div>
            </div>
          )}
        </main>
      </div>
    );
  };

  const Detail = () => {
    const [ords, setOrds] = useState([]); const [ldO, setLdO] = useState(true); const [dm, setDm] = useState([]); const [sc, setSc] = useState(false);
    const g = sel; const act = isAct(g.end_date); const [oName, setOName] = useState(''); const [rowStates, setRowStates] = useState({});

    useEffect(() => {

cus:border-orange-500 focus:outline-none" /><input type="time" required value={f.endTime} onChange={e => setF({ ...f, endTime: e.target.value })} className="flex-1 px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none text-center" /></div></div><div><label className="block text-sm font-bold text-orange-900 mb-1">說明</label><textarea value={f.desc} onChange={e => setF({ ...f, desc: e.target.value })} rows={2} maxLength={500} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl resize-none" /></div><label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-orange-50"><input type="checkbox" checked={f.priv} onChange={e => setF({ ...f, priv: e.target.checked })} className="w-4 h-4 rounded accent-orange-600" /><span className="text-orange-900 font-medium text-sm">🔒 私人團購（需密碼）</span></label>{f.priv && <div className="anim-fade"><input type="text" value={f.pwd} onChange={e => setF({ ...f, pwd: e.target.value })} placeholder="設定密碼" maxLength={20} className="w-full px-3 py-2.5 border-2 border-yellow-300 rounded-xl" /></div>}<button type="submit" disabled={sub} className={`w-full py-3.5 btn-p rounded-xl font-bold text-lg shadow-lg ${sub ? 'opacity-50' : ''}`}>{sub ? '建立中...' : '🚀 建立團購'}</button></form></div></div><div className="lg:col-span-2"><div className="bg-white rounded-2xl shadow-md border overflow-hidden anim-fade sticky top-16"><div className="bg-gradient-to-r from-green-500 to-teal-500 px-4 py-3 text-white"><h3 className="font-bold text-sm">📋 菜單預覽</h3></div><div className="p-3">{mm.length > 0 ? (<><div className="flex gap-1 mb-2 flex-wrap">{[{ k: 'all', l: '全部' }, ...CATS.map(c => ({ k: c.k, l: c.s }))].map(c => <button key={c.k} onClick={() => setMt(c.k)} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${mt === c.k ? 'bg-green-100 text-green-800' : 'text-gray-400 hover:bg-gray-100'}`}>{c.l}</button>)}</div><div className="space-y-1.5 max-h-[400px] overflow-y-auto pr-1">{fmm.map(it => <di       case 'orderPrint': return <OrderPrintPage />; 
      case 'admin': return isAdmin ? <AdminPage /> : <Home />; 
      default: return <Home /> 
    } 
  };
  return (<>{R()}{toast && <Toast {...toast} onClose={() => setToast(null)} />}{shareModal && <ShareModal groupBuy={shareModal} onClose={() => { setShareModal(null); setView('home') }} />}{showHelp && <HelpModal onClose={() => setShowHelp(false)} />}{showAdminLogin && <Modal onClose={() => setShowAdminLogin(false)} title="🛡️ 管理者登入"><div className="p-6 space-y-4"><input type="password" id="admin-pwd-input" placeholder="管理者密碼" className="w-full h-[52px] px-4 border-2 border-red-200 rounded-xl text-center text-lg focus:border-red-500 focus:outline-none" onKeyDown={e => { if (e.key === 'Enter') { checkAdminPwd(e.target.value) } }} /><button onClick={() => { const v = document.getElementById('admin-pwd-input')?.value; checkAdminPwd(v) }} className="w-full h-[52px] bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition shadow-lg">登入管理後台</button></div></Modal>}{showProfile && user && <ProfileModal user={user} profile={userProfile} onClose={() => setShowProfile(false)} onSave={() => sb.from('profiles').select('*').eq('id', user.id).single().then(({data})=>setUserProfile(data))} />}</>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GroupBuyApp />);
setTimeout(() => document.getElementById('loading-screen').classList.add('hide'), 1000);
</script>
</body>
</html>
