  const [prog, setProg] = useState(0); const [stat, setStat] = useState('準備中...'); const [scanning, setScanning] = useState(false); const [img, setImg] = useState(null); const [result, setResult] = useState(''); const fRef = useRef(); const canvasRef = useRef();
  const onFile = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => setImg(ev.target.result); r.readAsDataURL(f); };
  const preprocessImage = (imgSrc) => new Promise((resolve) => {
    const canvas = canvasRef.current || document.createElement('canvas'); const ctx = canvas.getContext('2d'); const image = new Image();
    image.onload = () => {
      const scale = Math.max(1, 1500 / Math.max(image.width, image.height)); canvas.width = image.width * scale; canvas.height = image.height * scale; ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) { const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; const v = gray > 140 ? 255 : (gray > 80 ? gray * 1.5 : 0); d[i] = d[i + 1] = d[i + 2] = Math.min(255, v); }
      ctx.putImageData(imgData, 0, 0); resolve(canvas.toDataURL('image/png'));
    }; image.src = imgSrc;
  });
  const cleanOcrText = (text) => { let t = text.replace(/[|｜l1]/g, m => m === '|' || m === '｜' ? '' : m); t = t.replace(/([^\d\s])(\d{2,})/g, '$1 $2'); t = t.replace(/[^\u4e00-\u9fff\u3400-\u4dbf\w\s\.\-\+\(\)（）\/,，、$＄:：·]+/g, ' '); t = t.replace(/[ \t]+/g, ' '); t = t.split('\n').filter(l => l.trim().length > 1).join('\n'); return t.trim(); };
  const doOcr = async () => { if (!img) return; setScanning(true); setStat('前處理圖片...'); setProg(5); try { const processed = await preprocessImage(img); setProg(10); setStat('載入辨識引擎...'); const w = await Tesseract.createWorker('chi_tra+eng', 1, { logger: m => { if (m.status === 'recognizing text') { setProg(10 + Math.round(m.progress * 85)); setStat(`辨識中... ${Math.round(m.progress * 100)}%`) } } }); await w.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' }); const { data: { text } } = await w.recognize(processed); await w.terminate(); const cleaned = cleanOcrText(text); setResult(cleaned); setStat('辨識完成！'); setProg(100); } catch (err) { setStat('失敗：' + err.message); setProg(0); } setScanning(false); };
  return (<Modal onClose={onClose} title={`📸 拍照建立菜單${merchantName ? ' — ' + merchantName : ''}`} wide><div className="p-5 space-y-4"><canvas ref={canvasRef} style={{ display: 'none' }} /><p className="text-sm text-gray-500">上傳菜單照片，系統自動辨識。</p><div className="flex flex-wrap gap-3"><input ref={fRef} type="file" accept="image/*" capture="environment" onChange={onFile} /><button onClick={() => fRef.current?.click()} className="px-5 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700">📷 拍照 / 選圖</button>{img && !scanning && <button onClick={doOcr} className="px-5 py-3 btn-b rounded-xl font-bold">🔍 開始辨識</button>}</div>{img && <div className="border-2 border-dashed border-orange-200 rounded-xl p-2 bg-orange-50"><img src={img} className="max-h-56 mx-auto rounded-lg" /></div>}{scanning && <div className="space-y-2"><div className="flex items-center gap-3"><div className="spinner"></div><span className="text-sm text-orange-700">{stat}</span></div><div className="w-full bg-gray-200 rounded-full h-2.5"><div className="bg-orange-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${prog}%` }}></div></div></div>}{result && <div className="space-y-3"><label className="text-sm font-bold text-orange-900">辨識結果（可編輯）：</label><textarea value={result} onChange={e => setResult(e.target.value)} rows={8} className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none text-sm resize-none font-mono" /><button onClick={() => onResult(result)} className="w-full py-3 btn-p rounded-xl font-bold shadow-lg">✅ 使用辨識結果建立菜單</button></div>}{!img && !scanning && <div className="border-2 border-dashed border-gray-200 rounded-xl p-10 text-center text-gray-400"><p className="text-4xl mb-2">📷</p><p className="text-sm">點擊上方按鈕拍照或選圖</p></div>}</div></Modal>);
}

function BatchMenuForm({ onBatchSave, onClose }) {

  const validRows = rows.filter(r => r.name.trim() && r.price);
  const submit = async () => { if (!validRows.length) { alert('請至少輸入一個品項'); return; } setSaving(true); const items = validRows.map(r => ({ name: r.name.trim(), price: parseFloat(r.price), category: r.category, has_custom_options: r.has_custom_options, is_public: true })); const ok = await onBatchSave(items); if (ok) { setSaved(p => [...p, ...items]); setRows([emptyRow(), emptyRow(), emptyRow()]) } setSaving(false); };

      } catch(e) {}
    }, []);

    const handleGuest = () => { if (n.trim()) { setGuestName(n.trim()); setIsGuest(true); setView('home') } else show('請輸入姓名', 'error') };
    const gLogin = async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }); if (error) show('登入失敗', 'error') };
    
    const handleEmailAuth = async (e) => {
      e.preventDefault();
      setLoading(true);
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: cred.email, password: cred.password });
        if (error) { show('登入失敗：' + error.message, 'error'); }
        else {
          // 記住帳密或清除
          if (remember) {
            localStorage.setItem(REMEMBER_KEY, JSON.stringify({ email: cred.email, password: cred.password }));
          } else {
            localStorage.removeItem(REMEMBER_KEY);
          }
          setView('home');
        }
      } else {
        // Sign Up
        if (!cred.full_name || !cred.org) { show('請填寫姓名與服務機關', 'error'); setLoading(false); return; }
        const { data, error } = await sb.auth.signUp({ 
          email: cred.email, 
          password: cred.password,
          options: { data: { full_name: cred.full_name } } 
        });
        if (error) { show(error.message, 'error'); } 
        else if (data.user) {
          await sb.from('profiles').insert([{ id: data.user.id, full_name: cred.full_name, organization: cred.org, unit: cred.unit }]);
          show('註冊成功，已自動登入！');
          setView('home');

      setLoading(false);

    return (<div className="min-h-screen bg-pattern flex flex-col items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full border border-orange-100 anim-pop">
        <div className="text-center mb-4"><div className="text-4xl mb-2">🍱</div><h2 className="text-xl font-black text-orange-900">歡迎使用團購GO</h2></div>
        
        {/* Tabs */}
        <div className="flex bg-gray-100 p-1 rounded-xl mb-4">
          {['login', 'signup', 'guest'].map(m => (
            <button key={m} onClick={() => setMode(m)} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${mode === m ? 'bg-white text-orange-600 shadow-sm' : 'text-gray-400'}`}>
              {m==='login'?'登入':m==='signup'?'註冊':'訪客'}
            </button>
          ))}
        </div>

        {mode === 'guest' ? (
          <div className="space-y-3">
            <input type="text" value={n} onChange={e => setN(e.target.value)} placeholder="輸入姓名" maxLength={20} className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl text-center text-lg" onKeyDown={e => e.key === 'Enter' && handleGuest()} />
            <button onClick={handleGuest} className="w-full py-3 btn-p rounded-xl font-bold text-lg shadow-lg">以訪客身份進入</button>
            <p className="text-xs text-gray-400 text-center">＊訪客無法紀錄機關單位</p>
          </div>
        ) : (
          <form onSubmit={handleEmailAuth} className="space-y-3">
            {mode === 'signup' && (
              <>
                <input required type="text" placeholder="真實姓名 *" value={cred.full_name} onChange={e => setCred({...cred, full_name: e.target.value})} className="w-full px-3 py-2 border rounded-xl" />
                <div className="flex gap-2">
                  <input required type="text" placeholder="服務機關 *" value={cred.org} onChange={e => setCred({...cred, org: e.target.value})} className="w-full px-3 py-2 border rounded-xl flex-1" />
                  <input type="text" placeholder="單位 (選填)" value={cred.unit} onChange={e => setCred({...cred, unit: e.target.value})} className="w-full px-3 py-2 border rounded-xl flex-1" />
                </div>
              </>
            )}
            <input required type="email" placeholder="Email" value={cred.email} onChange={e => setCred({...cred, email: e.target.value})} className="w-full px-3 py-2 border rounded-xl" />
            <input required type="password" placeholder="密碼 (至少6碼)" minLength={6} value={cred.password} onChange={e => setCred({...cred, password: e.target.value})} className="w-full px-3 py-2 border rounded-xl" />
            {mode === 'login' && (
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} className="w-4 h-4 rounded accent-orange-600" />
                <span className="text-sm text-gray-500">記住帳號密碼</span>
              </label>

            <div className="relative my-3"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200"></div></div><div className="relative flex justify-center"><span className="px-3 bg-white text-gray-400 text-xs">快速登入</span></div></div>
            <button type="button" onClick={gLogin} className="w-full py-2 bg-white border border-gray-300 rounded-xl font-medium text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-2 text-sm">Google 登入</button>
          </form>

      </div>
      <div className="max-w-sm w-full"><Disclaimer /></div>
    </div>);
  };

  const MerchantsPage = () => {
    const [sf, setSf] = useState(false); const [em, setEm] = useState(null); const [f, setF] = useState({ name: '', description: '', phone: '', address: '', city: '', district: '' });
    const [activeM, setActiveM] = useState(null); const [mm, setMm] = useState([]); const [tab, setTab] = useState('all');
    const [menuSf, setMenuSf] = useState(false); const [menuEd, setMenuEd] = useState(null); const [copyFrom, setCopyFrom] = useState(null); const [copyTo, setCopyTo] = useState('');
    const [ocr, setOcr] = useState(false); const [brandPicker, setBrandPicker] = useState(false);

    const reset = () => { setF({ name: '', description: '', phone: '', address: '', city: '', district: '' }); setEm(null); setSf(false) };
    const composeAddr = (city, district, street) => `${city}${district}${street ? (' ' + street).trimStart() : ''}`.trim();
    const save = async (e) => { e.preventDefault(); if (!f.name.trim()) return; const fullAddr = composeAddr(f.city, f.district, f.address); if (em) { await sb.from('merchants').update({ name: f.name, description: f.description, phone: f.phone, address: fullAddr }).eq('id', em); show('已更新') } else { const { error } = await sb.from('merchants').insert([{ name: f.name, description: f.description, phone: f.phone, address: fullAddr, owner_id: user?.id || null, is_public: true }]); if (error) show('失敗', 'error'); else show('商家已建立') } reset(); ldM() };
    const del = async (id) => { if (!confirm('確定刪除？菜單也會一併刪除')) return; await sb.from('merchants').delete().eq('id', id); show('已刪除'); ldM(); if (activeM === id) setActiveM(null) };
    const mCnt = (mid) => allMenus.filter(x => x.merchant_id === mid).length;
    useEffect(() => { if (activeM) { const items = allMenus.filter(x => x.merchant_id === activeM); setMm(items) } else setMm([]) }, [activeM, allMenus]);
    const filtered = tab === 'all' ? mm : mm.filter(x => x.category === tab);
    const saveItem = async (item) => { const p = { ...item, merchant_id: activeM, created_by: user?.id || null }; if (menuEd) { await sb.from('menus').update(p).eq('id', menuEd); show('已更新'); setMenuEd(null); setMenuSf(false); ldMenus() } else { const { error } = await sb.from('menus').insert([p]); if (error) { show('失敗', 'error') } else { show('已新增'); ldMenus() } } };
    const batchSaveItems = async (items) => { const ins = items.map(it => ({ ...it, merchant_id: activeM, created_by: user?.id || null })); const { error } = await sb.from('menus').insert(ins); if (error) { show('批次新增失敗', 'error'); return false } show(`✅ 已新增 ${items.length} 個品項`); ldMenus(); return true };
    const delItem = async (id) => { if (!confirm('確定刪除？')) return; await sb.from('menus').delete().eq('id', id); show('已刪除'); ldMenus() };
    
    const doCopy = async () => { if (!copyFrom || !copyTo) return; const srcItems = allMenus.filter(x => x.merchant_id === copyFrom); if (!srcItems.length) { show('來源商家沒有菜單', 'warning'); return } const ins = srcItems.map(it => ({ name: it.name, price: it.price, category: it.category, description: it.description, sizes: it.sizes, has_custom_options: it.has_custom_options, merchant_id: copyTo, is_public: it.is_public, created_by: user?.id || null })); const { error } = await sb.from('menus').insert(ins); if (error) show('複製失敗', 'error'); else { show(`已複製 ${ins.length} 個品項`); ldMenus() } setCopyFrom(null); setCopyTo('') };
    
    const actMerchant = merchants.find(m => m.id === activeM);
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-6xl mx-auto px-4 py-6"><button onClick={goHome} className="text-orange-600 hover:text-orange-800 mb-3 inline-block text-sm">← 返回首頁</button><div className="flex flex-wrap items-center justify-between gap-3 mb-5"><h2 className="text-xl font-black text-orange-900">🏪 商家菜單管理</h2><div className="flex gap-2"><button onClick={() => { setSf(!sf); setEm(null); setF({ name: '', description: '', phone: '', address: '', city: '', district: '' }) }} className="px-4 py-2 btn-p rounded-xl font-bold text-sm">{sf ? '✕ 收起' : '➕ 新增商家'}</button><button onClick={() => setCopyFrom(copyFrom ? null : 'pick')} className="px-4 py-2 btn-b rounded-xl font-bold text-sm">📋 複製菜單</button></div></div>
    {copyFrom && <div className="bg-blue-50 rounded-2xl p-5 border border-blue-200 mb-5 anim-slide"><h3 className="font-bold text-blue-900 mb-3">📋 複製菜單到其他商家</h3><div className="grid sm:grid-cols-3 gap-3 items-end"><div><label className="block text-sm font-bold text-blue-800 mb-1">從（來源商家）</label><select value={copyFrom === 'pick' ? '' : copyFrom} onChange={e => setCopyFrom(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl"><option value="">選擇來源...</option>{merchants.map(m => <option key={m.id} value={m.id}>{m.name}（{mCnt(m.id)}品項）</option>)}</select></div><div><label className="block text-sm font-bold text-blue-800 mb-1">到（目標商家）</label><select value={copyTo} onChange={e => setCopyTo(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl"><option value="">選擇目標...</option>{merchants.filter(m => m.id !== copyFrom).map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></div><button onClick={doCopy} disabled={!copyFrom || copyFrom === 'pick' || !copyTo} className="px-5 py-2.5 btn-g rounded-xl font-bold text-sm disabled:opacity-40">執行複製</button></div><p className="text-xs text-blue-600 mt-2">＊同品名的飲料/主餐可以一次複製到不同分店</p></div>}
    {sf && <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-5 anim-slide"><h3 className="font-bold text-orange-900 mb-3">{em ? '✏️ 編輯商家' : '➕ 新增商家'}</h3><form onSubmit={save} className="space-y-3"><div className="grid sm:grid-cols-2 gap-3"><div><label className="block text-sm font-bold text-orange-900 mb-1">名稱 *</label><input type="text" required value={f.name} onChange={e => setF({ ...f, name: e.target.value })} placeholder="王記便當" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div><label className="block text-sm font-bold text-orange-900 mb-1">電話</label><input type="text" value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div></div><div className="grid sm:grid-cols-2 gap-3"><div><label className="block text-sm font-bold text-orange-900 mb-1">縣市</label><select value={f.city} onChange={e => setF({ ...f, city: e.target.value, district: '' })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"><option value="">-- 選擇縣市 --</option>{TW_CITIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div><div><label className="block text-sm font-bold text-orange-900 mb-1">鄉鎮市區</label><select value={f.district} onChange={e => setF({ ...f, district: e.target.value })} disabled={!f.city} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none disabled:bg-gray-100"><option value="">-- 選擇區域 --</option>{(TW_REGIONS[f.city] || []).map(d => <option key={d} value={d}>{d}</option>)}</select></div></div><div><label className="block text-sm font-bold text-orange-900 mb-1">詳細地址</label><input type="text" value={f.address} onChange={e => setF({ ...f, address: e.target.value })} placeholder="路/街/巷/號" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div className="flex gap-2"><button type="submit" className="px-5 py-2.5 btn-p rounded-xl font-bold">{em ? '💾 儲存' : '➕ 建立'}</button><button type="button" onClick={reset} className="px-5 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold">取消</button></div></form></div>}<div className="grid lg:grid-cols-3 gap-5"><div className="lg:col-span-1"><div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">{merchants.map(m => { const loc = parseCityDist(m.address); return (<div key={m.id} onClick={() => setActiveM(m.id)} className={`m-card bg-white rounded-xl shadow-sm p-3.5 cursor-pointer ${activeM === m.id ? 'border-orange-400 bg-orange-50' : ''}`}><div className="flex justify-between items-start"><div className="min-w-0"><h3 className="font-bold text-orange-900 truncate">{m.name}</h3>{loc.city && <p className="text-xs text-blue-600 mt-0.5">📍 {loc.city}{loc.district}</p>}{m.phone && <p className="text-xs text-gray-400">📞 {m.phone}</p>}</div><span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full shrink-0">{mCnt(m.id)}</span></div><div className="flex gap-2 mt-2"><button onClick={e => { e.stopPropagation(); setEm(m.id); const p = parseCityDist(m.address); setF({ name: m.name, description: m.description || '', phone: m.phone || '', address: p.street, city: p.city, district: p.district }); setSf(true); scrollTo({ top: 0, behavior: 'smooth' }) }} className="text-xs text-blue-500 font-bold">✏️</button><button onClick={e => { e.stopPropagation(); del(m.id) }} className="text-xs text-red-400 font-bold">🗑</button></div></div>) })}</div></div><div className="lg:col-span-2">{activeM && actMerchant ? (<div className="anim-fade"><div className="bg-white rounded-2xl shadow-md p-4 border border-blue-100 mb-4"><div className="flex justify-between items-center"><div><h3 className="text-lg font-bold text-blue-900">🏪 {actMerchant.name} 的菜單</h3><p className="text-sm text-gray-400 mt-0.5">{mm.length} 品項</p></div><div className="flex gap-2"><button onClick={() => { setMenuSf(!menuSf); setMenuEd(null) }} className="px-3 py-1.5 btn-p rounded-lg font-bold text-xs">{menuSf && !menuEd ? '✕' : '➕ 批次新增'}</button><button onClick={() => setBrandPicker(true)} className="px-3 py-1.5 btn-g rounded-lg font-bold text-xs">🧋 品牌匯入</button><button onClick={() => setOcr(true)} className="px-3 py-1.5 btn-b rounded-lg font-bold text-xs">📸 OCR</button></div></div></div><div className="flex gap-1.5 mb-3 flex-wrap"><span onClick={() => setTab('all')} className={`cpill ${tab === 'all' ? 'cpill-a' : 'cpill-i'}`}>全部</span>{CATS.map(c => <span key={c.k} onClick={() => setTab(c.k)} className={`cpill ${tab === c.k ? 'cpill-a' : 'cpill-i'}`}>{c.s}</span>)}</div>{menuEd && <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-4 anim-slide"><h3 className="font-bold text-orange-900 mb-3">✏️ 編輯品項</h3><MenuItemForm onSave={saveItem} editData={mm.find(x => x.id === menuEd)} onCancel={() => { setMenuEd(null); setMenuSf(false) }} /></div>}{menuSf && !menuEd && <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-4 anim-slide"><h3 className="font-bold text-orange-900 mb-3">➕ 批次新增品項</h3><BatchMenuForm onBatchSave={batchSaveItems} onClose={() => setMenuSf(false)} /></div>}<MenuList items={filtered} onEdit={(it) => { setMenuEd(it.id); setMenuSf(true) }} onDelete={delItem} />{ocr && <OcrScanner onResult={(t) => { setOcr(false); parseOcr(t, activeM) }} onClose={() => setOcr(false)} merchantName={actMerchant.name} />}{brandPicker && <DrinkShopPicker brands={brandTpls} onImport={async (items) => { const ok = await batchSaveItems(items); if (ok) setBrandPicker(false) }} onClose={() => setBrandPicker(false)} onSave={saveBrandTpl} onDelete={delBrandTpl} onUploadImg={uploadImg} />}</div>) : (<div className="flex items-center justify-center h-64 text-gray-400"><div className="text-center"><p className="text-4xl mb-2">👈</p><p>選擇左側商家來管理菜單</p></div></div>)}</div></div></main></div>);
  };

  const Create = () => {
    const dayLabel = (n) => { if (n === 0) return '今日'; if (n === 1) return '明日'; if (n === 2) return '後天'; return `${n}天後` };
    const fmtShortDate = (n) => { const d = new Date(Date.now() + n * 864e5); return `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）` };
    const quickActions = [{ label: `🍱 今日午餐 ${fmtShortDate(0)}`, title: `${dayLabel(0)}午餐團購 ${fmtShortDate(0)}`, date: todayS() }, { label: `🍱 明日午餐 ${fmtShortDate(1)}`, title: `${dayLabel(1)}午餐團購 ${fmtShortDate(1)}`, date: addDays(1) }, { label: `🍱 後天午餐 ${fmtShortDate(2)}`, title: `${dayLabel(2)}午餐團購 ${fmtShortDate(2)}`, date: addDays(2) },];
    const [f, setF] = useState({ title: '', shopName: '', endDate: '', endTime: '12:00', desc: '', priv: false, pwd: '', mid: '' }); const [sub, setSub] = useState(false); const [mm, setMm] = useState([]); const [mt, setMt] = useState('all');
    useEffect(() => { if (f.mid) { const m = merchants.find(x => x.id === f.mid); if (m) setF(p => ({ ...p, shopName: m.name })); sb.from('menus').select('*').eq('merchant_id', f.mid).order('category').order('name').then(({ data }) => { if (data) setMm(data) }) } else setMm([]) }, [f.mid]);
    const fmm = mt === 'all' ? mm : mm.filter(x => x.category === mt);
    const go = async (e) => { e.preventDefault(); if (sub) return; setSub(true); const code = genCode(); const descWithTime = (f.endTime ? "__et:" + f.endTime + "__" : "") + (f.desc || ""); const { data, error } = await sb.from('group_buys').insert([{ title: f.title, shop_name: f.shopName, end_date: f.endDate, is_private: f.priv, description: descWithTime || null, password: f.priv && f.pwd ? f.pwd : null, code, organizer_name: cName(), organizer_id: user?.id || null }]).select().single(); if (error) show('失敗: ' + error.message, 'error'); else { setShareModal(data); ldGbs() } setSub(false) };
    const applyQuick = (q) => { setF(p => ({ ...p, title: q.title, endDate: q.date })) };
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-4xl mx-auto px-4 py-6"><button onClick={goHome} className="text-orange-600 hover:text-orange-800 mb-3 inline-block text-sm">← 返回首頁</button><h2 className="text-xl font-black text-orange-900 mb-4">🛒 發起新團購</h2><div className="flex flex-wrap gap-2 mb-5"><span className="text-sm text-gray-500 py-2">快速建立：</span>{quickActions.map((q, i) => <button key={i} onClick={() => applyQuick(q)} className="quick-chip text-sm">{q.label}</button>)}</div><div className="grid lg:grid-cols-5 gap-5"><div className="lg:col-span-3"><div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 anim-slide"><form onSubmit={go} className="space-y-4"><div><label className="block text-sm font-bold text-orange-900 mb-1">團購名稱 *</label><input type="text" required value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="週五午餐便當" maxLength={100} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div><label className="block text-sm font-bold text-orange-900 mb-1">商家 *</label><select value={f.mid} onChange={e => setF({ ...f, mid: e.target.value })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl mb-2"><option value="">-- 選擇已有商家 --</option>{merchants.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select><input type="text" required value={f.shopName} onChange={e => setF({ ...f, shopName: e.target.value, mid: '' })} placeholder="或直接輸入商家名稱" maxLength={100} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div><label className="block text-sm font-bold text-orange-900 mb-1">截止日期 / 時間 *</label><div className="flex gap-2"><input type="date" required value={f.endDate} onChange={e => setF({ ...f, endDate: e.target.value })} min={todayS()} max={maxDS()} className="flex-1 px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /><input type="time" required value={f.endTime} onChange={e => setF({ ...f, endTime: e.target.value })} className="flex-1 px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none text-center" /></div></div><div><label className="block text-sm font-bold text-orange-900 mb-1">說明</label><textarea value={f.desc} onChange={e => setF({ ...f, desc: e.target.value })} rows={2} maxLength={500} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl resize-none" /></div><label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-orange-50"><input type="checkbox" checked={f.priv} onChange={e => setF({ ...f, priv: e.target.checked })} className="w-4 h-4 rounded accent-orange-600" /><span className="text-orange-900 font-medium text-sm">🔒 私人團購（需密碼）</span></label>{f.priv && <div className="anim-fade"><input type="text" value={f.pwd} onChange={e => setF({ ...f, pwd: e.target.value })} placeholder="設定密碼" maxLength={20} className="w-full px-3 py-2.5 border-2 border-yellow-300 rounded-xl" /></div>}<button type="submit" disabled={sub} className={`w-full py-3.5 btn-p rounded-xl font-bold text-lg shadow-lg ${sub ? 'opacity-50' : ''}`}>{sub ? '建立中...' : '🚀 建立團購'}</button></form></div></div><div className="lg:col-span-2"><div className="bg-white rounded-2xl shadow-md border overflow-hidden anim-fade sticky top-16"><div className="bg-gradient-to-r from-green-500 to-teal-500 px-4 py-3 text-white"><h3 className="font-bold text-sm">📋 菜單預覽</h3></div><div className="p-3">{mm.length > 0 ? (<><div className="flex gap-1 mb-2 flex-wrap">{[{ k: 'all', l: '全部' }, ...CATS.map(c => ({ k: c.k, l: c.s }))].map(c => <button key={c.k} onClick={() => setMt(c.k)} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${mt === c.k ? 'bg-green-100 text-green-800' : 'text-gray-400 hover:bg-gray-100'}`}>{c.l}</button>)}</div><div className="space-y-1.5 max-h-[400px] overflow-y-auto pr-1">{fmm.map(it => <div key={it.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-green-50 text-sm"><div className="flex-1 min-w-0"><p className="font-bold text-gray-800 truncate">{it.name}</p>{it.sizes && <p className="text-xs text-gray-400">{it.sizes.map(s => s.label).join(' / ')}</p>}</div><span className="font-bold text-green-700 shrink-0 text-xs">{it.sizes ? it.sizes.map(s => `$${s.price}`).join('/') : (`NT$${it.price}`)}</span></div>)}</div></>) : <div className="text-center py-8 text-gray-300"><p className="text-2xl mb-1">📋</p><p className="text-xs">{f.mid ? '此商家尚無菜單' : '選擇商家顯示菜單'}</p></div>}</div></div></div></div></main></div>);
  };

  const AdminPage = () => {
    const [adminGbs, setAdminGbs] = useState([]); const delGb = async (id) => { if (!confirm('確定刪除？')) return; await sb.from('group_buys').delete().eq('id', id); setAdminGbs(p => p.filter(g => g.id !== id)); show('已刪除') };
    useEffect(() => { sb.from('group_buys').select('*').order('created_at', { ascending: false }).then(({ data }) => setAdminGbs(data || [])) }, []);
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-6xl mx-auto px-4 py-8"><h2 className="text-2xl font-black text-red-900 mb-6">🛡️ 管理者後台</h2><div className="bg-white p-6 rounded-3xl shadow-md"><h3 className="font-bold text-gray-800 mb-4">所有團購列表</h3><div className="space-y-2">{adminGbs.map(g => <div key={g.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl"><span>{g.title} ({g.shop_name})</span><button onClick={() => delGb(g.id)} className="text-red-500 text-sm">刪除</button></div>)}</div></div></main></div>);
  };

  const R = () => { 
    switch (view) { 
      case 'login': return <Login />; 
      case 'create': return <Create />; 
      case 'detail': return <Detail />; 
      case 'merchants': return <MerchantsPage />; 
      case 'orderSelect': return <OrderSelectPage />; 
      case 'orderPrint': return <OrderPrintPage />; 
      case 'admin': return isAdmin ? <AdminPage /> : <Home />; 
      default: return <Home /> 
    } 
  };
  return (<>{R()}{toast && <Toast {...toast} onClose={() => setToast(null)} />}{shareModal && <ShareModal groupBuy={shareModal} onClose={() => { setShareModal(null); setView('home') }} />}{showAdminLogin && <Modal onClose={() => setShowAdminLogin(false)} title="🛡️ 管理者登入"><div className="p-6 space-y-4"><input type="password" id="admin-pwd-input" placeholder="管理者密碼" className="w-full h-[52px] px-4 border-2 border-red-200 rounded-xl text-center text-lg focus:border-red-500 focus:outline-none" onKeyDown={e => { if (e.key === 'Enter') { checkAdminPwd(e.target.value) } }} /><button onClick={() => { const v = document.getElementById('admin-pwd-input')?.value; checkAdminPwd(v) }} className="w-full h-[52px] bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition shadow-lg">登入管理後台</button></div></Modal>}{showProfile && user && <ProfileModal user={user} profile={userProfile} onClose={() => setShowProfile(false)} onSave={() => sb.from('profiles').select('*').eq('id', user.id).single().then(({data})=>setUserProfile(data))} />}</>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GroupBuyApp />);
setTimeout(() => document.getElementById('loading-screen').classList.add('hide'), 1000);
</script>
</body>
</html>
