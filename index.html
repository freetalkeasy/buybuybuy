function BatchMenuForm({onBatchSave,onClose}){
  const emptyRow=()=>({_key:Date.now()+Math.random(),name:'',price:'',category:'main',has_custom_options:false});
  const[rows,setRows]=useState([emptyRow(),emptyRow(),emptyRow()]);
  const[saved,setSaved]=useState([]);
  const[saving,setSaving]=useState(false);
  const[presetOpen,setPresetOpen]=useState(false);
  const[presetSel,setPresetSel]=useState({});
  const nameRefs=useRef({});

  const updRow=(i,k,v)=>setRows(p=>p.map((r,j)=>j===i?{...r,[k]:v}:r));
  const rmRow=(i)=>setRows(p=>p.length<=1?[emptyRow()]:p.filter((_,j)=>j!==i));
  const addRows=(n=3)=>setRows(p=>{const nr=[...p];for(let i=0;i<n;i++)nr.push(emptyRow());return nr});

  // Auto-focus newly added rows
  const focusLast=useCallback(()=>{setTimeout(()=>{const keys=Object.keys(nameRefs.current);if(keys.length){const last=keys[keys.length-1];nameRefs.current[last]?.focus()}},50)},[]);

  // Preset toggle
  const togglePreset=(gIdx,item)=>{
    const key=`${gIdx}-${item}`;
    setPresetSel(p=>{const n={...p};if(n[key])delete n[key];else n[key]=item;return n});
  };
  const toggleGroup=(gIdx)=>{
    const grp=MENU_PRESETS[gIdx];
    const allSelected=grp.items.every(it=>presetSel[`${gIdx}-${it}`]);
    setPresetSel(p=>{const n={...p};grp.items.forEach(it=>{const key=`${gIdx}-${it}`;if(allSelected)delete n[key];else n[key]=it});return n});
  };
  const presetCount=Object.keys(presetSel).length;
  const applyPresets=()=>{
    const names=Object.values(presetSel);
    if(!names.length)return;
    const newRows=names.map(n=>({...emptyRow(),name:n}));
    setRows(p=>{const filled=p.filter(r=>r.name.trim());return[...filled,...newRows,emptyRow()]});
    setPresetSel({});setPresetOpen(false);
  };

  const validRows=rows.filter(r=>r.name.trim()&&r.price);
  const submit=async()=>{if(!validRows.length){alert('請至少輸入一個品項（品名＋價格）');return}
    setSaving(true);
    const items=validRows.map(r=>({name:r.name.trim(),price:parseFloat(r.price),category:r.category,has_custom_options:r.has_custom_options,is_public:true}));
    const ok=await onBatchSave(items);
    if(ok){setSaved(p=>[...p,...items]);setRows([emptyRow(),emptyRow(),emptyRow()])}
    setSaving(false);
  };

  // Quick paste: 一次貼上多行 "品名 價格"
  const handlePaste=(e)=>{
    const text=e.clipboardData?.getData('text');if(!text||!text.includes('\n'))return;
    e.preventDefault();
    const lines=text.split('\n').filter(l=>l.trim());
    const newRows=lines.map(l=>{
      const mt=l.match(/(.+?)\s+[NT$＄]*(\d+)/);
      if(mt)return{...emptyRow(),name:mt[1].trim(),price:mt[2]};
      return{...emptyRow(),name:l.trim()};
    });
    if(newRows.length)setRows(p=>{const filled=p.filter(r=>r.name.trim());return[...filled,...newRows,emptyRow()]});
  };

  return(<div className="space-y-4">
    {saved.length>0&&<div className="bg-green-50 rounded-xl p-3 border border-green-200 anim-fade">
      <p className="text-sm font-bold text-green-800 mb-1">✅ 已儲存 {saved.length} 個品項</p>
      <div className="flex flex-wrap gap-1">{saved.map((s,i)=><span key={i} className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">{s.name} ${s.price}</span>)}</div>
    </div>}

    {/* Preset selector */}
    <div>
      <button type="button" onClick={()=>setPresetOpen(!presetOpen)} className={`w-full text-left px-4 py-3 rounded-xl border-2 font-bold text-sm flex items-center justify-between transition ${presetOpen?'border-orange-400 bg-orange-50 text-orange-900':'border-orange-200 bg-white text-orange-700 hover:bg-orange-50'}`}>
        <span>📋 從常見品項快速選取{presetCount>0?`（已選 ${presetCount} 項）`:''}</span>
        <span className="text-orange-400">{presetOpen?'▲':'▼'}</span>
      </button>
      {presetOpen&&<div className="mt-2 bg-white rounded-xl border-2 border-orange-200 p-4 space-y-3 anim-fade max-h-[400px] overflow-y-auto">
        {MENU_PRESETS.map((g,gi)=>{const allSel=g.items.every(it=>presetSel[`${gi}-${it}`]);return(
          <div key={gi}>
            <div className="flex items-center gap-2 mb-2 cursor-pointer" onClick={()=>toggleGroup(gi)}>
              <input type="checkbox" checked={allSel} readOnly className="w-4 h-4 accent-orange-600 pointer-events-none"/>
              <span className="font-bold text-sm text-orange-900">{g.group}</span>
              <span className="text-xs text-gray-400">（{g.items.length}）</span>
            </div>
            <div className="flex flex-wrap gap-1.5 ml-6">{g.items.map(it=>{
              const sel=!!presetSel[`${gi}-${it}`];
              return <button key={it} type="button" onClick={()=>togglePreset(gi,it)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${sel?'bg-orange-500 text-white shadow':'bg-gray-100 text-gray-600 hover:bg-orange-100 hover:text-orange-800'}`}>{sel&&'✓ '}{it}</button>
            })}</div>
          </div>
        )})}
        <div className="flex items-center justify-between pt-3 border-t border-orange-100">
          <p className="text-sm text-orange-600 font-bold">{presetCount} 項已選</p>
          <div className="flex gap-2">
            <button type="button" onClick={()=>{setPresetSel({});setPresetOpen(false)}} className="px-3 py-1.5 bg-gray-200 text-gray-600 rounded-lg text-xs font-bold">取消</button>
            <button type="button" onClick={applyPresets} disabled={!presetCount} className={`px-4 py-1.5 btn-p rounded-lg text-xs font-bold shadow ${!presetCount?'opacity-40':''}`}>✅ 加入 {presetCount} 項到表格</button>
          </div>
        </div>
      </div>}
    </div>

    <p className="text-xs text-gray-400">每行一個品項，可直接貼上多行文字（格式：品名 價格）自動填入</p>
    <div className="space-y-2" onPaste={handlePaste}>
      {/* Header */}
      <div className="grid grid-cols-12 gap-2 px-1 text-xs font-bold text-orange-700">
        <span className="col-span-5">品名</span><span className="col-span-2">價格</span><span className="col-span-3">分類</span><span className="col-span-1">客製</span><span className="col-span-1"></span>
      </div>
      {rows.map((r,i)=><div key={r._key} className="grid grid-cols-12 gap-2 items-center">
        <input ref={el=>{if(el)nameRefs.current[r._key]=el}} type="text" value={r.name} onChange={e=>updRow(i,'name',e.target.value)} placeholder="品名" className="col-span-5 px-2.5 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none"
          onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();if(i===rows.length-1){addRows(1);focusLast()}}}}/>
        <input type="number" value={r.price} onChange={e=>updRow(i,'price',e.target.value)} placeholder="$" min="0" className="col-span-2 px-2.5 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none"/>
        <select value={r.category} onChange={e=>updRow(i,'category',e.target.value)} className="col-span-3 px-2 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none">{CATS.map(c=><option key={c.k} value={c.k}>{c.s}</option>)}</select>
        <div className="col-span-1 flex justify-center"><input type="checkbox" checked={r.has_custom_options} onChange={e=>updRow(i,'has_custom_options',e.target.checked)} className="w-4 h-4 accent-orange-600" title="甜度冰塊"/></div>
        <button type="button" onClick={()=>rmRow(i)} className="col-span-1 text-red-300 hover:text-red-500 text-lg text-center" title="移除">×</button>
      </div>)}
    </div>

    <div className="flex flex-wrap gap-2">
      <button type="button" onClick={()=>{addRows(3);focusLast()}} className="px-4 py-2 bg-orange-50 text-orange-700 border-2 border-orange-200 rounded-xl font-bold text-sm hover:bg-orange-100">＋ 新增 3 行</button>
      <button type="button" onClick={()=>{addRows(5);focusLast()}} className="px-4 py-2 bg-orange-50 text-orange-700 border-2 border-orange-200 rounded-xl font-bold text-sm hover:bg-orange-100">＋ 新增 5 行</button>
    </div>

    <div className="flex items-center justify-between pt-3 border-t border-orange-100">
      <p className="text-sm text-orange-700 font-bold">{validRows.length} 個品項待儲存</p>
      <div className="flex gap-2">
        <button type="button" onClick={onClose} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">收起</button>
        <button type="button" onClick={submit} disabled={!validRows.length||saving} className={`px-6 py-2.5 btn-g rounded-xl font-bold text-sm shadow ${(!validRows.length||saving)?'opacity-40':''}`}>{saving?'儲存中...':'✅ 全部儲存（'+validRows.length+'）'}</button>
      </div>
    </div>
  </div>);
}

// ===== DRINK SHOP PICKER (紙本菜單風格品牌匯入) =====
function DrinkShopPicker({brands,onImport,onClose,onSave,onDelete,onUploadImg}){
  const[shop,setShop]=useState(null);
  const[sel,setSel]=useState({});
  const[editMode,setEditMode]=useState(false);
  const[ed,setEd]=useState(null);  // deep-clone for editing
  const[saving,setSaving]=useState(false);
  const[newBrand,setNewBrand]=useState(false);
  const[nbf,setNbf]=useState({brand:'',emoji:'🧋',sizes:'M(中杯),L(大杯)'});
  const imgRef=useRef();
  const selCount=Object.keys(sel).length;
  const shopList=brands&&brands.length?brands:SEED_BRANDS;

  const toggleItem=(ci,ii)=>{const k=`${ci}-${ii}`;setSel(p=>{const n={...p};if(n[k])delete n[k];else n[k]={catIdx:ci,itemIdx:ii};return n})};
  const toggleCat=(ci)=>{const cat=(ed||shop).cats[ci];const allS=cat.items.every((_,i)=>sel[`${ci}-${i}`]);setSel(p=>{const n={...p};cat.items.forEach((_,i)=>{const k=`${ci}-${i}`;if(allS)delete n[k];else n[k]={catIdx:ci,itemIdx:i}});return n})};
  const selectAll=()=>{const d=ed||shop;const tot=d.cats.reduce((s,c)=>s+c.items.length,0);if(selCount===tot){setSel({});return}const n={};d.cats.forEach((c,ci)=>c.items.forEach((_,ii)=>{n[`${ci}-${ii}`]={catIdx:ci,itemIdx:ii}}));setSel(n)};

  const doImport=()=>{
    const src=ed||shop;
    const items=Object.values(sel).map(({catIdx,itemIdx})=>{
      const it=src.cats[catIdx].items[itemIdx];
      const sizes=src.sizes.map((label,si)=>it.p[si]!=null?{label,price:it.p[si]}:null).filter(Boolean);
      return{name:it.n,price:sizes.length?sizes[0].price:0,category:'drink',has_custom_options:true,is_public:true,
        sizes:sizes.length>1?sizes:null,
        description:[it.t,it.r?'◆推薦':'',it.cf?'無咖啡因':'',it.co?'冷飲限定':''].filter(Boolean).join(' | ')||null};
    });
    onImport(items);
  };

  // ---- Edit helpers ----
  const startEdit=()=>{setEditMode(true);setEd(JSON.parse(JSON.stringify(shop)))};
  const cancelEdit=()=>{setEditMode(false);setEd(null)};
  const updP=(ci,ii,si,v)=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats[ci].items[ii].p[si]=v===''?null:parseInt(v);return n})};
  const updN=(ci,ii,v)=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats[ci].items[ii].n=v;return n})};
  const updT=(ci,ii,v)=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats[ci].items[ii].t=v;return n})};
  const updCatN=(ci,v)=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats[ci].n=v;return n})};
  const rmItem=(ci,ii)=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats[ci].items.splice(ii,1);return n})};
  const addItem=(ci)=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats[ci].items.push({n:'',p:n.sizes.map(()=>null),t:''});return n})};
  const addCat=()=>{setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats.push({n:'新分類',items:[{n:'',p:n.sizes.map(()=>null)}]});return n})};
  const rmCat=(ci)=>{if(!confirm('確定刪除此分類？'))return;setEd(p=>{const n=JSON.parse(JSON.stringify(p));n.cats.splice(ci,1);return n})};

  const saveEdit=async()=>{if(!ed||!onSave)return;setSaving(true);
    const cleaned={...ed,cats:ed.cats.map(c=>({...c,items:c.items.filter(it=>it.n.trim())})).filter(c=>c.items.length>0)};
    await onSave(cleaned);setSaving(false);setEditMode(false);setShop(cleaned);setEd(null);
  };

  const handleImg=async(e)=>{const file=e.target.files?.[0];if(!file||!onUploadImg)return;
    const url=await onUploadImg(file);if(!url)return;
    if(editMode&&ed){setEd(p=>({...p,image_url:url}))}
    else if(shop){const u={...shop,image_url:url};if(onSave)await onSave(u);setShop(u)}
  };

  const createBrand=async()=>{if(!nbf.brand.trim()||!onSave)return;
    const szArr=nbf.sizes.split(',').map(s=>s.trim()).filter(Boolean);
    await onSave({brand:nbf.brand.trim(),emoji:nbf.emoji,sizes:szArr,sugars:SUGARS,ices:ICES,toppings:[],
      cats:[{n:'飲品',items:[{n:'新品項',p:szArr.map(()=>null)}]}]});
    setNewBrand(false);setNbf({brand:'',emoji:'🧋',sizes:'M(中杯),L(大杯)'});
  };

  const back=()=>{setShop(null);setSel({});setEditMode(false);setEd(null)};
  const d=ed||shop; // display data

  // ======== BRAND LIST ========
  if(!shop)return(<Modal onClose={onClose} title="🧋 連鎖品牌飲料菜單" wide><div className="p-5">
    <p className="text-sm text-gray-500 mb-4">菜單資料存放於資料庫，可直接編輯價格 / 品項 / 新增品牌，不需修改程式碼。</p>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">{shopList.map((s,i)=><div key={s._id||i} onClick={()=>setShop(s)} className="bg-white rounded-xl border-2 border-orange-100 p-4 cursor-pointer hover:border-orange-400 hover:shadow-md transition text-center group relative">
      {s.image_url&&<img src={s.image_url} className="w-full h-20 object-cover rounded-lg mb-2 border"/>}
      <div className="text-3xl mb-1">{s.emoji}</div>
      <h4 className="font-bold text-orange-900 text-sm">{s.brand}</h4>
      <p className="text-xs text-gray-400 mt-1">{s.cats.reduce((a,c)=>a+c.items.length,0)} 品項　{s.sizes.join('/')}</p>
      {s._id&&onDelete&&<button onClick={e=>{e.stopPropagation();if(confirm(`確定刪除「${s.brand}」？`))onDelete(s._id)}} className="absolute top-1.5 right-1.5 w-6 h-6 bg-red-100 text-red-500 rounded-full text-xs font-bold opacity-0 group-hover:opacity-100 transition flex items-center justify-center">×</button>}
    </div>)}</div>
    {onSave&&<div className="mt-4">{!newBrand
      ?<button onClick={()=>setNewBrand(true)} className="w-full py-3 border-2 border-dashed border-orange-300 rounded-xl text-orange-600 font-bold hover:bg-orange-50 text-sm">➕ 新增品牌</button>
      :<div className="bg-orange-50 rounded-xl p-4 border border-orange-200 anim-fade space-y-3">
        <h4 className="font-bold text-orange-900 text-sm">➕ 新增品牌</h4>
        <div className="grid sm:grid-cols-3 gap-2">
          <input value={nbf.brand} onChange={e=>setNbf({...nbf,brand:e.target.value})} placeholder="品牌名稱 *" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm"/>
          <input value={nbf.emoji} onChange={e=>setNbf({...nbf,emoji:e.target.value})} placeholder="Emoji" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm w-24"/>
          <input value={nbf.sizes} onChange={e=>setNbf({...nbf,sizes:e.target.value})} placeholder="尺寸（逗號分隔）" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm"/>
        </div>
        <div className="flex gap-2"><button onClick={createBrand} className="px-4 py-2 btn-p rounded-lg text-sm font-bold">建立</button><button onClick={()=>setNewBrand(false)} className="px-4 py-2 bg-gray-200 rounded-lg text-sm font-bold">取消</button></div>
      </div>}
    </div>}
  </div></Modal>);

  // ======== PAPER MENU VIEW ========
  const totalItems=d.cats.reduce((s,c)=>s+c.items.length,0);
  return(<Modal onClose={onClose} title={`${d.emoji} ${d.brand}`} wide><div className="flex flex-col" style={{maxHeight:'80vh'}}>
    {/* Header bar */}
    <div className="bg-orange-50 px-5 py-3 border-b border-orange-200 flex items-center justify-between shrink-0 flex-wrap gap-2">
      <button onClick={back} className="text-orange-600 text-sm font-bold hover:text-orange-800">← 返回品牌</button>
      <div className="flex items-center gap-2 flex-wrap">
        {!editMode&&<><button onClick={selectAll} className="text-xs text-blue-600 font-bold">{selCount===totalItems?'取消全選':'全選'}</button>
          <span className="text-sm text-orange-700 font-bold">已選 {selCount}</span></>}
        {d._id&&onSave&&<button onClick={editMode?cancelEdit:startEdit} className={`px-3 py-1 rounded-lg text-xs font-bold ${editMode?'bg-gray-200 text-gray-600':'bg-blue-100 text-blue-700'}`}>{editMode?'✕ 取消':'✏️ 編輯菜單'}</button>}
        {editMode&&<><input ref={imgRef} type="file" accept="image/*" className="hidden" onChange={handleImg}/><button onClick={()=>imgRef.current?.click()} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-lg text-xs font-bold">📷 上傳菜單照片</button></>}
      </div>
    </div>

    {/* Menu photo */}
    {d.image_url&&<div className="px-5 pt-3"><img src={d.image_url} className="w-full max-h-48 object-contain rounded-xl border-2 border-orange-100"/></div>}

    {/* Scrollable menu */}
    <div className="overflow-y-auto flex-1 px-5 py-4 space-y-5">
      {d.cats.map((cat,ci)=>{
        const catAllSel=cat.items.every((_,i)=>sel[`${ci}-${i}`]);
        const catSomeSel=cat.items.some((_,i)=>sel[`${ci}-${i}`]);
        return(<div key={ci} className="anim-fade" style={{animationDelay:`${ci*30}ms`}}>
          <div className="flex items-center gap-2 mb-2 cursor-pointer select-none" onClick={editMode?undefined:()=>toggleCat(ci)}>
            {!editMode&&<input type="checkbox" checked={catAllSel} readOnly className="w-4 h-4 accent-orange-600 pointer-events-none" ref={el=>{if(el)el.indeterminate=catSomeSel&&!catAllSel}}/>}
            {editMode?<><input value={cat.n} onChange={e=>updCatN(ci,e.target.value)} className="font-black text-orange-900 bg-white border-2 border-blue-200 rounded-lg px-2 py-1 text-sm flex-1"/>
              <button onClick={()=>rmCat(ci)} className="text-xs text-red-400 font-bold ml-1">🗑</button></>
            :<h3 className="font-black text-orange-900">{cat.n}</h3>}
            <span className="text-xs text-gray-400">（{cat.items.length}）</span>
          </div>
          <div className="overflow-x-auto"><table className="w-full text-sm border-collapse"><thead><tr className="border-b-2 border-orange-200 bg-orange-50/50">
            {!editMode&&<th className="py-1.5 px-1 w-8"></th>}
            <th className="py-1.5 px-2 text-left text-xs text-orange-700 font-bold">品項</th>
            {d.sizes.map((s,si)=><th key={si} className="py-1.5 px-2 text-center text-xs text-orange-700 font-bold min-w-[52px]">{s}</th>)}
            <th className="py-1.5 px-2 text-left text-xs text-gray-400 font-bold">備註</th>
            {editMode&&<th className="w-8"></th>}
          </tr></thead><tbody>{cat.items.map((it,ii)=>{
            const isSel=!!sel[`${ci}-${ii}`];
            return(<tr key={ii} onClick={editMode?undefined:()=>toggleItem(ci,ii)} className={`border-b border-orange-50 ${editMode?'':'cursor-pointer'} transition ${isSel&&!editMode?'bg-orange-50':'hover:bg-gray-50'}`}>
              {!editMode&&<td className="py-2 px-1 text-center"><input type="checkbox" checked={isSel} readOnly className="w-3.5 h-3.5 accent-orange-600 pointer-events-none"/></td>}
              <td className="py-2 px-2 whitespace-nowrap">{editMode
                ?<input value={it.n} onChange={e=>updN(ci,ii,e.target.value)} className="w-full px-2 py-1 border rounded-lg text-sm font-bold" placeholder="品名"/>
                :<span className="font-bold text-gray-800">{it.r&&<span className="text-orange-500 mr-0.5">◆</span>}{it.n}{it.cf&&<span className="ml-1.5 text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full">無咖啡因</span>}{it.co&&<span className="ml-1.5 text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">冷</span>}</span>}
              </td>
              {d.sizes.map((s,si)=><td key={si} className="py-2 px-2 text-center">{editMode
                ?<input type="number" value={it.p[si]!=null?it.p[si]:''} onChange={e=>updP(ci,ii,si,e.target.value)} className="w-14 px-1 py-1 border rounded text-center text-sm" placeholder="-"/>
                :<span className="font-bold">{it.p[si]!=null?<span className="text-orange-700">{it.p[si]}</span>:<span className="text-gray-300">-</span>}</span>}</td>)}
              <td className="py-2 px-2 text-xs text-gray-400 max-w-[140px]">{editMode
                ?<input value={it.t||''} onChange={e=>updT(ci,ii,e.target.value)} className="w-full px-1 py-1 border rounded text-xs" placeholder="備註"/>
                :<span className="truncate block">{it.t||''}</span>}</td>
              {editMode&&<td className="py-2 px-1"><button onClick={()=>rmItem(ci,ii)} className="text-red-400 hover:text-red-600 text-sm">×</button></td>}
            </tr>);
          })}</tbody></table></div>
          {editMode&&<button onClick={()=>addItem(ci)} className="mt-1 text-xs text-blue-600 font-bold ml-2">＋ 新增品項</button>}
        </div>);
      })}
      {editMode&&<button onClick={addCat} className="w-full py-2 border-2 border-dashed border-blue-300 rounded-xl text-blue-600 text-sm font-bold hover:bg-blue-50">＋ 新增分類</button>}

      {d.toppings&&d.toppings.length>0&&<div className="bg-yellow-50 rounded-xl p-4 border border-yellow-200">
        <h4 className="font-bold text-yellow-900 text-sm mb-2">🧊 加料選項</h4>
        <div className="space-y-1">{d.toppings.map(([price,items],i)=><div key={i} className="flex gap-2 text-sm"><span className="font-bold text-yellow-700 shrink-0">+{price}元</span><span className="text-yellow-800">{items.join('、')}</span></div>)}</div>
      </div>}
      <div className="bg-gray-50 rounded-xl p-4 border border-gray-200 text-sm"><div className="flex flex-wrap gap-4">
        <div><span className="font-bold text-gray-600">甜度：</span><span className="text-gray-500">{d.sugars.join('、')}</span></div>
        <div><span className="font-bold text-gray-600">冰塊：</span><span className="text-gray-500">{d.ices.join('、')}</span></div>
      </div></div>
    </div>

    {/* Footer */}
    <div className="bg-white border-t border-orange-200 px-5 py-3 flex items-center justify-between shrink-0 flex-wrap gap-2">
      {editMode?(<>
        <p className="text-sm text-blue-700 font-bold">📝 編輯模式 — 直接修改價格、品項</p>
        <div className="flex gap-2">
          <button onClick={cancelEdit} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button>
          <button onClick={saveEdit} disabled={saving} className={`px-6 py-2.5 btn-b rounded-xl font-bold text-sm shadow ${saving?'opacity-50':''}`}>{saving?'儲存中...':'💾 儲存到資料庫'}</button>
        </div>
      </>):(<>
        <p className="text-sm text-orange-700"><strong>{selCount}</strong> 個品項已選取</p>
        <div className="flex gap-2">
          <button onClick={onClose} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button>
          <button onClick={doImport} disabled={!selCount} className={`px-6 py-2.5 btn-g rounded-xl font-bold text-sm shadow ${!selCount?'opacity-40':''}`}>✅ 匯入 {selCount} 項</button>
        </div>
      </>)}
    </div>
  </div></Modal>);
}

// ===== MENU LIST =====
function MenuList({items,onEdit,onDelete,compact}){
  if(!items.length)return(<div className="text-center py-12 text-gray-400 anim-fade"><p className="text-4xl mb-2">📋</p><p>尚無品項</p></div>);
  return(<div className={`grid ${compact?'grid-cols-1':'sm:grid-cols-2 lg:grid-cols-3'} gap-3`}>{items.map((it,i)=>(<div key={it.id} className="bg-white rounded-xl shadow-sm p-3.5 border border-orange-50 anim-fade flex gap-3 group" style={{animationDelay:`${Math.min(i,8)*30}ms`}}>
    <div className="flex-1 min-w-0">
      <div className="flex justify-between items-start"><h4 className="font-bold text-orange-900 truncate text-sm">{it.name}</h4>
        {it.sizes?<span className="text-orange-600 font-bold shrink-0 ml-2 text-xs">NT${it.sizes.map(s=>s.price).join('/')}</span>
        :<span className="text-orange-600 font-bold shrink-0 ml-2 text-sm">NT${it.price}</span>}
      </div>
      {it.sizes&&<div className="flex gap-1 mt-1 flex-wrap">{it.sizes.map((s,j)=><span key={j} className="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">{s.label} ${s.price}</span>)}</div>}
      <div className="flex items-center gap-2 mt-1.5"><span className="text-xs px-2 py-0.5 rounded-full bg-orange-50 text-orange-600">{catL(it.category)}</span>
        {it.has_custom_options&&<span className="text-xs text-purple-600">☕客製</span>}
        {!it.is_public&&<span className="text-xs text-yellow-600">🔒</span>}
      </div>
      {onEdit&&<div className="flex gap-2 mt-2 opacity-0 group-hover:opacity-100 transition"><button onClick={()=>onEdit(it)} className="text-xs text-blue-500 font-bold">✏️</button><button onClick={()=>onDelete(it.id)} className="text-xs text-red-400 font-bold">🗑</button></div>}
    </div></div>))}</div>);
}

// ============================================================
// ===== MAIN APP =====
// ============================================================
function GroupBuyApp(){
  const[view,setView]=useState('home');
  const[user,setUser]=useState(null);const[isGuest,setIsGuest]=useState(false);const[guestName,setGuestName]=useState('');
  const[gbs,setGbs]=useState([]);const[merchants,setMerchants]=useState([]);const[allMenus,setAllMenus]=useState([]);
  const[brandTpls,setBrandTpls]=useState([]);
  const[sel,setSel]=useState(null);const[selM,setSelM]=useState(null);
  const[toast,setToast]=useState(null);const[shareModal,setShareModal]=useState(null);const[loading,setLoading]=useState(true);
  const show=(m,t='success')=>setToast({message:m,type:t});
  const cName=()=>{if(isGuest)return guestName;if(user)return user.user_metadata?.full_name||user.email;return''};
  const loggedIn=user||isGuest;
  
  // [修改] 新增 In-App Browser 偵測狀態
  const [isInApp, setIsInApp] = useState(false);

  // [修改] 偵測是否為 LINE / Facebook 瀏覽器
  useEffect(() => {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isInAppBrowser = (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Instagram") > -1);
    if (isInAppBrowser) {
      setIsInApp(true);
    }
  }, []);

  useEffect(()=>{sb.auth.getSession().then(({data:{session:s}})=>setUser(s?.user??null));const{data:{subscription:sub}}=sb.auth.onAuthStateChange((_,s)=>setUser(s?.user??null));return()=>sub.unsubscribe()},[]);
  const ldGbs=useCallback(async()=>{setLoading(true);const{data}=await sb.from('group_buys').select('*').order('created_at',{ascending:false});if(data)setGbs(data);setLoading(false)},[]);
  const ldM=useCallback(async()=>{const{data}=await sb.from('merchants').select('*').order('created_at',{ascending:false});if(data)setMerchants(data)},[]);
  const ldMenus=useCallback(async()=>{const{data}=await sb.from('menus').select('*').order('category').order('name');if(data)setAllMenus(data)},[]);

  // 品牌範本：從 DB 讀取，若空則自動從種子資料匯入
  const ldBrands=useCallback(async()=>{
    const{data,error}=await sb.from('brand_templates').select('*').order('brand');
    if(error){setBrandTpls(SEED_BRANDS);return}
    if(data&&data.length>0){
      setBrandTpls(data.map(d=>({...d.config,brand:d.brand,emoji:d.emoji,_id:d.id,image_url:d.image_url})));
    }else{
      const ins=SEED_BRANDS.map(s=>({brand:s.brand,emoji:s.emoji,config:{sizes:s.sizes,sugars:s.sugars,ices:s.ices,toppings:s.toppings,cats:s.cats}}));
      const{error:e2}=await sb.from('brand_templates').insert(ins);
      if(!e2){const{data:d2}=await sb.from('brand_templates').select('*').order('brand');if(d2)setBrandTpls(d2.map(d=>({...d.config,brand:d.brand,emoji:d.emoji,_id:d.id,image_url:d.image_url})))}
      else setBrandTpls(SEED_BRANDS);
    }
  },[]);

  const saveBrandTpl=async(brand)=>{
    const{_id,brand:name,emoji,image_url,...rest}=brand;
    const config={sizes:rest.sizes,sugars:rest.sugars,ices:rest.ices,toppings:rest.toppings,cats:rest.cats};
    if(_id){await sb.from('brand_templates').update({brand:name,emoji,config,image_url}).eq('id',_id)}
    else{await sb.from('brand_templates').insert([{brand:name,emoji,config}])}
    ldBrands();
  };
  const delBrandTpl=async(id)=>{await sb.from('brand_templates').delete().eq('id',id);ldBrands()};

  // 圖片上傳
  const uploadImg=async(file)=>{
    const ext=file.name.split('.').pop();const fn=`brand-${Date.now()}.${ext}`;
    const{error}=await sb.storage.from('menu-images').upload(fn,file,{upsert:true});
    if(error){show('圖片上傳失敗','error');return null}
    return sb.storage.from('menu-images').getPublicUrl(fn).data.publicUrl;
  };

  useEffect(()=>{ldGbs();ldM();ldMenus();ldBrands()},[]);

  // URL code handler - direct link to ordering
  useEffect(()=>{const c=new URLSearchParams(location.search).get('code');if(c){sb.from('group_buys').select('*').eq('code',c.trim()).single().then(({data})=>{if(data){if(data.password){const p=prompt('此團購需要密碼：');if(p===data.password){setSel(data);setView('detail')}else if(p!==null)show('密碼錯誤','error')}else{setSel(data);setView('detail')}}else show('找不到此代碼','error');history.replaceState({},'',location.pathname)})}},[]);

  const gLogin=async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)show('登入失敗','error')};
  const gOut=async()=>{await sb.auth.signOut();setIsGuest(false);setGuestName('');setView('home')};
  const goHome=()=>{setView('home');setSel(null);setSelM(null)};

  const parseOcr=(text,mid)=>{
    const lines=text.split('\n').filter(l=>l.trim());const items=[];
    lines.forEach(l=>{
      // Try multiple patterns
      let mt=l.match(/(.+?)\s+[NT$＄]*(\d+)/);
      if(!mt)mt=l.match(/(.+?)[\s\t]+(\d+)/);
      if(mt&&mt[1].trim().length>0)items.push({name:mt[1].trim().replace(/[\.\-\s]+$/,''),price:parseInt(mt[2])});
      else if(l.trim().length>1&&!/^\d+$/.test(l.trim()))items.push({name:l.trim(),price:0});
    });
    if(!items.length){show('無法解析，請手動輸入','warning');return}
    const ins=items.map(it=>({name:it.name,price:it.price,category:'main',merchant_id:mid||null,is_public:true,created_by:user?.id||null}));
    sb.from('menus').insert(ins).then(({error})=>{if(!error){show(`已新增 ${items.length} 個品項`);ldMenus()}else show('批次新增失敗','error')});
  };

  // NavBar
  const Nav=()=>(<header className="bg-white/95 backdrop-blur-md border-b border-orange-100 sticky top-0 z-40"><div className="max-w-6xl mx-auto px-4 py-2.5 flex justify-between items-center">
    <h1 className="text-xl font-black text-orange-900 cursor-pointer flex items-center gap-1.5" onClick={goHome}><span className="text-2xl">🍱</span>團購GO</h1>
    <div className="flex gap-2 items-center">{loggedIn?(<><span className="text-sm text-orange-700 hidden sm:inline max-w-[120px] truncate">{isGuest?'👤':'🔒'} {cName()}</span><button onClick={gOut} className="px-3 py-1.5 text-orange-600 hover:bg-orange-50 rounded-lg text-sm">登出</button></>):(<button onClick={()=>setView('login')} className="px-4 py-1.5 btn-p rounded-lg font-bold text-sm">登入</button>)}</div>
  </div></header>);

  // ===== HOME =====
  const Home=()=>{
    const[jc,setJc]=useState('');const[jp,setJp]=useState('');const[spwd,setSpwd]=useState(false);const[jt,setJt]=useState(null);
    const doJoin=async()=>{if(!jc.trim())return;const{data}=await sb.from('group_buys').select('*').eq('code',jc.trim()).single();if(data){if(data.password){setJt(data);setSpwd(true)}else{setSel(data);setView('detail');setJc('')}}else show('找不到此代碼','error')};
    const okPwd=()=>{if(jt&&jp===jt.password){setSel(jt);setView('detail');setJc('');setJp('');setSpwd(false);setJt(null)}else show('密碼錯誤','error')};

    const cards=[
      {icon:'🛒',title:'發起團購',desc:'建立新團購邀請同事加入',clr:'from-orange-500 to-red-500',fn:()=>loggedIn?setView('create'):setView('login')},
      {icon:'🏪',title:'商家菜單管理',desc:'管理商家資訊與菜單品項',clr:'from-blue-500 to-indigo-500',fn:()=>setView('merchants')},
      {icon:'📊',title:'所有團購',desc:'查看進行中與歷史團購',clr:'from-purple-500 to-pink-500',fn:()=>document.getElementById('glist')?.scrollIntoView({behavior:'smooth'})},
    ];

    return(<div className="min-h-screen bg-pattern"><Nav/>
      <main className="max-w-6xl mx-auto px-4 py-6">
        <div className="grid grid-cols-3 gap-3 mb-6 card-grid">{cards.map((c,i)=>(<div key={i} onClick={c.fn} className="dash-card bg-white rounded-2xl shadow-md overflow-hidden anim-fade" style={{animationDelay:`${i*60}ms`}}><div className={`bg-gradient-to-br ${c.clr} p-4 text-white`}><div className="text-3xl mb-1">{c.icon}</div><h3 className="text-sm sm:text-base font-bold leading-tight">{c.title}</h3></div><div className="p-3"><p className="text-xs text-gray-500 hidden sm:block">{c.desc}</p></div></div>))}</div>

        <div className="bg-white rounded-2xl shadow-md p-5 mb-6 border border-orange-100 anim-fade" style={{animationDelay:'200ms'}}>
          <p className="text-orange-900 font-bold mb-2">🔑 用代碼加入團購</p>
          <div className="flex gap-2"><input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="輸入6碼數字" value={jc} onChange={e=>setJc(e.target.value.replace(/\D/g,'').slice(0,6))} onKeyDown={e=>e.key==='Enter'&&doJoin()} className="flex-1 px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-400 focus:outline-none font-mono tracking-[.3em] text-center text-xl" maxLength={6}/><button onClick={doJoin} className="px-5 py-3 btn-p rounded-xl font-bold">加入</button></div>
          {spwd&&<div className="mt-2 flex gap-2 anim-fade"><input type="password" placeholder="輸入密碼" value={jp} onChange={e=>setJp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&okPwd()} className="flex-1 px-4 py-3 border-2 border-yellow-300 rounded-xl text-center"/><button onClick={okPwd} className="px-5 py-3 bg-yellow-500 text-white rounded-xl font-bold">確認</button></div>}
        </div>

        <div id="glist" className="flex items-center justify-between mb-4"><h2 className="text-lg font-bold text-orange-900">📦 目前團購</h2><button onClick={ldGbs} className="text-sm text-orange-500 hover:text-orange-700">🔄 重整</button></div>
        {loading?<div className="text-center py-16 text-orange-400"><div className="spinner mx-auto mb-3"></div>載入中...</div>:gbs.length===0?<div className="text-center py-16 anim-fade"><div className="text-5xl mb-3">🍱</div><p className="text-orange-600 font-medium">目前沒有團購</p></div>
        :<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{gbs.map((g,i)=>{const a=isAct(g.end_date);return(<div key={g.id} className="bg-white rounded-2xl shadow-sm card-hover cursor-pointer p-4 border border-orange-50 anim-fade" style={{animationDelay:`${Math.min(i,6)*50}ms`}} onClick={()=>{if(g.password){const p=prompt('請輸入密碼：');if(p===g.password){setSel(g);setView('detail')}else if(p!==null)show('密碼錯誤','error')}else{setSel(g);setView('detail')}}}>
          <div className="flex justify-between items-start mb-2"><h3 className="font-bold text-orange-900 leading-tight">{g.title}</h3><span className={`px-2 py-0.5 rounded-full text-xs font-bold shrink-0 ml-2 ${a?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>{a?'進行中':'已結束'}</span></div>
          <div className="space-y-1 text-sm text-orange-700"><p>🏪 {g.shop_name}</p><p>📅 截止 {fmtD(g.end_date)}</p><p>👤 {g.organizer_name}</p></div>
          <div className="mt-2 pt-2 border-t border-orange-50 flex justify-between items-center"><span className="text-xs font-mono text-orange-400">#{g.code}</span>{g.password&&<span className="text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">🔒</span>}</div>
        </div>)})}</div>}
      </main>
    </div>);
  };

  // ===== LOGIN =====
  const Login=()=>{const[n,setN]=useState(guestName);const go=()=>{if(n.trim()){setGuestName(n.trim());setIsGuest(true);setView('home')}else show('請輸入姓名','error')};
    return(<div className="min-h-screen bg-pattern flex items-center justify-center p-4"><div className="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full border border-orange-100 anim-pop"><div className="text-center mb-6"><div className="text-5xl mb-2">🍱</div><h2 className="text-2xl font-black text-orange-900">歡迎使用團購GO</h2><p className="text-orange-500 mt-1 text-sm">選擇登入方式</p></div><div className="space-y-3">
      <button onClick={gLogin} className="w-full py-3 px-4 bg-white border-2 border-gray-200 rounded-xl font-medium text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-3"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Google 登入</button>
      <div className="relative my-4"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200"></div></div><div className="relative flex justify-center"><span className="px-3 bg-white text-gray-400 text-sm">或以訪客進入</span></div></div>
      <input type="text" value={n} onChange={e=>setN(e.target.value)} placeholder="輸入姓名" maxLength={20} className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl text-center text-lg" onKeyDown={e=>e.key==='Enter'&&go()}/>
      <button onClick={go} className="w-full py-3 btn-p rounded-xl font-bold text-lg shadow-lg">以訪客身份進入</button>
      <p className="text-xs text-gray-400 text-center">＊訪客無法使用「我的最愛」</p>
      <button onClick={()=>setView('home')} className="w-full py-2 text-orange-500 text-sm">← 返回首頁</button>
    </div></div></div>);
  };

  // ===== MERCHANTS + MENUS (合併管理) =====
  const MerchantsPage=()=>{
    const[sf,setSf]=useState(false);const[em,setEm]=useState(null);const[f,setF]=useState({name:'',description:'',phone:'',address:'',city:'',district:''});
    const[activeM,setActiveM]=useState(null);const[mm,setMm]=useState([]);const[tab,setTab]=useState('all');
    const[menuSf,setMenuSf]=useState(false);const[menuEd,setMenuEd]=useState(null);const[ocr,setOcr]=useState(false);const[brandPicker,setBrandPicker]=useState(false);
    const[copyFrom,setCopyFrom]=useState(null);const[copyTo,setCopyTo]=useState('');
    const[filterCity,setFilterCity]=useState('');

    const reset=()=>{setF({name:'',description:'',phone:'',address:'',city:'',district:''});setEm(null);setSf(false)};
    const composeAddr=(city,district,street)=>`${city}${district}${street?(' '+street).trimStart():''}`.trim();
    const save=async(e)=>{e.preventDefault();if(!f.name.trim())return;
      const fullAddr=composeAddr(f.city,f.district,f.address);
      if(em){await sb.from('merchants').update({name:f.name,description:f.description,phone:f.phone,address:fullAddr}).eq('id',em);show('已更新')}
      else{const{error}=await sb.from('merchants').insert([{name:f.name,description:f.description,phone:f.phone,address:fullAddr,owner_id:user?.id||null,is_public:true}]);if(error)show('失敗','error');else show('商家已建立')}
      reset();ldM()};
    const del=async(id)=>{if(!confirm('確定刪除？菜單也會一併刪除'))return;await sb.from('merchants').delete().eq('id',id);show('已刪除');ldM();ldMenus();if(activeM===id)setActiveM(null)};
    const mCnt=(mid)=>allMenus.filter(x=>x.merchant_id===mid).length;

    // Load menus for active merchant
    useEffect(()=>{if(activeM){const items=allMenus.filter(x=>x.merchant_id===activeM);setMm(items)}else setMm([])},[activeM,allMenus]);
    const filtered=tab==='all'?mm:mm.filter(x=>x.category===tab);

    const saveItem=async(item)=>{const p={...item,merchant_id:activeM,created_by:user?.id||null};
      if(menuEd){await sb.from('menus').update(p).eq('id',menuEd);show('已更新');setMenuEd(null);setMenuSf(false);ldMenus()}
      else{const{error}=await sb.from('menus').insert([p]);if(error){show('失敗','error')}else{show('已新增');ldMenus()}}
    };
    const batchSaveItems=async(items)=>{
      const ins=items.map(it=>({...it,merchant_id:activeM,created_by:user?.id||null}));
      const{error}=await sb.from('menus').insert(ins);
      if(error){show('批次新增失敗','error');return false}
      show(`✅ 已新增 ${items.length} 個品項`);ldMenus();return true;
    };
    const delItem=async(id)=>{if(!confirm('確定刪除？'))return;await sb.from('menus').delete().eq('id',id);show('已刪除');ldMenus()};

    // Copy menu from one merchant to another
    const doCopy=async()=>{if(!copyFrom||!copyTo)return;
      const srcItems=allMenus.filter(x=>x.merchant_id===copyFrom);
      if(!srcItems.length){show('來源商家沒有菜單','warning');return}
      const ins=srcItems.map(it=>({name:it.name,price:it.price,category:it.category,description:it.description,sizes:it.sizes,has_custom_options:it.has_custom_options,merchant_id:copyTo,is_public:it.is_public,created_by:user?.id||null}));
      const{error}=await sb.from('menus').insert(ins);
      if(error)show('複製失敗','error');else{show(`已複製 ${ins.length} 個品項`);ldMenus()}
      setCopyFrom(null);setCopyTo('');
    };

    const actMerchant=merchants.find(m=>m.id===activeM);

    return(<div className="min-h-screen bg-pattern"><Nav/>
      <main className="max-w-6xl mx-auto px-4 py-6">
        <button onClick={goHome} className="text-orange-600 hover:text-orange-800 mb-3 inline-block text-sm">← 返回首頁</button>
        <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
          <h2 className="text-xl font-black text-orange-900">🏪 商家菜單管理</h2>
          <div className="flex gap-2">
            <button onClick={()=>{setSf(!sf);setEm(null);setF({name:'',description:'',phone:'',address:'',city:'',district:''})}} className="px-4 py-2 btn-p rounded-xl font-bold text-sm">{sf?'✕ 收起':'➕ 新增商家'}</button>
            <button onClick={()=>setCopyFrom(copyFrom?null:'pick')} className="px-4 py-2 btn-b rounded-xl font-bold text-sm">📋 複製菜單</button>
          </div>
        </div>

        {/* Copy menu panel */}
        {copyFrom&&<div className="bg-blue-50 rounded-2xl p-5 border border-blue-200 mb-5 anim-slide">
          <h3 className="font-bold text-blue-900 mb-3">📋 複製菜單到其他商家</h3>
          <div className="grid sm:grid-cols-3 gap-3 items-end">
            <div><label className="block text-sm font-bold text-blue-800 mb-1">從（來源商家）</label>
              <select value={copyFrom==='pick'?'':copyFrom} onChange={e=>setCopyFrom(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl">
                <option value="">選擇來源...</option>{merchants.map(m=><option key={m.id} value={m.id}>{m.name}（{mCnt(m.id)}品項）</option>)}
              </select></div>
            <div><label className="block text-sm font-bold text-blue-800 mb-1">到（目標商家）</label>
              <select value={copyTo} onChange={e=>setCopyTo(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl">
                <option value="">選擇目標...</option>{merchants.filter(m=>m.id!==copyFrom).map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
              </select></div>
            <button onClick={doCopy} disabled={!copyFrom||copyFrom==='pick'||!copyTo} className="px-5 py-2.5 btn-g rounded-xl font-bold text-sm disabled:opacity-40">執行複製</button>
          </div>
          <p className="text-xs text-blue-600 mt-2">＊同品名的飲料/主餐可以一次複製到不同分店</p>
        </div>}

        {/* New merchant form */}
        {sf&&<div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-5 anim-slide">
          <h3 className="font-bold text-orange-900 mb-3">{em?'✏️ 編輯商家':'➕ 新增商家'}</h3>
          <form onSubmit={save} className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <div><label className="block text-sm font-bold text-orange-900 mb-1">名稱 *</label><input type="text" required value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="王記便當" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
              <div><label className="block text-sm font-bold text-orange-900 mb-1">電話</label><input type="text" value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div><label className="block text-sm font-bold text-orange-900 mb-1">縣市</label><select value={f.city} onChange={e=>setF({...f,city:e.target.value,district:''})} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"><option value="">-- 選擇縣市 --</option>{TW_CITIES.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
              <div><label className="block text-sm font-bold text-orange-900 mb-1">鄉鎮市區</label><select value={f.district} onChange={e=>setF({...f,district:e.target.value})} disabled={!f.city} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none disabled:bg-gray-100"><option value="">-- 選擇區域 --</option>{(TW_REGIONS[f.city]||[]).map(d=><option key={d} value={d}>{d}</option>)}</select></div>
            </div>
            <div><label className="block text-sm font-bold text-orange-900 mb-1">詳細地址</label><input type="text" value={f.address} onChange={e=>setF({...f,address:e.target.value})} placeholder="路/街/巷/號" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
            <div><label className="block text-sm font-bold text-orange-900 mb-1">說明</label><textarea value={f.description} onChange={e=>setF({...f,description:e.target.value})} rows={2} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl resize-none focus:border-orange-500 focus:outline-none"/></div>
            <div className="flex gap-2"><button type="submit" className="px-5 py-2.5 btn-p rounded-xl font-bold">{em?'💾 儲存':'➕ 建立'}</button><button type="button" onClick={reset} className="px-5 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold">取消</button></div>
          </form>
        </div>}

        <div className="grid lg:grid-cols-3 gap-5">
          {/* Merchant list (left) */}
          <div className="lg:col-span-1">
            <p className="text-sm font-bold text-gray-500 mb-2">商家列表（{merchants.length}）</p>
            <div className="mb-2"><select value={filterCity} onChange={e=>setFilterCity(e.target.value)} className="w-full px-3 py-2 border-2 border-orange-200 rounded-xl text-sm focus:border-orange-500 focus:outline-none"><option value="">📍 全部縣市</option>{TW_CITIES.filter(c=>merchants.some(m=>m.address&&m.address.startsWith(c))).map(c=><option key={c} value={c}>{c}</option>)}<option value="__none">（未設定地區）</option></select></div>
            <div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">
              {merchants.filter(m=>{if(!filterCity)return true;if(filterCity==='__none')return!m.address||!TW_CITIES.some(c=>m.address.startsWith(c));return m.address&&m.address.startsWith(filterCity)}).map(m=>{const loc=parseCityDist(m.address);return(<div key={m.id} onClick={()=>setActiveM(m.id)} className={`m-card bg-white rounded-xl shadow-sm p-3.5 cursor-pointer ${activeM===m.id?'border-orange-400 bg-orange-50':''}`}>
                <div className="flex justify-between items-start">
                  <div className="min-w-0"><h3 className="font-bold text-orange-900 truncate">{m.name}</h3>{loc.city&&<p className="text-xs text-blue-600 mt-0.5">📍 {loc.city}{loc.district}</p>}{m.phone&&<p className="text-xs text-gray-400">📞 {m.phone}</p>}</div>
                  <span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full shrink-0">{mCnt(m.id)}</span>
                </div>
                <div className="flex gap-2 mt-2">
                  <button onClick={e=>{e.stopPropagation();setEm(m.id);const p=parseCityDist(m.address);setF({name:m.name,description:m.description||'',phone:m.phone||'',address:p.street,city:p.city,district:p.district});setSf(true);scrollTo({top:0,behavior:'smooth'})}} className="text-xs text-blue-500 font-bold">✏️</button>
                  <button onClick={e=>{e.stopPropagation();del(m.id)}} className="text-xs text-red-400 font-bold">🗑</button>
                </div>
              </div>)})}
              {merchants.length===0&&<div className="text-center py-8 text-gray-400"><p className="text-3xl mb-2">🏪</p><p className="text-sm">尚未建立商家</p></div>}
            </div>
          </div>

          {/* Menu management (right) */}
          <div className="lg:col-span-2">
            {activeM&&actMerchant?(<div className="anim-fade">
              <div className="bg-white rounded-2xl shadow-md p-4 border border-blue-100 mb-4">
                <div className="flex justify-between items-center">
                  <div><h3 className="text-lg font-bold text-blue-900">🏪 {actMerchant.name} 的菜單</h3>
                    <p className="text-sm text-gray-400 mt-0.5">{(()=>{const l=parseCityDist(actMerchant.address);return l.city?`📍 ${l.city}${l.district} ・ `:''})()}{mm.length} 品項</p></div>
                  <div className="flex gap-2">
                    <button onClick={()=>{setMenuSf(!menuSf);setMenuEd(null)}} className="px-3 py-1.5 btn-p rounded-lg font-bold text-xs">{menuSf&&!menuEd?'✕':'➕ 批次新增'}</button>
                    <button onClick={()=>setBrandPicker(true)} className="px-3 py-1.5 btn-g rounded-lg font-bold text-xs">🧋 品牌匯入</button>
                    <button onClick={()=>setOcr(true)} className="px-3 py-1.5 btn-b rounded-lg font-bold text-xs">📸 OCR</button>
                  </div>
                </div>
              </div>
              <div className="flex gap-1.5 mb-3 flex-wrap"><span onClick={()=>setTab('all')} className={`cpill ${tab==='all'?'cpill-a':'cpill-i'}`}>全部</span>{CATS.map(c=><span key={c.k} onClick={()=>setTab(c.k)} className={`cpill ${tab===c.k?'cpill-a':'cpill-i'}`}>{c.s}</span>)}</div>
              {menuEd&&<div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-4 anim-slide"><h3 className="font-bold text-orange-900 mb-3">✏️ 編輯品項</h3><MenuItemForm onSave={saveItem} editData={mm.find(x=>x.id===menuEd)} onCancel={()=>{setMenuEd(null);setMenuSf(false)}}/></div>}
              {menuSf&&!menuEd&&<div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-4 anim-slide"><h3 className="font-bold text-orange-900 mb-3">➕ 批次新增品項</h3><BatchMenuForm onBatchSave={batchSaveItems} onClose={()=>setMenuSf(false)}/></div>}
              <MenuList items={filtered} onEdit={(it)=>{setMenuEd(it.id);setMenuSf(true)}} onDelete={delItem}/>
              {ocr&&<OcrScanner onResult={(t)=>{setOcr(false);parseOcr(t,activeM)}} onClose={()=>setOcr(false)} merchantName={actMerchant.name}/>}
              {brandPicker&&<DrinkShopPicker brands={brandTpls} onImport={async(items)=>{const ok=await batchSaveItems(items);if(ok)setBrandPicker(false)}} onClose={()=>setBrandPicker(false)} onSave={saveBrandTpl} onDelete={delBrandTpl} onUploadImg={uploadImg}/>}
            </div>)
            :(<div className="flex items-center justify-center h-64 text-gray-400"><div className="text-center"><p className="text-4xl mb-2">👈</p><p>選擇左側商家來管理菜單</p></div></div>)}
          </div>
        </div>
      </main>
    </div>);
  };

  // ===== CREATE GROUP BUY (with quick actions) =====
  const Create=()=>{
    const dayLabel=(n)=>{if(n===0)return'今日';if(n===1)return'明日';if(n===2)return'後天';return`${n}天後`};
    const fmtShortDate=(n)=>{const d=new Date(Date.now()+n*864e5);return`${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`};
    const quickActions=[
      {label:`🍱 今日午餐 ${fmtShortDate(0)}`,title:`${dayLabel(0)}午餐團購 ${fmtShortDate(0)}`,date:todayS()},
      {label:`🍱 明日午餐 ${fmtShortDate(1)}`,title:`${dayLabel(1)}午餐團購 ${fmtShortDate(1)}`,date:addDays(1)},
      {label:`🍱 後天午餐 ${fmtShortDate(2)}`,title:`${dayLabel(2)}午餐團購 ${fmtShortDate(2)}`,date:addDays(2)},
    ];
    const[f,setF]=useState({title:'',shopName:'',endDate:'',desc:'',priv:false,pwd:'',mid:''});const[sub,setSub]=useState(false);const[mm,setMm]=useState([]);const[mt,setMt]=useState('all');
    useEffect(()=>{if(f.mid){const m=merchants.find(x=>x.id===f.mid);if(m)setF(p=>({...p,shopName:m.name}));sb.from('menus').select('*').eq('merchant_id',f.mid).order('category').order('name').then(({data})=>{if(data)setMm(data)})}else setMm([])},[f.mid]);
    const fmm=mt==='all'?mm:mm.filter(x=>x.category===mt);

    const go=async(e)=>{e.preventDefault();if(sub)return;setSub(true);
      const code=genCode();
      const{data,error}=await sb.from('group_buys').insert([{title:f.title,shop_name:f.shopName,end_date:f.endDate,is_private:f.priv,description:f.desc||null,password:f.priv&&f.pwd?f.pwd:null,code,organizer_name:cName(),organizer_id:user?.id||null}]).select().single();
      if(error)show('失敗: '+error.message,'error');else{setShareModal(data);ldGbs()}setSub(false)};

    const applyQuick=(q)=>{setF(p=>({...p,title:q.title,endDate:q.date}))};

    return(<div className="min-h-screen bg-pattern"><Nav/>
      <main className="max-w-4xl mx-auto px-4 py-6">
        <button onClick={goHome} className="text-orange-600 hover:text-orange-800 mb-3 inline-block text-sm">← 返回首頁</button>
        <h2 className="text-xl font-black text-orange-900 mb-4">🛒 發起新團購</h2>

        {/* Quick action chips */}
        <div className="flex flex-wrap gap-2 mb-5">
          <span className="text-sm text-gray-500 py-2">快速建立：</span>
          {quickActions.map((q,i)=><button key={i} onClick={()=>applyQuick(q)} className="quick-chip text-sm">{q.label}</button>)}
        </div>

        <div className="grid lg:grid-cols-5 gap-5">
          <div className="lg:col-span-3"><div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 anim-slide"><form onSubmit={go} className="space-y-4">
            <div><label className="block text-sm font-bold text-orange-900 mb-1">團購名稱 *</label><input type="text" required value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="週五午餐便當" maxLength={100} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
            <div><label className="block text-sm font-bold text-orange-900 mb-1">商家 *</label>
              <select value={f.mid} onChange={e=>setF({...f,mid:e.target.value})} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl mb-2"><option value="">-- 選擇已有商家或下方輸入 --</option>{merchants.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>
              <input type="text" required value={f.shopName} onChange={e=>setF({...f,shopName:e.target.value,mid:''})} placeholder="或直接輸入商家名稱" maxLength={100} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
            <div><label className="block text-sm font-bold text-orange-900 mb-1">截止日期 *</label><input type="date" required value={f.endDate} onChange={e=>setF({...f,endDate:e.target.value})} min={todayS()} max={maxDS()} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl"/><p className="text-xs text-orange-400 mt-1">最短今天，最長14天</p></div>
            <div><label className="block text-sm font-bold text-orange-900 mb-1">說明</label><textarea value={f.desc} onChange={e=>setF({...f,desc:e.target.value})} rows={2} maxLength={500} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl resize-none"/></div>
            <label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-orange-50"><input type="checkbox" checked={f.priv} onChange={e=>setF({...f,priv:e.target.checked})} className="w-4 h-4 rounded accent-orange-600"/><div><span className="text-orange-900 font-medium text-sm">🔒 私人團購（需密碼）</span></div></label>
            {f.priv&&<div className="anim-fade"><input type="text" value={f.pwd} onChange={e=>setF({...f,pwd:e.target.value})} placeholder="設定密碼" maxLength={20} className="w-full px-3 py-2.5 border-2 border-yellow-300 rounded-xl"/></div>}
            <button type="submit" disabled={sub} className={`w-full py-3.5 btn-p rounded-xl font-bold text-lg shadow-lg ${sub?'opacity-50':''}`}>{sub?'建立中...':'🚀 建立團購'}</button>
          </form></div></div>

          <div className="lg:col-span-2"><div className="bg-white rounded-2xl shadow-md border overflow-hidden anim-fade sticky top-16" style={{animationDelay:'150ms'}}>
            <div className="bg-gradient-to-r from-green-500 to-teal-500 px-4 py-3 text-white"><h3 className="font-bold text-sm">📋 菜單預覽</h3></div>
            <div className="p-3">{mm.length>0?(<><div className="flex gap-1 mb-2 flex-wrap">{[{k:'all',l:'全部'},...CATS.map(c=>({k:c.k,l:c.s}))].map(c=><button key={c.k} onClick={()=>setMt(c.k)} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${mt===c.k?'bg-green-100 text-green-800':'text-gray-400 hover:bg-gray-100'}`}>{c.l}</button>)}</div>
              <div className="space-y-1.5 max-h-[400px] overflow-y-auto pr-1">{fmm.map(it=><div key={it.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-green-50 text-sm">
                <div className="flex-1 min-w-0"><p className="font-bold text-gray-800 truncate">{it.name}</p>
                  {it.sizes&&<p className="text-xs text-gray-400">{it.sizes.map(s=>s.label).join(' / ')}</p>}
                </div>
                <span className="font-bold text-green-700 shrink-0 text-xs">{it.sizes?it.sizes.map(s=>`$${s.price}`).join('/'):(`NT$${it.price}`)}</span>
              </div>)}</div>
            </>):<div className="text-center py-8 text-gray-300"><p className="text-2xl mb-1">📋</p><p className="text-xs">{f.mid?'此商家尚無菜單':'選擇商家顯示菜單'}</p></div>}</div>
          </div></div>
        </div>
      </main>
    </div>);
  };

  // ===== DETAIL PAGE (點餐介面) =====
  const Detail=()=>{
    const[ords,setOrds]=useState([]);const[ldO,setLdO]=useState(true);const[eId,setEId]=useState(null);const[ef,setEf]=useState({});const[sc,setSc]=useState(false);const[dm,setDm]=useState([]);
    const g=sel;const act=isAct(g.end_date);const url=shareUrl(g.code);

    // Ordering state
    const[oName,setOName]=useState(cName());
    const[oItem,setOItem]=useState(null);const[oSize,setOSize]=useState(null);const[oSugar,setOSugar]=useState('正常');const[oIce,setOIce]=useState('正常冰');const[oQty,setOQty]=useState(1);const[oNote,setONote]=useState('');
    const[cart,setCart]=useState([]);const[showCart,setShowCart]=useState(false);

    useEffect(()=>{sb.from('merchants').select('id').eq('name',g.shop_name).then(({data:md})=>{if(md&&md.length>0)sb.from('menus').select('*').eq('merchant_id',md[0].id).order('category').order('name').then(({data})=>{if(data)setDm(data)})})},[g.shop_name]);
    const ldOrds=useCallback(async()=>{setLdO(true);const{data}=await sb.from('orders').select('*').eq('group_buy_id',g.id).order('created_at',{ascending:true});if(data)setOrds(data);setLdO(false)},[g.id]);
    useEffect(()=>{ldOrds()},[ldOrds]);

    const delOrd=async(id)=>{if(!confirm('確定刪除？'))return;await sb.from('orders').delete().eq('id',id);show('已刪除');ldOrds()};
    const saveEd=async(id)=>{await sb.from('orders').update({items:ef.items,amount:parseFloat(ef.amt)}).eq('id',id);show('已更新');setEId(null);ldOrds()};
    const tot=ords.reduce((s,o)=>s+parseFloat(o.amount||0),0);
    const sum={};ords.forEach(o=>{if(!sum[o.customer_name])sum[o.customer_name]={items:[],total:0};sum[o.customer_name].items.push(o.items);sum[o.customer_name].total+=parseFloat(o.amount||0)});

    const cpSh=async()=>{const msg=`🍱 團購：${g.title}\n🏪 ${g.shop_name}\n📅 截止 ${fmtD(g.end_date)}\n👉 ${url}\n🔑 ${g.code}${g.password?'\n🔐 密碼：'+g.password:''}`;try{await navigator.clipboard.writeText(msg)}catch{const t=document.createElement('textarea');t.value=msg;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)};setSc(true);setTimeout(()=>setSc(false),2000)};

    // Select menu item to order
    const selectItem=(item)=>{setOItem(item);setOSize(item.sizes?item.sizes[0]:null);setOSugar('正常');setOIce('正常冰');setOQty(1);setONote('')};

    const getItemPrice=()=>{if(oSize)return oSize.price;if(oItem)return oItem.price;return 0};

    const addToCart=()=>{if(!oItem)return;
      const price=getItemPrice();
      let desc=oItem.name;
      if(oSize)desc+=`（${oSize.label}）`;
      if(oItem.has_custom_options||oItem.category==='drink'){
        if(oSugar!=='正常')desc+=` ${oSugar}`;
        if(oIce!=='正常冰')desc+=` ${oIce}`;
      }
      setCart(p=>[...p,{name:desc,price,qty:oQty,subtotal:price*oQty}]);
      setOItem(null);setOSize(null);show(`✅ ${desc} x${oQty} 已加入`,'info');
    };

    const rmCart=(i)=>setCart(p=>p.filter((_,j)=>j!==i));
    const cartTotal=cart.reduce((s,c)=>s+c.subtotal,0);

    const submitOrder=async()=>{if(!oName.trim()){show('請輸入姓名','error');return}
      if(!cart.length){show('購物車是空的','warning');return}
      const itemsText=cart.map(c=>`${c.name} x${c.qty}`).join('\n');
      const{error}=await sb.from('orders').insert([{group_buy_id:g.id,customer_name:oName.trim(),items:itemsText,amount:cartTotal,user_id:user?.id||null,note:oNote||null}]);
      if(error)show('送出失敗','error');else{show('訂單送出成功！');setCart([]);setONote('');ldOrds();setShowCart(false)}
    };

    // Manual add (text mode) for when no menu
    const[manualMode,setManualMode]=useState(false);const[mf,setMf]=useState({items:'',amt:''});
    const submitManual=async(e)=>{e.preventDefault();if(!oName.trim()||!mf.items.trim()||!mf.amt)return;
      const{error}=await sb.from('orders').insert([{group_buy_id:g.id,customer_name:oName.trim(),items:mf.items.trim(),amount:parseFloat(mf.amt),user_id:user?.id||null}]);
      if(error)show('失敗','error');else{show('訂單新增成功！');setMf({items:'',amt:''});ldOrds()}
    };

    // Group menu by category
    const menuByCategory=useMemo(()=>{const m={};dm.forEach(it=>{const c=it.category||'main';if(!m[c])m[c]=[];m[c].push(it)});return m},[dm]);

    return(<div className="min-h-screen bg-pattern"><Nav/>
      <main className="max-w-5xl mx-auto px-4 py-5 space-y-5">
        {/* Header */}
        <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 anim-fade">
          <div className="flex flex-wrap justify-between items-start gap-3">
            <div><button onClick={goHome} className="text-orange-500 text-xs mb-1">← 返回</button><h2 className="text-xl font-black text-orange-900">{g.title}</h2><p className="text-orange-600 text-sm mt-0.5">🏪 {g.shop_name} ・ 👤 {g.organizer_name}</p>{g.description&&<p className="mt-2 text-orange-700 bg-orange-50 px-3 py-1.5 rounded-lg text-xs">{g.description}</p>}</div>
            <div className="text-right shrink-0"><span className={`px-2.5 py-1 rounded-full text-xs font-bold ${act?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>{act?'🟢 進行中':'🔴 已結束'}</span><p className="text-xs text-orange-500 mt-1">截止 {fmtD(g.end_date)}</p></div>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-4">
            <div className="bg-orange-50 rounded-xl p-2.5 text-center"><p className="text-xl font-black text-orange-900">NT${tot.toLocaleString()}</p><p className="text-xs text-orange-500">總金額</p></div>
            <div className="bg-orange-50 rounded-xl p-2.5 text-center"><p className="text-xl font-black text-orange-900">{ords.length}</p><p className="text-xs text-orange-500">筆訂單</p></div>
            <div className="bg-orange-50 rounded-xl p-2.5 text-center"><p className="text-xl font-black text-orange-900">{Object.keys(sum).length}</p><p className="text-xs text-orange-500">人</p></div>
          </div>
          <div className="mt-4 p-3 bg-gray-50 rounded-xl border flex flex-wrap gap-2 items-center justify-between">
            <div className="flex items-center gap-2"><span className="text-xs text-gray-500">代碼</span><span className="font-mono font-black text-lg text-orange-900 tracking-[.2em]">{g.code}</span></div>
            <button onClick={cpSh} className={`px-4 py-2 rounded-xl font-bold text-xs ${sc?'bg-green-500 text-white':'btn-p shadow'}`}>{sc?'✅ 已複製':'📲 分享到 Line'}</button>
          </div>
        </div>

        {act&&<div className="grid md:grid-cols-5 gap-5">
          {/* LEFT: Menu ordering */}
          <div className="md:col-span-3 space-y-4">
            {/* Name input */}
            <div className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100 anim-fade">
              <label className="block text-sm font-bold text-orange-900 mb-1.5">你的姓名</label>
              <input type="text" value={oName} onChange={e=>setOName(e.target.value)} placeholder="輸入姓名" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none text-center font-bold"/>
            </div>

            {dm.length>0?(<>
              {/* Menu by category */}
              {CATS.map(cat=>{const items=menuByCategory[cat.k];if(!items||!items.length)return null;
                return(<div key={cat.k} className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100 anim-fade">
                  <h3 className="font-bold text-orange-900 mb-3">{cat.l}</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {items.map(it=>{
                      const isSelected=oItem?.id===it.id;
                      return(<button key={it.id} onClick={()=>selectItem(it)} className={`p-3 rounded-xl text-left transition-all border-2 ${isSelected?'border-orange-500 bg-orange-50 shadow-md':'border-gray-100 hover:border-orange-200 hover:bg-orange-50/50'}`}>
                        <p className="font-bold text-sm text-gray-800 truncate">{it.name}</p>
                        <p className="text-orange-600 font-bold text-sm mt-0.5">{it.sizes?it.sizes.map(s=>`$${s.price}`).join(' / '):`NT$${it.price}`}</p>
                        {it.has_custom_options&&<span className="text-xs text-purple-500">☕可客製</span>}
                      </button>);
                    })}
                  </div>
                </div>);
              })}

              {/* Customization panel */}
              {oItem&&<div className="bg-white rounded-2xl shadow-md p-5 border-2 border-orange-300 anim-slide">
                <h3 className="font-bold text-orange-900 mb-3">🛒 {oItem.name} 客製選項</h3>

                {/* Size selection */}
                {oItem.sizes&&oItem.sizes.length>0&&<div className="mb-4">
                  <p className="text-sm font-bold text-gray-700 mb-2">規格</p>
                  <div className="flex gap-2 flex-wrap">{oItem.sizes.map((s,i)=><button key={i} onClick={()=>setOSize(s)} className={`size-btn ${oSize?.label===s.label?'active':''}`}><span className="block text-sm">{s.label}</span><span className="block text-xs mt-0.5">NT${s.price}</span></button>)}</div>
                </div>}

                {/* Sugar level */}
                {(oItem.has_custom_options||oItem.category==='drink')&&<div className="mb-4">
                  <p className="text-sm font-bold text-gray-700 mb-2">甜度</p>
                  <div className="flex gap-1.5 flex-wrap">{SUGARS.map(s=><button key={s} onClick={()=>setOSugar(s)} className={`opt-btn opt-btn-sm ${oSugar===s?'active':''}`}>{s}</button>)}</div>
                </div>}

                {/* Ice level */}
                {(oItem.has_custom_options||oItem.category==='drink')&&<div className="mb-4">
                  <p className="text-sm font-bold text-gray-700 mb-2">冰塊</p>
                  <div className="flex gap-1.5 flex-wrap">{ICES.map(s=><button key={s} onClick={()=>setOIce(s)} className={`opt-btn opt-btn-sm ${oIce===s?'active':''}`}>{s}</button>)}</div>
                </div>}

                {/* Quantity */}
                <div className="mb-4">
                  <p className="text-sm font-bold text-gray-700 mb-2">數量</p>
                  <div className="flex items-center gap-3"><button onClick={()=>setOQty(q=>Math.max(1,q-1))} className="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 font-bold text-xl flex items-center justify-center">−</button><span className="text-2xl font-black w-10 text-center">{oQty}</span><button onClick={()=>setOQty(q=>q+1)} className="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 font-bold text-xl flex items-center justify-center">+</button></div>
                </div>

                <div className="flex items-center justify-between pt-3 border-t">
                  <p className="text-lg font-black text-orange-900">小計：NT${(getItemPrice()*oQty).toLocaleString()}</p>
                  <button onClick={addToCart} className="px-6 py-2.5 btn-p rounded-xl font-bold shadow">加入購物車</button>
                </div>
              </div>}

              {/* Cart */}
              {cart.length>0&&<div className="bg-white rounded-2xl shadow-md p-5 border border-green-200 anim-fade">
                <div className="flex justify-between items-center mb-3"><h3 className="font-bold text-green-900">🛒 我的購物車（{cart.length}）</h3><p className="font-black text-green-700 text-lg">NT${cartTotal.toLocaleString()}</p></div>
                <div className="space-y-2 mb-4">{cart.map((c,i)=><div key={i} className="flex justify-between items-center p-2.5 bg-green-50 rounded-xl"><div><p className="font-bold text-sm text-gray-800">{c.name}</p><p className="text-xs text-gray-500">x{c.qty} ＝ NT${c.subtotal}</p></div><button onClick={()=>rmCart(i)} className="text-red-400 hover:text-red-600 text-sm px-2">✕</button></div>)}</div>
                <button onClick={submitOrder} className="w-full py-3.5 btn-g rounded-xl font-bold text-base shadow-lg">✅ 送出訂單（NT${cartTotal.toLocaleString()}）</button>
              </div>}
            </>)
            :(<div className="bg-white rounded-2xl shadow-sm p-5 border border-orange-100 anim-fade">
              <div className="flex items-center justify-between mb-3"><h3 className="font-bold text-orange-900">手動輸入訂單</h3></div>
              <form onSubmit={submitManual} className="space-y-3">
                <div><label className="block text-sm font-bold text-orange-800 mb-1">品項 *</label><textarea required value={mf.items} onChange={e=>setMf({...mf,items:e.target.value})} placeholder={"雞腿便當 x1\n珍珠奶茶 x1"} rows={3} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none resize-none"/></div>
                <div><label className="block text-sm font-bold text-orange-800 mb-1">金額 NT$ *</label><input type="number" required value={mf.amt} onChange={e=>setMf({...mf,amt:e.target.value})} min="0" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
                <button type="submit" className="w-full py-3 btn-p rounded-xl font-bold shadow">加入訂單</button>
              </form>
            </div>)}
          </div>

          {/* RIGHT: Order list */}
          <div className="md:col-span-2 space-y-4">
            <div className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100 anim-fade sticky top-16">
              <h3 className="font-bold text-orange-900 mb-3">📋 訂單明細（{ords.length}筆）</h3>
              <div className="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                {ldO?<p className="text-center py-6 text-orange-400 text-sm">載入中...</p>:ords.length===0?<p className="text-center py-6 text-orange-400 text-sm">尚無訂單</p>
                :ords.map(o=><div key={o.id} className="p-3 bg-orange-50 rounded-xl border border-orange-100 order-item-card group">
                  {eId===o.id?(<div className="space-y-2"><textarea value={ef.items} onChange={e=>setEf({...ef,items:e.target.value})} className="w-full px-2.5 py-2 border rounded-lg text-sm" rows={2}/><input type="number" value={ef.amt} onChange={e=>setEf({...ef,amt:e.target.value})} className="w-full px-2.5 py-2 border rounded-lg text-sm"/><div className="flex gap-2"><button onClick={()=>saveEd(o.id)} className="px-3 py-1 bg-green-500 text-white rounded-lg text-xs font-bold">儲存</button><button onClick={()=>setEId(null)} className="px-3 py-1 bg-gray-200 text-gray-600 rounded-lg text-xs">取消</button></div></div>)
                  :(<><div className="flex justify-between items-start mb-1"><span className="font-bold text-orange-900 text-sm">{o.customer_name}</span><span className="font-bold text-orange-600 shrink-0 ml-2 text-sm">NT${parseFloat(o.amount).toLocaleString()}</span></div><p className="text-xs text-orange-700 whitespace-pre-line leading-relaxed">{o.items}</p><div className="flex gap-2 mt-1.5 opacity-0 group-hover:opacity-100 transition"><button onClick={()=>{setEId(o.id);setEf({items:o.items,amt:o.amount})}} className="text-xs text-blue-500 font-bold">✏️</button><button onClick={()=>delOrd(o.id)} className="text-xs text-red-400 font-bold">🗑</button></div></>)}
                </div>)}
              </div>
            </div>
          </div>
        </div>}

        {/* If closed, show orders read-only */}
        {!act&&<div className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100 anim-fade">
          <h3 className="font-bold text-orange-900 mb-3">📋 訂單明細</h3>
          <div className="space-y-2 max-h-[400px] overflow-y-auto">
            {ords.map(o=><div key={o.id} className="p-3 bg-orange-50 rounded-xl"><div className="flex justify-between"><span className="font-bold text-sm">{o.customer_name}</span><span className="font-bold text-orange-600 text-sm">NT${parseFloat(o.amount).toLocaleString()}</span></div><p className="text-xs text-orange-700 whitespace-pre-line">{o.items}</p></div>)}
          </div>
        </div>}

        {/* Settlement */}
        {Object.keys(sum).length>0&&<div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 anim-fade">
          <h3 className="font-bold text-orange-900 mb-4">💰 結算摘要 — 每人應付金額</h3>
          <div className="overflow-x-auto"><table className="w-full text-left"><thead><tr className="border-b-2 border-orange-200"><th className="py-2 pr-3 text-xs text-orange-700">姓名</th><th className="py-2 pr-3 text-xs text-orange-700">品項</th><th className="py-2 text-xs text-orange-700 text-right">應付</th></tr></thead>
            <tbody>{Object.entries(sum).map(([n,d])=><tr key={n} className="border-b border-orange-50"><td className="py-2.5 pr-3 font-bold text-orange-900 text-sm">{n}</td><td className="py-2.5 pr-3 text-xs text-orange-700">{d.items.join('、')}</td><td className="py-2.5 text-right font-bold text-orange-600 text-sm">NT${d.total.toLocaleString()}</td></tr>)}</tbody>
            <tfoot><tr className="border-t-2 border-orange-300"><td className="py-3 font-black text-orange-900" colSpan={2}>合計</td><td className="py-3 text-right font-black text-orange-900 text-lg">NT${tot.toLocaleString()}</td></tr></tfoot>
          </table></div>
        </div>}
      </main>
    </div>);
  };

  // ===== ROUTER =====
  const R=()=>{switch(view){
    case 'login':return <Login/>;case 'create':return <Create/>;case 'merchants':return <MerchantsPage/>;
    case 'detail':return sel?<Detail/>:<Home/>;default:return <Home/>}};

  return(<>{R()}
    {/* [修改] In-App Browser 遮罩：偵測到 LINE/FB 開啟時顯示 */}
    {isInApp && (
      <div className="fixed inset-0 z-[9999] bg-black/90 text-white flex flex-col items-center justify-center p-6 text-center anim-fade">
        <div className="absolute top-5 right-5 text-4xl animate-bounce">↗️</div>
        <div className="bg-gray-800 p-6 rounded-2xl max-w-sm border border-gray-700 shadow-2xl">
          <h2 className="text-2xl font-bold mb-4 text-orange-400">請使用瀏覽器開啟</h2>
          <p className="mb-4 text-gray-300">Google 安全政策限制<br/>無法在 LINE/FB 內直接登入</p>
          <ol className="text-left space-y-3 text-sm mb-6 bg-black/30 p-4 rounded-xl">
            <li>1. 點擊右上角 (或右下角) 的 <span className="font-bold text-white bg-gray-600 px-1.5 rounded">⋮</span> 或 <span className="font-bold text-white bg-gray-600 px-1.5 rounded">分享</span></li>
            <li>2. 選擇 <span className="text-green-400 font-bold">開啟瀏覽器</span> 或 <span className="text-blue-400 font-bold">在 Chrome 中開啟</span></li>
          </ol>
          <button onClick={() => setIsInApp(false)} className="text-gray-500 text-xs underline hover:text-gray-300">
            我只是想瀏覽，不登入 (關閉提示)
          </button>
        </div>
      </div>
    )}
    {toast&&<Toast {...toast} onClose={()=>setToast(null)}/>}{shareModal&&<ShareModal groupBuy={shareModal} onClose={()=>{setShareModal(null);setView('home')}}/>}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<GroupBuyApp/>);
</script>
</body>
</html>
