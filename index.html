  <style>
    /* ------------------ CSS 樣式區域 --------------------- */
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', sans-serif; margin: 0; background-color: #fff7ed; -webkit-font-smoothing: antialiased; }

    /* Loading Screen */
    #loading-screen { position: fixed; inset: 0; z-index: 9999; background: #fff7ed; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    #loading-screen.hide { opacity: 0; pointer-events: none; }
    .ld-icon { font-size: 48px; animation: ldbounce 1s ease infinite; }
    .ld-text { margin-top: 12px; color: #9a3412; font-weight: 700; font-size: 18px; }
    .ld-bar { width: 120px; height: 4px; background: #fed7aa; border-radius: 4px; margin-top: 16px; overflow: hidden; }
    .ld-bar-in { width: 40%; height: 100%; background: linear-gradient(90deg, #ea580c, #dc2626); border-radius: 4px; animation: ldslide 1.2s ease infinite; }
    #error-display { display: none; margin-top: 20px; padding: 15px; background: #fee2e2; color: #b91c1c; border-radius: 8px; font-size: 12px; max-width: 90%; border: 1px solid #fca5a5; word-break: break-all; }
    
    @keyframes ldbounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .ld-icon { font-size: 48px; animation: ldbounce 1.8s ease-in-out infinite; }

    /* ── V7 新增：手機點餐卡片 ── */
    .menu-card { background: #fff; border-radius: 20px; border: 2px solid #fed7aa; padding: 16px; transition: all .15s; }
    .menu-card:hover { border-color: #fb923c; box-shadow: 0 4px 16px rgba(234,88,12,.1); }
    .opt-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .opt-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid #e5e7eb; background: #f9fafb; color: #374151; transition: all .1s; user-select: none; -webkit-tap-highlight-color: transparent; }

// ── 錯誤邊界：防止子元件崩潰導致整頁空白 ──────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, msg: '' }; }
  static getDerivedStateFromError(err) { return { hasError: true, msg: err?.message || '未知錯誤' }; }
  componentDidCatch(err, info) { console.error('[ErrorBoundary]', err, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="bg-red-50 border-2 border-red-300 rounded-xl p-4 my-3 text-red-800">
          <p className="font-bold">⚠️ 元件發生錯誤，請重新整理頁面</p>
          <p className="text-xs mt-1 text-red-600">{this.state.msg}</p>
          <button onClick={() => this.setState({ hasError: false, msg: '' })}
            className="mt-2 px-3 py-1 bg-red-200 rounded-lg text-sm font-bold hover:bg-red-300">重試</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function OcrScanner({ onResult, onClose, merchantName }) {
  const [tab, setTab] = useState('gemini');
  const [prog, setProg] = useState(0); const [stat, setStat] = useState(''); const [scanning, setScanning] = useState(false);
  const [img, setImg] = useState(null); const [result, setResult] = useState('');
  const [errDetails, setErrDetails] = useState([]); // 每個模型的個別錯誤
  const [directKey, setDirectKey] = useState(() => { try { return localStorage.getItem('gemini_key') || ''; } catch(e) { return ''; } });
  const [showKey, setShowKey] = useState(false);
  const [showDirect, setShowDirect] = useState(false); // 展開直接模式面板
  const [jsonText, setJsonText] = useState(''); const [jsonError, setJsonError] = useState('');
  const fRef = useRef(); const canvasRef = useRef();

  const saveDirectKey = (k) => { setDirectKey(k); try { localStorage.setItem('gemini_key', k); } catch(e) {} };

  const onFile = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => { setImg(ev.target.result); setResult(''); } ; r.readAsDataURL(f); };

  const preprocessImage = (imgSrc) => new Promise((resolve) => {
    const canvas = canvasRef.current || document.createElement('canvas'); const ctx = canvas.getContext('2d'); const image = new Image();
    image.onload = () => {
      const scale = Math.max(1, 1500 / Math.max(image.width, image.height)); canvas.width = image.width * scale; canvas.height = image.height * scale; ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) { const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; const v = gray > 140 ? 255 : (gray > 80 ? gray * 1.5 : 0); d[i] = d[i + 1] = d[i + 2] = Math.min(255, v); }
      ctx.putImageData(imgData, 0, 0); resolve(canvas.toDataURL('image/png'));
    }; image.src = imgSrc;
  });

  const cleanOcrText = (text) => { let t = text.replace(/[|｜l1]/g, m => m === '|' || m === '｜' ? '' : m); t = t.replace(/([^\d\s])(\d{2,})/g, '$1 $2'); t = t.replace(/[^\u4e00-\u9fff\u3400-\u4dbf\w\s\.\-\+\(\)（）\/,，、$＄:：·]+/g, ' '); t = t.replace(/[ \t]+/g, ' '); t = t.split('\n').filter(l => l.trim().length > 1).join('\n'); return t.trim(); };

  const GEMINI_PROMPT = `請分析這張菜單圖片，只保留品項名稱和價格，完全忽略店名、地址、電話、廣告、營業時間、社群帳號等無關內容。
輸出格式：每行一個品項，格式為「品項名稱 價格」。
如果有分類標題（不含價格），請單獨寫一行分類名稱。
如果同一品項有多種尺寸（大中小），格式為「品項名稱 價格1 價格2」。
只輸出純文字品項清單，不要任何說明、標記或多餘文字。`;

  // ── 壓縮圖片給 Gemini：最長邊限 1280px，JPEG quality 0.75，確保 < 1MB ──
  const compressForGemini = (imgSrc) => new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const image = new Image();
    image.onload = () => {
      const MAX = 1280;
      let { width, height } = image;
      if (Math.max(width, height) > MAX) {
        const scale = MAX / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      canvas.width = width; canvas.height = height;
      ctx.drawImage(image, 0, 0, width, height);
      // 嘗試 JPEG 0.75，若還太大就再降
      let dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      if (dataUrl.length > 1200000) dataUrl = canvas.toDataURL('image/jpeg', 0.5);
      if (dataUrl.length > 1200000) dataUrl = canvas.toDataURL('image/jpeg', 0.35);
      resolve(dataUrl);
    };
    image.src = imgSrc;
  });

  // ── 解析 Gemini 回傳文字（JSON → 可讀格式）──
  // ── parseGeminiText：四層防護版 ──
  const parseGeminiText = (rawText) => {
    if (!rawText || !rawText.trim()) return '';

    // ── 工具：將單一 item 物件轉為顯示行 ──
    const itemToLine = (it) => {
      if (!it || !it.name || !it.name.trim()) return '';
      if (it.category === 'group') return `[${it.name}]`;
      if (Array.isArray(it.sizes) && it.sizes.length > 0)
        return `${it.name} ${it.sizes.map(s => s.price).join(' ')}`;
      return `${it.name} ${it.price != null ? it.price : 0}`;
    };

    // Step 1：清除 markdown 反引號
    const stripped = rawText
      .replace(/^\s*```[\w]*\s*$/gm, '')
      .trim();

    // Step 2：嘗試整體 JSON.parse
    try {
      const jStart = stripped.indexOf('{');
      const jEnd   = stripped.lastIndexOf('}');
      if (jStart !== -1 && jEnd > jStart) {
        const parsed = JSON.parse(stripped.slice(jStart, jEnd + 1));
        if (parsed.items && Array.isArray(parsed.items) && parsed.items.length > 0) {
          const lines = parsed.items.map(itemToLine).filter(Boolean);
          if (lines.length > 0) return lines.join('\n');
        }
      }
    } catch(_) {}

    // Step 3：整體解析失敗（JSON 被截斷）→ 逐個提取 "name"/"price" 物件
    try {
      const lines = [];
      // 用 regex 逐一抓每個品項物件 { ... }，不依賴完整 JSON 結構
      const objRx = /\{([^{}]+)\}/g;
      let m;
      while ((m = objRx.exec(stripped)) !== null) {
        const chunk = '{' + m[1] + '}';
        try {
          const it = JSON.parse(chunk);
          if (it.name) {
            const line = itemToLine(it);
            if (line) lines.push(line);
          }
        } catch(_) {
          // 嘗試用 regex 直接讀 name/price
          const name  = (chunk.match(/"name"\s*:\s*"([^"]+)"/)  || [])[1];
          const price = (chunk.match(/"price"\s*:\s*(\d+)/)     || [])[1];
          const cat   = (chunk.match(/"category"\s*:\s*"([^"]+)"/) || [])[1];
          if (name) lines.push(cat === 'group' ? `[${name}]` : `${name} ${price || 0}`);
        }
      }
      if (lines.length > 0) return lines.join('\n');
    } catch(_) {}

    // Step 4：純文字 fallback — 過濾掉非品項行
    return stripped
      .split('\n')
      .filter(l => {
        const t = l.trim();
        // 排除 JSON 結構符號行和空行
        return t && !t.match(/^[{}\[\],"]+$/) && !t.startsWith('"name"') &&
               !t.startsWith('"price"') && !t.startsWith('"category"') &&
               !t.startsWith('"sizes"') && !t.startsWith('"items"') && !t.startsWith('`');
      })
      .map(l => {
        // 嘗試從 "name": "xxx" 這種行提取品名
        const nm = l.match(/"name"\s*:\s*"([^"]+)"/);
        if (nm) return nm[1];
        return l.replace(/[{}\[\],"]+/g, ' ').trim();
      })
      .filter(Boolean)
      .join('\n');
  };

  // ── 透過 Supabase Edge Function 辨識（API Key 存在伺服器）──
  const doGeminiOcr = async () => {
    if (!img) return;
    setResult(''); setErrDetails([]); setScanning(true); setStat('壓縮圖片中...'); setProg(5);
    try {
      const compressed = await compressForGemini(img);
      const base64 = compressed.split(',')[1];
      const kbSize = Math.round(base64.length * 0.75 / 1024);
      setProg(20); setStat(`📡 傳送圖片（${kbSize} KB）給伺服器 AI 辨識...`);
      let data = null; let httpStatus = 0;
      try {
        const res = await fetch(`${SURL}/functions/v1/gemini-ocr`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SKEY}` },
          body: JSON.stringify({ imageBase64: base64, mimeType: 'image/jpeg' })
        });
        httpStatus = res.status;
        try { data = await res.json(); } catch(_) { data = { success: false, error: `HTTP ${httpStatus}：伺服器回應非 JSON，Edge Function 可能未部署` }; }
      } catch(fe) { data = { success: false, error: '網路連線失敗：' + (fe.message || '請確認網路') }; }
      if (data && data.success && data.text && data.text.trim()) {
        const disp = parseGeminiText(data.text);
        setProg(100); setStat(`✅ 辨識完成（${data.model || '伺服器模型'}）！共 ${disp.split('\n').filter(l=>l.trim()).length} 行，請確認後送出`);
        setResult(disp); setScanning(false); return;
      }
      // 失敗 → 收集所有錯誤詳情
      const errMsg = data?.error || `HTTP ${httpStatus}`;
      const allErrs = data?.allErrors || [errMsg];
      setProg(0); setStat('❌ 伺服器辨識失敗');
      setErrDetails(allErrs);
      setResult('__ERR__:' + errMsg);
    } catch(e) { setProg(0); setStat('❌ 例外：' + (e.message || '')); setResult('__ERR__:' + (e.message || '未知錯誤')); }
    setScanning(false);
  };

  // ── 直接從瀏覽器呼叫 Gemini API（不需 Edge Function，適合測試新 Key）──
  const doDirectGemini = async () => {
    if (!img || !directKey.trim()) return;
    setResult(''); setErrDetails([]); setScanning(true); setStat('壓縮圖片中...'); setProg(5);
    const PROMPT = `你是專業菜單辨識AI。分析此菜單圖片，輸出純JSON：{"items":[{"name":"品名","price":數字,"category":"main或drink或other"}]}
忽略店名/電話/地址/廣告。只輸出JSON不要任何說明或markdown。`;
    const MODELS_V1 = ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-1.5-flash-001','gemini-1.5-flash-002','gemini-1.5-pro'];
    const MODELS_BETA = ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash-latest'];
    try {
      const compressed = await compressForGemini(img);
      const base64 = compressed.split(',')[1];
      const errs = [];
      let success = false;
      const tryList = [...MODELS_V1.map(m=>['v1',m]), ...MODELS_BETA.map(m=>['v1beta',m])];
      for (let i = 0; i < tryList.length; i++) {
        const [ver, model] = tryList[i];
        setProg(20 + Math.round(i / tryList.length * 70));
        setStat(`🔍 嘗試 ${ver}/${model}（${i+1}/${tryList.length}）...`);
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${directKey.trim()}`,{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:base64}},{text:PROMPT}]}], generationConfig:{maxOutputTokens:4096,temperature:0.1} })
          });
          const d = await r.json();
          if (!r.ok) {
            const em = d?.error?.message || `HTTP ${r.status}`;
            errs.push(`❌ ${ver}/${model}: ${em}`);
            if (r.status === 400) break; // 圖片問題，換模型也沒用
            continue;
          }
          const txt = d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          if (!txt.trim()) { errs.push(`⚠️ ${ver}/${model}: 回傳空白`); continue; }
          const disp = parseGeminiText(txt);
          setProg(100); setStat(`✅ 直接辨識成功（${ver}/${model}）！共 ${disp.split('\n').filter(l=>l.trim()).length} 行`);
          setResult(disp); setErrDetails([]); success = true; break;
        } catch(fe) { errs.push(`🔌 ${ver}/${model}: ${fe.message}`); }
      }
      if (!success) {
        setProg(0); setStat('❌ 直接辨識失敗：所有模型均無法使用');
        setErrDetails(errs);
        setResult('__ERR__:所有模型均失敗，詳見下方錯誤列表');
      }
    } catch(e) { setProg(0); setStat('❌ 例外：' + (e.message||'')); setResult('__ERR__:' + (e.message||'')); }
    setScanning(false);
  };

  const doLocalOcr = async () => {
    if (!img) return; setScanning(true); setStat('前處理圖片...'); setProg(5);
    try { const processed = await preprocessImage(img); setProg(10); setStat('載入 Tesseract 引擎（首次需下載 ~30MB）...');
      const w = await Tesseract.createWorker('chi_tra+eng', 1, { logger: m => { if (m.status === 'recognizing text') { setProg(10 + Math.round(m.progress * 85)); setStat(`辨識中... ${Math.round(m.progress * 100)}%`); } } });
      await w.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      const { data: { text } } = await w.recognize(processed); await w.terminate();
      const cleaned = cleanOcrText(text);
      setStat('✅ 本地辨識完成！正在寫入菜單...'); setProg(100);
      onResult(cleaned, processed);
    } catch (err) { setStat('❌ 失敗：' + err.message); setProg(0); }
    setScanning(false);
  };

  const JSON_PROMPT = `請分析這張菜單，輸出以下 JSON 格式，忽略店名/電話/地址/廣告/營業時間：
{
  "items": [
    {"name":"雞腿便當","price":90,"category":"main"},
    {"name":"珍珠奶茶","sizes":[{"label":"中杯","price":55},{"label":"大杯","price":65}],"category":"drink"},
    {"name":"滷肉飯","price":60,"category":"main"}
  ]
}
category 只能填：main（主餐）、drink（飲料）、other（其他）
只輸出 JSON，不要其他說明文字。`;

  const parseJsonImport = () => {
    setJsonError('');
    try {
      const clean = jsonText.replace(/```json|```/g, '').trim();
      const data = JSON.parse(clean);
      if (!data.items || !Array.isArray(data.items)) throw new Error('格式錯誤：需要包含 items 陣列');
      if (data.items.length === 0) throw new Error('items 陣列是空的');
      const lines = data.items.map(it => {
        if (it.sizes && Array.isArray(it.sizes) && it.sizes.length > 0) {
          return `${it.name} ${it.sizes.map(s => s.price).join(' ')}`;
        }
        return `${it.name} ${it.price || 0}`;
      });
      setResult(lines.join('\n'));
      setTab('gemini');
    } catch(e) { setJsonError('解析失敗：' + e.message); }
  };

  const copyPrompt = (txt) => { try { navigator.clipboard.writeText(txt); } catch(e) {} };

  const TABS = [
    { k: 'gemini', icon: '🌐', l: '線上辨識', sub: '最高準確率' },
    { k: 'local',  icon: '📷', l: '本地辨識', sub: '離線備援' },
    { k: 'json',   icon: '📋', l: 'JSON匯入', sub: '手動備援' },
  ];

  return (
    <Modal onClose={onClose} title={`📸 菜單辨識${merchantName ? ' — ' + merchantName : ''}`} wide>
      <div className="p-5 space-y-4">
        <canvas ref={canvasRef} style={{ display: 'none' }} />
        <input ref={fRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onFile} />

        {/* ── Tab 切換 ── */}
        <div className="flex gap-1 bg-gray-100 rounded-xl p-1">
          {TABS.map(t => (
            <button key={t.k} onClick={() => setTab(t.k)} className={`flex-1 py-2 rounded-lg text-sm font-bold transition leading-tight ${tab === t.k ? 'bg-white shadow text-orange-700' : 'text-gray-400 hover:text-gray-600'}`}>
              <span className="block">{t.icon} {t.l}</span>
              <span className="block text-xs font-normal opacity-60">{t.sub}</span>
            </button>
          ))}
        </div>

        {/* ══ 線上辨識 Tab ══ */}
        {tab === 'gemini' && (
          <div className="space-y-3">

            {/* 主要按鈕 */}
            <div className="flex flex-wrap gap-2">
              <button onClick={() => fRef.current?.click()} className="px-4 py-2.5 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700 text-sm">📷 拍照 / 選圖</button>
              {img && !scanning && <button onClick={doGeminiOcr} className="px-4 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 text-sm">🌐 線上辨識</button>}
            </div>
            {/* 圖片預覽 */}
            {img && !result && <div className="border-2 border-dashed border-orange-200 rounded-xl p-2 bg-orange-50"><img src={img} className="max-h-48 mx-auto rounded-lg" /></div>}
            {/* 進度條 */}
            {scanning && <div className="space-y-2 bg-blue-50 rounded-xl p-4 border border-blue-100">
              <div className="flex items-center gap-3"><div className="spinner" style={{borderTopColor:'#2563eb'}}></div><span className="text-sm text-blue-700 font-bold">{stat}</span></div>
              <div className="w-full bg-gray-200 rounded-full h-2"><div className="bg-blue-500 h-2 rounded-full transition-all duration-500" style={{ width: `${prog}%` }}></div></div>
            </div>}
            {!scanning && prog === 100 && stat && stat.startsWith('✅') && <div className="bg-green-50 rounded-xl p-3 border border-green-100"><p className="text-sm text-green-700 font-bold">{stat}</p></div>}
            {!img && !scanning && !result && <div className="border-2 border-dashed border-gray-200 rounded-xl p-8 text-center text-gray-400">
              <p className="text-4xl mb-2">📸</p><p className="font-bold text-gray-500">拍照辨識菜單</p>
              <p className="text-xs mt-1">支援複雜排版 · 直式文字 · 自動過濾非菜單內容</p>
            </div>}
            {/* ── 直接模式（自帶 API Key）── */}
            <div className="border-2 border-dashed border-purple-200 rounded-xl overflow-hidden">
              <button onClick={() => setShowDirect(v => !v)} className="w-full px-4 py-2.5 bg-purple-50 hover:bg-purple-100 text-purple-800 font-bold text-sm flex items-center justify-between">
                <span>🔑 進階模式（自帶 API Key）</span>
                <span className="text-purple-400">{showDirect ? '▲' : '▼'}</span>
              </button>
              {showDirect && (
                <div className="p-3 space-y-2.5 bg-white">
                  <p className="text-xs text-gray-500">適合「伺服器 Key 配額用完」時：<a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" className="text-blue-600 underline font-bold">申請新 Key</a>，貼入後直接從瀏覽器辨識，不需部署任何 Edge Function。</p>
                  <div className="flex gap-2 items-center">
                    <input type={showKey ? 'text' : 'password'} value={directKey} onChange={e => saveDirectKey(e.target.value)}
                      placeholder="貼入 API Key（AIzaSy...）" className="flex-1 px-3 py-2 border-2 border-purple-200 rounded-lg text-sm focus:border-purple-500 focus:outline-none font-mono" />
                    <button onClick={() => setShowKey(v => !v)} className="px-3 py-2 bg-gray-100 rounded-lg text-sm hover:bg-gray-200">{showKey ? '🙈' : '👁'}</button>

                </div>
              )}
            </div>
          </div>
        )}

        {/* ══ 本地辨識 Tab ══ */}
        {tab === 'local' && (
          <div className="space-y-3">
            <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-xs text-yellow-800">
              ⚠️ 本地 Tesseract 辨識準確率較低，建議優先使用線上辨識。<br/>首次使用需自動下載約 30MB 語言包（之後會快）。
            </div>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => fRef.current?.click()} className="px-5 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700">📷 拍照 / 選圖</button>
              {img && !scanning && <button onClick={doLocalOcr} className="px-5 py-3 btn-b rounded-xl font-bold">🔍 開始辨識</button>}
            </div>
            {img && !result && <div className="border-2 border-dashed border-orange-200 rounded-xl p-2 bg-orange-50"><img src={img} className="max-h-48 mx-auto rounded-lg" /></div>}

// ── 品牌 OCR 解析器 ─────────────────────────────────────────
function parseBrandOcrToTemplate(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  // 找出每行的數字群
  const parsed = lines.map(l => {
    const nums = [...l.matchAll(/\d{2,4}/g)].map(m => parseInt(m[0])).filter(n => n >= 10 && n <= 9999);
    const name = l.replace(/[\d\s\$＄NT,，\.。·\-]+$/g, '').replace(/^[\d\s\$＄NT,，\.。]+/, '').trim();
    return { raw: l, name, nums };
  });
  // 偵測最多幾個價格欄（眾數）
  const numCounts = parsed.map(p => p.nums.length).filter(n => n > 0);
  const maxCols = numCounts.length ? Math.max(...numCounts.slice(0, 30)) : 1;
  const colCount = Math.min(maxCols, 4);
  // 自動產生尺寸標籤
  const defaultSizeLabels = { 1: ['一般'], 2: ['M(中杯)', 'L(大杯)'], 3: ['S(小杯)', 'M(中杯)', 'L(大杯)'], 4: ['S', 'M', 'L', 'XL'] };
  const sizeLabels = defaultSizeLabels[colCount] || defaultSizeLabels[2];
  // 分組：無數字=分類標題；有數字=品項
  const cats = []; let curCat = null;
  for (const p of parsed) {
    const hasPrice = p.nums.length > 0;
    const looksLikeCat = !hasPrice && p.name.length > 0 && p.name.length <= 20 && !/^\d/.test(p.name);
    if (looksLikeCat) {
      curCat = { n: p.name, items: [] };
      cats.push(curCat);
    } else if (hasPrice && p.name.length > 0) {
      if (!curCat) { curCat = { n: '飲品', items: [] }; cats.push(curCat); }
      const prices = sizeLabels.map((_, si) => p.nums[si] != null ? p.nums[si] : null);
      curCat.items.push({ n: p.name, p: prices, t: '' });
    }
  }
  const finalCats = cats.filter(c => c.items.length > 0);
  if (!finalCats.length) {
    // fallback: 全部視為品項，無分類
    const items = parsed.filter(p => p.name.length > 1).map(p => ({ n: p.name, p: sizeLabels.map((_, si) => p.nums[si] || null), t: '' }));
    finalCats.push({ n: '飲品', items });
  }
  return { sizes: sizeLabels, cats: finalCats };
}

  const ocrUpdItem = (ci, ii, field, v) => setOcrPreview(p => { const n = JSON.parse(JSON.stringify(p)); if (field === 'n') n.cats[ci].items[ii].n = v; else n.cats[ci].items[ii].p[field] = v === '' ? null : parseInt(v); return n; });
  const ocrDelItem = (ci, ii) => setOcrPreview(p => { const n = JSON.parse(JSON.stringify(p)); n.cats[ci].items.splice(ii,1); return n; });
  const ocrAddItem = (ci) => setOcrPreview(p => { const n = JSON.parse(JSON.stringify(p)); n.cats[ci].items.push({ n:'', p: n.sizes.map(()=>null), t:'' }); return n; });
  const ocrUpdCat = (ci, v) => setOcrPreview(p => { const n = JSON.parse(JSON.stringify(p)); n.cats[ci].n = v; return n; });
  const ocrDelCat = (ci) => { if (!confirm('確定刪除此分類？')) return; setOcrPreview(p => { const n = JSON.parse(JSON.stringify(p)); n.cats.splice(ci,1); return n; }); };

  const back = () => { setShop(null); setSel({}); setEditMode(false); setEd(null); }; const d = ed || shop;

    <Modal onClose={onClose} title="🧋 連鎖品牌飲料菜單" wide>
      <canvas ref={ocrCanvasRef} style={{ display:'none' }} />

          {shopList.map((s, i) => (
            <div key={s._id || i} className="bg-white rounded-xl border-2 border-orange-100 hover:border-orange-400 hover:shadow-md transition text-center group relative overflow-hidden">
              <div onClick={() => setShop(s)} className="cursor-pointer p-4">

                <h4 className="font-bold text-orange-900 text-sm">{s.brand}</h4>
                <p className="text-xs text-gray-400 mt-1">{s.cats.reduce((a, c) => a + c.items.length, 0)} 品項　{s.sizes.join('/')}</p>

                {s._id && onSave && <button title="複製此品牌" onClick={e => { e.stopPropagation(); quickCopy(s); }} className="w-6 h-6 bg-green-100 text-green-600 rounded-full text-xs font-bold flex items-center justify-center hover:bg-green-500 hover:text-white transition">⎘</button>}
                {s._id && onDelete && <button title="刪除品牌" onClick={e => { e.stopPropagation(); if (confirm(`確定刪除「${s.brand}」？`)) onDelete(s._id) }} className="w-6 h-6 bg-red-100 text-red-500 rounded-full text-xs font-bold flex items-center justify-center hover:bg-red-500 hover:text-white transition">×</button>}
              </div>
            </div>
          ))}
        </div>
        {onSave && (
          <div className="mt-5 space-y-3">
            {!addMode && (
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button onClick={() => setAddMode('ocr')} className="py-2.5 border-2 border-dashed border-purple-300 rounded-xl text-purple-700 font-bold hover:bg-purple-50 text-sm flex items-center justify-center gap-1">📸 拍照建立品牌</button>
                <button onClick={() => setAddMode('single')} className="py-2.5 border-2 border-dashed border-orange-300 rounded-xl text-orange-600 font-bold hover:bg-orange-50 text-sm">➕ 手動新增</button>
                <button onClick={() => setAddMode('batch')} className="py-2.5 border-2 border-dashed border-blue-300 rounded-xl text-blue-600 font-bold hover:bg-blue-50 text-sm">📋 批次新增</button>
                <button onClick={() => { setAddMode('copy'); setCopyFrom(shopList.filter(s=>s._id)[0]?._id || ''); }} className="py-2.5 border-2 border-dashed border-green-300 rounded-xl text-green-600 font-bold hover:bg-green-50 text-sm">⎘ 複製品牌</button>
              </div>
            )}

            {/* ── OCR 品牌建立 ── */}
            {addMode === 'ocr' && ocrStep === 'scan' && (
              <div className="bg-purple-50 rounded-xl p-4 border border-purple-200 anim-fade space-y-4">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-purple-900">📸 拍照辨識菜單 → 建立品牌</h4>
                  <button onClick={() => { setAddMode(false); setOcrStep('scan'); setOcrImg(null); setOcrText(''); }} className="text-xs text-gray-400 hover:text-gray-600">✕</button>
                </div>
                <p className="text-xs text-purple-700">拍攝連鎖品牌飲料菜單，系統自動辨識品名、分類、多種尺寸及價格，直接建立品牌範本。</p>
                <div className="flex flex-wrap gap-3">
                  <input ref={ocrFileRef} type="file" accept="image/*" capture="environment" onChange={e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => setOcrImg(ev.target.result); r.readAsDataURL(f); }} />
                  <button onClick={() => ocrFileRef.current?.click()} className="px-5 py-2.5 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 text-sm">📷 拍照 / 選圖</button>
                  {ocrImg && !ocrScanning && <button onClick={doOcrBrand} className="px-5 py-2.5 btn-b rounded-xl font-bold text-sm">🔍 開始辨識</button>}
                </div>
                {ocrImg && <div className="border-2 border-dashed border-purple-200 rounded-xl p-2 bg-white"><img src={ocrImg} className="max-h-56 mx-auto rounded-lg" /></div>}
                {ocrScanning && (
                  <div className="space-y-2">
                    <div className="flex items-center gap-3"><div className="spinner"></div><span className="text-sm text-purple-700">{ocrStat}</span></div>
                    <div className="w-full bg-gray-200 rounded-full h-2.5"><div className="bg-purple-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${ocrProg}%` }}></div></div>
                  </div>
                )}
                {!ocrImg && !ocrScanning && <div className="border-2 border-dashed border-gray-200 rounded-xl p-8 text-center text-gray-400"><p className="text-4xl mb-2">📷</p><p className="text-sm">拍攝菜單照片，自動解析品項與價格</p></div>}
              </div>
            )}

            {addMode === 'ocr' && ocrStep === 'preview' && ocrPreview && (
              <div className="bg-purple-50 rounded-xl p-4 border border-purple-200 anim-fade space-y-4">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-purple-900">✏️ 確認辨識結果並建立品牌</h4>
                  <button onClick={() => setOcrStep('scan')} className="text-xs text-purple-600 font-bold hover:underline">← 重新拍照</button>
                </div>
                {/* 品牌基本資訊 */}
                <div className="bg-white rounded-xl p-3 border border-purple-100 space-y-3">
                  <p className="text-xs font-bold text-purple-800">📌 品牌設定</p>
                  <div className="grid sm:grid-cols-3 gap-2">
                    <div><label className="text-xs text-gray-500 mb-0.5 block">品牌名稱 *</label><input value={ocrBrand.brand} onChange={e => setOcrBrand({...ocrBrand, brand: e.target.value})} placeholder="例如：50嵐" className="w-full px-3 py-2 border-2 border-purple-200 rounded-lg text-sm focus:border-purple-500 focus:outline-none" /></div>
                    <div><label className="text-xs text-gray-500 mb-0.5 block">Emoji</label><input value={ocrBrand.emoji} onChange={e => setOcrBrand({...ocrBrand, emoji: e.target.value})} className="w-full px-3 py-2 border-2 border-purple-200 rounded-lg text-sm" /></div>
                    <div><label className="text-xs text-gray-500 mb-0.5 block">尺寸名稱（逗號分隔，與下方欄數對應）</label><input value={ocrSizes} onChange={e => rebuildPreview(ocrText, e.target.value)} placeholder="M(中杯),L(大杯)" className="w-full px-3 py-2 border-2 border-purple-200 rounded-lg text-sm" /></div>
                  </div>
                </div>
                {/* 解析結果預覽 + 編輯 */}
                <div className="bg-white rounded-xl border border-purple-100 overflow-hidden">
                  <div className="bg-purple-600 text-white px-3 py-2 text-xs font-bold flex items-center justify-between">
                    <span>辨識結果預覽（可直接修改）共 {ocrPreview.cats.reduce((s,c)=>s+c.items.length,0)} 品項</span>
                    <span className="opacity-75">尺寸欄：{ocrPreview.sizes.join(' / ')}</span>
                  </div>
                  <div className="max-h-80 overflow-y-auto">
                    <table className="w-full text-xs">
                      <thead><tr className="bg-purple-50 text-purple-700"><th className="px-2 py-1.5 text-left font-bold w-8">#</th><th className="px-2 py-1.5 text-left font-bold">品項名稱</th>{ocrPreview.sizes.map((sz,si)=><th key={si} className="px-2 py-1.5 text-center font-bold w-20">{sz}</th>)}<th className="w-7"></th></tr></thead>
                      <tbody>
                        {ocrPreview.cats.map((cat, ci) => (
                          <React.Fragment key={ci}>
                            <tr className="bg-orange-50">
                              <td className="px-2 py-1.5 text-orange-400">≡</td>
                              <td colSpan={ocrPreview.sizes.length + 1} className="px-2 py-1">
                                <div className="flex items-center gap-2">
                                  <input value={cat.n} onChange={e => ocrUpdCat(ci, e.target.value)} className="font-bold text-orange-700 bg-transparent border-b border-orange-300 focus:border-orange-500 outline-none flex-1 text-sm" />
                                  <button onClick={() => ocrDelCat(ci)} className="text-red-300 hover:text-red-500 text-xs px-1">🗑</button>
                                </div>
                              </td>
                            </tr>
                            {cat.items.map((it, ii) => (
                              <tr key={ii} className="border-b border-purple-50 hover:bg-purple-50/50">
                                <td className="px-2 py-1 text-gray-300 text-center">{ii+1}</td>
                                <td className="px-2 py-1"><input value={it.n} onChange={e => ocrUpdItem(ci, ii, 'n', e.target.value)} className="w-full bg-transparent border-b border-gray-200 focus:border-purple-400 outline-none" /></td>
                                {ocrPreview.sizes.map((_, si) => (
                                  <td key={si} className="px-2 py-1 text-center"><input type="number" value={it.p[si] ?? ''} onChange={e => ocrUpdItem(ci, ii, si, e.target.value)} placeholder="-" min="0" className="w-16 text-center bg-transparent border-b border-gray-200 focus:border-purple-400 outline-none" /></td>
                                ))}
                                <td className="px-2 py-1 text-center"><button onClick={() => ocrDelItem(ci, ii)} className="text-red-200 hover:text-red-400">×</button></td>
                              </tr>
                            ))}
                            <tr>
                              <td colSpan={ocrPreview.sizes.length + 3} className="px-2 py-0.5">
                                <button onClick={() => ocrAddItem(ci)} className="text-xs text-purple-400 hover:text-purple-600 py-0.5">＋ 新增品項</button>
                              </td>
                            </tr>
                          </React.Fragment>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
                {/* 原始辨識文字（可展開） */}
                <details className="text-xs">
                  <summary className="text-gray-400 cursor-pointer hover:text-gray-600">查看原始辨識文字</summary>
                  <textarea value={ocrText} onChange={e => { setOcrText(e.target.value); rebuildPreview(e.target.value, ocrSizes); }} rows={6} className="w-full mt-2 px-3 py-2 border border-gray-200 rounded-lg text-xs font-mono resize-none focus:border-purple-400 focus:outline-none" />
                </details>
                <div className="flex gap-2 flex-wrap">
                  <button onClick={saveOcrBrand} disabled={!ocrBrand.brand.trim()} className="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold text-sm disabled:opacity-40 shadow">✅ 儲存為品牌範本</button>
                  <button onClick={() => setOcrStep('scan')} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">← 重拍</button>
                  <button onClick={() => { setAddMode(false); setOcrStep('scan'); setOcrImg(null); setOcrText(''); setOcrPreview(null); }} className="px-4 py-2.5 bg-gray-100 text-gray-500 rounded-xl font-bold text-sm">取消</button>
                </div>
              </div>
            )}

            {/* ── 手動新增 ── */}
            {addMode === 'single' && (
              <div className="bg-orange-50 rounded-xl p-4 border border-orange-200 anim-fade space-y-3">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-orange-900 text-sm">➕ 手動新增品牌</h4>
                  <span className="text-xs text-gray-400">建立後可繼續新增下一個</span>
                </div>
                <div className="grid sm:grid-cols-3 gap-2">
                  <input value={nbf.brand} onChange={e => setNbf({ ...nbf, brand: e.target.value })} placeholder="品牌名稱 *" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm" onKeyDown={e => e.key === 'Enter' && createBrand(true)} />
                  <input value={nbf.emoji} onChange={e => setNbf({ ...nbf, emoji: e.target.value })} placeholder="Emoji" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm" />
                  <input value={nbf.sizes} onChange={e => setNbf({ ...nbf, sizes: e.target.value })} placeholder="尺寸（逗號分隔）" className="px-3 py-2 border-2 border-orange-200 rounded-lg text-sm" />
                </div>
                <div className="flex gap-2 flex-wrap">
                  <button onClick={() => createBrand(false)} className="px-4 py-2 btn-p rounded-lg text-sm font-bold">建立</button>
                  <button onClick={() => createBrand(true)} className="px-4 py-2 btn-g rounded-lg text-sm font-bold">建立並繼續新增</button>
                  <button onClick={() => { setAddMode(false); setNbf({ brand: '', emoji: '🧋', sizes: 'M(中杯),L(大杯)' }); }} className="px-4 py-2 bg-gray-200 rounded-lg text-sm font-bold">取消</button>
                </div>
              </div>
            )}
            {addMode === 'batch' && (
              <div className="bg-blue-50 rounded-xl p-4 border border-blue-200 anim-fade space-y-3">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-blue-900 text-sm">📋 批次新增品牌</h4>
                  <button onClick={() => { setAddMode(false); setBatchText(''); setBatchDone([]); }} className="text-xs text-gray-400 hover:text-gray-600">✕ 關閉</button>
                </div>
                <p className="text-xs text-blue-600">每行輸入一個品牌名稱，系統會依序建立，建立後可個別進入編輯品項。</p>
                <textarea value={batchText} onChange={e => setBatchText(e.target.value)} placeholder={"50嵐\n貢茶\n清心福全\n迷客夏\n日出茶太"} rows={6} className="w-full px-3 py-2 border-2 border-blue-200 rounded-lg text-sm resize-none" />
                <div>
                  <label className="text-xs font-bold text-blue-800 mb-1 block">共用尺寸設定（逗號分隔）</label>
                  <input value={batchSizes} onChange={e => setBatchSizes(e.target.value)} placeholder="M(中杯),L(大杯)" className="w-full px-3 py-2 border-2 border-blue-200 rounded-lg text-sm" />
                </div>
                {batchDone.length > 0 && (
                  <div className="bg-white rounded-lg p-3 border border-blue-100">
                    <p className="text-xs font-bold text-blue-700 mb-1">已建立 {batchDone.length} 個品牌：</p>
                    <div className="flex flex-wrap gap-1">{batchDone.map(n => <span key={n} className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">✓ {n}</span>)}</div>
                  </div>
                )}
                <div className="flex gap-2">
                  <button onClick={createBatch} disabled={batchSaving || !batchText.trim()} className="px-4 py-2 btn-b rounded-lg text-sm font-bold disabled:opacity-50">
                    {batchSaving ? `建立中 ${batchDone.length}...` : `🚀 批次建立（${batchText.split('\n').filter(s=>s.trim()).length} 個）`}
                  </button>
                  {batchDone.length > 0 && <button onClick={() => { setBatchText(''); setBatchDone([]); }} className="px-3 py-2 bg-gray-200 rounded-lg text-sm font-bold">清除</button>}
                </div>
              </div>
            )}
            {addMode === 'copy' && (
              <div className="bg-green-50 rounded-xl p-4 border border-green-200 anim-fade space-y-3">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-green-900 text-sm">⎘ 複製品牌菜單</h4>
                  <button onClick={() => setAddMode(false)} className="text-xs text-gray-400 hover:text-gray-600">✕ 關閉</button>
                </div>
                <p className="text-xs text-green-700">選擇來源品牌，完整複製其菜單結構到新品牌（例如同品牌不同分店）。</p>
                <div className="grid sm:grid-cols-3 gap-2">
                  <div>
                    <label className="text-xs font-bold text-green-800 mb-1 block">複製來源</label>
                    <select value={copyFrom} onChange={e => setCopyFrom(e.target.value)} className="w-full px-3 py-2 border-2 border-green-200 rounded-lg text-sm">
                      {shopList.filter(s => s._id).map(s => <option key={s._id} value={s._id}>{s.emoji} {s.brand}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-green-800 mb-1 block">新品牌名稱 *</label>
                    <input value={copyName} onChange={e => setCopyName(e.target.value)} placeholder="例如：50嵐（忠孝店）" className="w-full px-3 py-2 border-2 border-green-200 rounded-lg text-sm" onKeyDown={e => e.key === 'Enter' && copyBrand()} />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-green-800 mb-1 block">Emoji</label>
                    <input value={copyEmoji} onChange={e => setCopyEmoji(e.target.value)} placeholder="🧋" className="w-full px-3 py-2 border-2 border-green-200 rounded-lg text-sm" />
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={copyBrand} disabled={!copyName.trim() || !copyFrom} className="px-4 py-2 btn-g rounded-lg text-sm font-bold disabled:opacity-50">⎘ 複製建立</button>
                  <button onClick={() => { setCopyName(''); setCopyEmoji('🧋'); }} className="px-3 py-2 bg-gray-200 rounded-lg text-sm font-bold">清除</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </Modal>
  );
  const totalItems = d.cats.reduce((s, c) => s + c.items.length, 0);
  return (<Modal onClose={onClose} title={`${d.emoji} ${d.brand}`} wide><div className="flex flex-col" style={{ maxHeight: '80vh' }}><div className="bg-orange-50 px-5 py-3 border-b border-orange-200 flex items-center justify-between shrink-0 flex-wrap gap-2"><button onClick={back} className="text-orange-600 text-sm font-bold hover:text-orange-800">← 返回品牌</button><div className="flex items-center gap-2 flex-wrap">{!editMode && <><button onClick={selectAll} className="text-xs text-blue-600 font-bold">{selCount === totalItems ? '取消全選' : '全選'}</button><span className="text-sm text-orange-700 font-bold">已選 {selCount}</span></>}{d._id && onSave && <button onClick={editMode ? cancelEdit : startEdit} className={`px-3 py-1 rounded-lg text-xs font-bold ${editMode ? 'bg-gray-200 text-gray-600' : 'bg-blue-100 text-blue-700'}`}>{editMode ? '✕ 取消' : '✏️ 編輯菜單'}</button>}{editMode && <><input ref={imgRef} type="file" accept="image/*" className="hidden" onChange={handleImg} /><button onClick={() => imgRef.current?.click()} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-lg text-xs font-bold">📷 上傳菜單照片</button></>}</div></div>{d.image_url && <div className="px-5 pt-3"><img src={d.image_url} className="w-full max-h-48 object-contain rounded-xl border-2 border-orange-100" /></div>}<div className="overflow-y-auto flex-1 px-5 py-4 space-y-5">{d.cats.map((cat, ci) => { const catAllSel = cat.items.every((_, i) => sel[`${ci}-${i}`]); const catSomeSel = cat.items.some((_, i) => sel[`${ci}-${i}`]); return (<div key={ci} className="anim-fade" style={{ animationDelay: `${ci * 30}ms` }}><div className="flex items-center gap-2 mb-2 cursor-pointer select-none" onClick={editMode ? undefined : () => toggleCat(ci)}>{!editMode && <input type="checkbox" checked={catAllSel} readOnly className="w-4 h-4 accent-orange-600 pointer-events-none" ref={el => { if (el) el.indeterminate = catSomeSel && !catAllSel }} />}{editMode ? <><input value={cat.n} onChange={e => updCatN(ci, e.target.value)} className="font-black text-orange-900 bg-white border-2 border-blue-200 rounded-lg px-2 py-1 text-sm flex-1" /><button onClick={() => rmCat(ci)} className="text-xs text-red-400 font-bold ml-1">🗑</button></> : <h3 className="font-black text-orange-900">{cat.n}</h3>}<span className="text-xs text-gray-400">（{cat.items.length}）</span></div><div className="overflow-x-auto"><table className="w-full text-sm border-collapse"><thead><tr className="border-b-2 border-orange-200 bg-orange-50/50">{!editMode && <th className="py-1.5 px-1 w-8"></th>}<th className="py-1.5 px-2 text-left text-xs text-orange-700 font-bold">品項</th>{d.sizes.map((s, si) => <th key={si} className="py-1.5 px-2 text-center text-xs text-orange-700 font-bold min-w-[52px]">{s}</th>)}<th className="py-1.5 px-2 text-left text-xs text-gray-400 font-bold">備註</th>{editMode && <th className="w-8"></th>}</tr></thead><tbody>{cat.items.map((it, ii) => { const isSel = !!sel[`${ci}-${ii}`]; return (<tr key={ii} onClick={editMode ? undefined : () => toggleItem(ci, ii)} className={`border-b border-orange-50 ${editMode ? '' : 'cursor-pointer'} transition ${isSel && !editMode ? 'bg-orange-50' : 'hover:bg-gray-50'}`}>{!editMode && <td className="py-2 px-1 text-center"><input type="checkbox" checked={isSel} readOnly className="w-3.5 h-3.5 accent-orange-600 pointer-events-none" /></td>}<td className="py-2 px-2 whitespace-nowrap">{editMode ? <input value={it.n} onChange={e => updN(ci, ii, e.target.value)} className="w-full px-2 py-1 border rounded-lg text-sm font-bold" placeholder="品名" /> : <span className="font-bold text-gray-800">{it.r && <span className="text-orange-500 mr-0.5">◆</span>}{it.n}{it.cf && <span className="ml-1.5 text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full">無咖啡因</span>}{it.co && <span className="ml-1.5 text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">冷</span>}</span>}</td>{d.sizes.map((s, si) => <td key={si} className="py-2 px-2 text-center">{editMode ? <input type="number" value={it.p[si] != null ? it.p[si] : ''} onChange={e => updP(ci, ii, si, e.target.value)} className="w-14 px-1 py-1 border rounded text-center text-sm" placeholder="-" /> : <span className="font-bold">{it.p[si] != null ? <span className="text-orange-700">{it.p[si]}</span> : <span className="text-gray-300">-</span>}</span>}</td>)}<td className="py-2 px-2 text-xs text-gray-400 max-w-[140px]">{editMode ? <input value={it.t || ''} onChange={e => updT(ci, ii, e.target.value)} className="w-full px-1 py-1 border rounded text-xs" placeholder="備註" /> : <span className="truncate block">{it.t || ''}</span>}</td>{editMode && <td className="py-2 px-1"><button onClick={() => rmItem(ci, ii)} className="text-red-400 hover:text-red-600 text-sm">×</button></td>}</tr>); })}</tbody></table></div>{editMode && <button onClick={() => addItem(ci)} className="mt-1 text-xs text-blue-600 font-bold ml-2">＋ 新增品項</button>}</div>); })} {editMode && <button onClick={addCat} className="w-full py-2 border-2 border-dashed border-blue-300 rounded-xl text-blue-600 text-sm font-bold hover:bg-blue-50">＋ 新增分類</button>}{d.toppings && d.toppings.length > 0 && <div className="bg-yellow-50 rounded-xl p-4 border border-yellow-200"><h4 className="font-bold text-yellow-900 text-sm mb-2">🧊 加料選項</h4><div className="space-y-1">{d.toppings.map(([price, items], i) => <div key={i} className="flex gap-2 text-sm"><span className="font-bold text-yellow-700 shrink-0">+{price}元</span><span className="text-yellow-800">{items.join('、')}</span></div>)}</div></div>}<div className="bg-gray-50 rounded-xl p-4 border border-gray-200 text-sm"><div className="flex flex-wrap gap-4"><div><span className="font-bold text-gray-600">甜度：</span><span className="text-gray-500">{d.sugars.join('、')}</span></div><div><span className="font-bold text-gray-600">冰塊：</span><span className="text-gray-500">{d.ices.join('、')}</span></div></div></div></div><div className="bg-white border-t border-orange-200 px-5 py-3 flex items-center justify-between shrink-0 flex-   useEffect(() => { if (editData) { setF(editData); setUseSizes(!!editData.sizes); setSizes(editData.sizes || [{ label: '', price: '' }]); } }, [editData]);
  const addSize = () => setSizes(p => [...p, { label: '', price: '' }]); const rmSize = (i) => setSizes(p => p.filter((_, j) => j !== i)); const updSize = (i, k, v) => setSizes(p => p.map((s, j) => j === i ? { ...s, [k]: v } : s));
  const submit = (e) => { e.preventDefault(); if (!f.name.trim()) return; const finalSizes = useSizes ? sizes.filter(s => s.label && s.price).map(s => ({ ...s, price: parseFloat(s.price) })) : null; if (useSizes && (!finalSizes || finalSizes.length === 0)) { alert('請至少輸入一個規格'); return; } const price = useSizes ? finalSizes[0].price : parseFloat(f.price || 0); onSave({ ...f, price, sizes: finalSizes, has_custom_options: f.has_custom_options || false }); if (!editData) { setF(empty); setUseSizes(false); setSizes([{ label: '', price: '' }]); } };
  const isMainOrDrink = f.category === 'main' || f.category === 'drink'; const sizeHint = f.category === 'main' ? '例如：大碗、小碗' : '例如：大杯、中杯、小杯';
  return (<form onSubmit={submit} className="space-y-4"><div className="grid sm:grid-cols-3 gap-3"><div><label className="block text-sm font-bold text-orange-900 mb-1">品名 *</label><input type="text" required value={f.name} onChange={e => setF({ ...f, name: e.target.value })} placeholder="雞腿便當" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div>{!useSizes && <div><label className="block text-sm font-bold text-orange-900 mb-1">價格 NT$ *</label><input type="number" required={!useSizes} value={f.price} onChange={e => setF({ ...f, price: e.target.value })} min="0" step="1" placeholder="85" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div>}<div><label className="block text-sm font-bold text-orange-900 mb-1">分類</label><select value={f.category} onChange={e => setF({ ...f, category: e.target.value })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none">{CATS.map(c => <option key={c.k} value={c.k}>{c.l}</option>)}</select></div></div>{isMainOrDrink && <div className="flex flex-wrap gap-4"><label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={useSizes} onChange={e => { setUseSizes(e.target.checked); if (!e.target.checked) setSizes([{ label: '', price: '' }]) }} className="w-4 h-4 rounded accent-orange-600" /><span className="text-sm text-gray-700">設定多種規格（{sizeHint}）</span></label>{f.category === 'drink' && <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={f.has_custom_options} onChange={e => setF({ ...f, has_custom_options: e.target.checked })} className="w-4 h-4 rounded accent-orange-600" /><span className="text-sm text-gray-700">甜度/冰塊選項</span></label>}</div>}{useSizes && <div className="bg-blue-50 rounded-xl p-4 border border-blue-100 space-y-2"><p className="text-sm font-bold text-blue-900 mb-2">規格設定（{sizeHint}）</p>{sizes.map((s, i) => <div key={i} className="flex gap-2 items-center"><input type="text" value={s.label} onChange={e => updSize(i, 'label', e.target.value)} placeholder="規格名稱" className="flex-1 px-3 py-2 border rounded-lg text-sm" /><input type="number" value={s.price} onChange={e => updSize(i, 'price', e.target.value)} placeholder="價格" min="0" className="w-24 px-3 py-2 border rounded-lg text-sm" />{sizes.length > 1 && <button type="button" onClick={() => rmSize(i)} className="text-red-400 hover:text-red-600 text-lg px-1">×</button>}</div>)}<button type="button" onClick={addSize} className="text-sm text-blue-600 hover:text-blue-800 font-bold">＋ 新增規格</button></div>}<div className="flex items-center justify-between pt-1"><label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={f.is_public} onChange={e => setF({ ...f, is_public: e.target.checked })} className="w-4 h-4 rounded accent-orange-600" /><span className="text-sm text-gray-600">公開</span></label><div className="flex gap-2">{editData && <button type="button" onClick={onCancel} className="px-4 py-2 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button>}<button type="submit" className="px-5 py-2 btn-p rounded-xl font-bold text-sm shadow">{editData ? '💾 儲存' : '➕ 新增'}</button></div></div></form>);

function BatchMenuForm({ onBatchSave, onClose }) {
  const emptyRow  = () => ({ _key: Date.now() + Math.random(), name: '', price: '', category: 'main', has_custom_options: false, isGroup: false });
  const groupRow  = () => ({ _key: Date.now() + Math.random(), name: '', price: '0',  category: 'group', has_custom_options: false, isGroup: true });
  const [rows, setRows] = useState([emptyRow(), emptyRow(), emptyRow()]);
  const [saved, setSaved] = useState([]); const [saving, setSaving] = useState(false);
  const updRow = (i, k, v) => setRows(p => p.map((r, j) => j === i ? { ...r, [k]: v } : r));
  const rmRow  = (i) => setRows(p => p.length <= 1 ? [emptyRow()] : p.filter((_, j) => j !== i));
  const addRows = (n = 3) => setRows(p => { const nr = [...p]; for (let i = 0; i < n; i++) nr.push(emptyRow()); return nr; });
  const addGroup = () => setRows(p => [...p, groupRow()]);
  // 有效列：分組標題只要有名稱，品項需要名稱＋價格
  const validRows = rows.filter(r => r.name.trim() && (r.isGroup || r.price));
  const submit = async () => {
    if (!validRows.length) { alert('請至少輸入一個品項'); return; }
    setSaving(true);
    const items = validRows.map(r => ({
      name: r.name.trim(), price: r.isGroup ? 0 : parseFloat(r.price),
      category: r.category, has_custom_options: r.isGroup ? false : r.has_custom_options, is_public: true
    }));
    const ok = await onBatchSave(items);
    if (ok) { setSaved(p => [...p, ...items]); setRows([emptyRow(), emptyRow(), emptyRow()]); }
    setSaving(false);
  };
  return (
    <div className="space-y-4">
      {saved.length > 0 && <div className="bg-green-50 rounded-xl p-3 border border-green-200 anim-fade"><p className="text-sm font-bold text-green-800">✅ 已儲存 {saved.length} 個品項</p></div>}
      {/* 表頭 */}
      <div className="grid gap-2 px-1 text-xs font-bold text-orange-700" style={{gridTemplateColumns:'1fr 68px 80px 32px 28px'}}>
        <span>品名 / 分組標題</span><span>價格</span><span>分類</span><span>客製</span><span></span>
      </div>
      <div className="space-y-1.5">
        {rows.map((r, i) => r.isGroup ? (
          /* ── 分組標題列 ── */
          <div key={r._key} className="flex items-center gap-2">
            <div className="flex-1 flex items-center gap-2 bg-amber-50 border-2 border-amber-300 rounded-xl px-3 py-2">
              <span className="text-amber-600 text-sm font-black shrink-0">📂</span>
              <input type="text" value={r.name} onChange={e => updRow(i, 'name', e.target.value)}
                placeholder="分組名稱，例如：招牌系列、冰沙系列"
                className="flex-1 bg-transparent text-sm font-bold text-amber-900 focus:outline-none placeholder-amber-300" />
            </div>
            <button onClick={() => rmRow(i)} className="text-red-300 hover:text-red-500 text-lg px-1">×</button>
          </div>
        ) : (
          /* ── 一般品項列 ── */
          <div key={r._key} className="grid gap-2 items-center" style={{gridTemplateColumns:'1fr 68px 80px 32px 28px'}}>
            <input type="text" value={r.name} onChange={e => updRow(i, 'name', e.target.value)} placeholder="品名"
              className="px-2.5 py-2 border-2 border-orange-200 rounded-lg text-sm focus:border-orange-500 focus:outline-none" />
            <input type="number" value={r.price} onChange={e => updRow(i, 'price', e.target.value)} placeholder="$" min="0"
              className="px-2 py-2 border-2 border-orange-200 rounded-lg text-sm text-center focus:border-orange-500 focus:outline-none" />
            <select value={r.category} onChange={e => updRow(i, 'category', e.target.value)}
              className="px-2 py-2 border-2 border-orange-200 rounded-lg text-xs focus:border-orange-500 focus:outline-none">
              {CATS.map(c => <option key={c.k} value={c.k}>{c.s}</option>)}
            </select>
            <input type="checkbox" checked={r.has_custom_options} onChange={e => updRow(i, 'has_custom_options', e.target.checked)}
              className="w-4 h-4 accent-orange-600 mx-auto" title="甜度冰塊" />
            <button onClick={() => rmRow(i)} className="text-red-300 hover:text-red-500 text-lg text-center">×</button>
          </div>
        ))}
      </div>
      <div className="flex flex-wrap gap-2">
        <button onClick={() => addRows(3)} className="px-4 py-2 bg-orange-50 text-orange-700 border-2 border-orange-200 rounded-xl font-bold text-sm hover:bg-orange-100">＋ 新增 3 行</button>
        <button onClick={addGroup} className="px-4 py-2 bg-amber-50 text-amber-700 border-2 border-amber-300 rounded-xl font-bold text-sm hover:bg-amber-100">📂 新增分組</button>
      </div>
      <div className="flex items-center justify-between pt-3 border-t border-orange-100">
        <p className="text-sm text-orange-700 font-bold">{validRows.length} 項待儲存</p>
        <div className="flex gap-2">
          <button onClick={onClose} className="px-4 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">收起</button>
          <button onClick={submit} disabled={!validRows.length || saving}
            className={`px-6 py-2.5 btn-g rounded-xl font-bold text-sm shadow ${(!validRows.length || saving) ? 'opacity-40' : ''}`}>
            {saving ? '儲存中...' : '✅ 全部儲存'}
          </button>
        </div>
      </div>
    </div>
  );
}

        <div className="grid gap-2 px-3 py-1 text-xs font-bold text-gray-400 border-b border-gray-200"
          style={{gridTemplateColumns:'20px 1fr 80px 80px 32px'}}>
          <span></span><span>品名</span><span>價格</span><span>分類</span><span>客製</span>
        </div>
      )}
      {/* 批次修改表頭 */}
      {batchEditMode && (
        <div className="grid gap-2 px-1 text-xs font-bold text-blue-500 border-b border-blue-200 pb-1 mb-1"
          style={{gridTemplateColumns:'1fr 72px 88px 32px'}}>
          <span>品名</span><span>價格</span><span>分類</span><span>客製</span>
        </div>
      )}

      {items.map((it, i) => {
        const isGrp = isGroupHeader(it);
        const canEdit = canManage ? canManage(it) : !!onEdit;
        const isDelSel = batchMode && (selIds?.has(it.id) || false);
        const pe = batchEditMode ? (pendingEdits?.[it.id] || { name: it.name, price: it.price ?? 0, category: it.category || 'main', has_custom_options: !!it.has_custom_options }) : null;
        const delay = { animationDelay: `${Math.min(i,8)*15}ms` };

        // ══ 分組標題：三種模式通用 ══
        if (isGrp) {
          if (batchMode) {
            // 批次刪除：分組也能勾選刪除
            return (
              <div key={it.id} onClick={() => canEdit && onToggle?.(it.id)}
                className={`flex items-center gap-2 px-3 py-2 rounded-xl border transition cursor-pointer anim-fade
                  ${isDelSel ? 'border-red-400 bg-red-50' : 'bg-amber-50 border-amber-200 hover:border-red-300'}`} style={delay}>
                <input type="checkbox" checked={isDelSel} onChange={() => onToggle?.(it.id)} onClick={e=>e.stopPropagation()} className="w-4 h-4 accent-red-500" />
                <span className="text-amber-600 font-black text-sm">📂 {it.name}</span>
              </div>
            );
          }
          if (batchEditMode && pe) {
            // 批次修改：只能改名稱
            return (
              <div key={it.id} className="flex items-center gap-2 bg-amber-50 border-2 border-amber-300 rounded-xl px-3 py-2 anim-fade" style={delay}>
                <span className="text-amber-600 text-sm shrink-0">📂</span>
                <input type="text" value={pe.name} onChange={e => onUpdatePending(it.id, 'name', e.target.value)}
                  className="flex-1 bg-transparent text-sm font-bold text-amber-900 focus:outline-none border-b-2 border-amber-300 focus:border-amber-600" />
                <span className="text-xs text-amber-400">分組標題</span>
              </div>
            );
          }
          // 一般模式：顯示為分組標題列
          return (
            <div key={it.id} className="flex items-center gap-2 mt-3 mb-1 group anim-fade" style={delay}>
              <div className="flex-1 flex items-center gap-2 bg-amber-50 border-l-4 border-amber-400 rounded-r-xl px-3 py-2">
                <span className="text-amber-500">📂</span>
                <span className="font-black text-amber-800 text-sm">{it.name}</span>
              </div>
              {canEdit && (
                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition">
                  {onEdit && <button onClick={e=>{e.stopPropagation();onEdit(it);}} className="text-xs text-blue-400 hover:text-blue-600 px-1">✏️</button>}
                  {onDelete && <button onClick={e=>{e.stopPropagation();onDelete(it.id);}} className="text-xs text-red-300 hover:text-red-500 px-1">🗑</button>}
                </div>
              )}
            </div>
          );
        }

        // ══ 批次刪除列 ══
        if (batchMode) return (
          <div key={it.id} onClick={() => canEdit && onToggle?.(it.id)}
            className={`grid gap-2 items-center px-3 py-2.5 rounded-xl border transition cursor-pointer anim-fade
              ${isDelSel ? 'border-red-400 bg-red-50' : 'bg-white border-gray-100 hover:border-red-200 hover:bg-red-50/30'}`}
            style={{...delay, gridTemplateColumns:'20px 1fr 80px 80px 32px'}}>
            <input type="checkbox" checked={isDelSel} onChange={()=>onToggle?.(it.id)} onClick={e=>e.stopPropagation()} className="w-4 h-4 accent-red-500" />
            <span className="font-bold text-sm text-gray-800 truncate">{it.name}</span>
            <span className="text-orange-600 font-bold text-sm">{Array.isArray(it.sizes)&&it.sizes.length>0?it.sizes.map(s=>s.price).join('/'):`$${it.price}`}</span>
            <span className="text-xs px-2 py-0.5 rounded-full bg-orange-50 text-orange-600 w-fit">{catL(it.category)}</span>
            <span className="text-center text-xs">{it.has_custom_options?'☕':''}{!it.is_public?'🔒':''}</span>
          </div>
        );

        // ══ 批次修改列（inline 輸入） ══
        if (batchEditMode && pe) return (
          <div key={it.id} className="grid gap-1.5 items-center px-2 py-2 rounded-xl border-2 border-blue-100 bg-white hover:border-blue-300 anim-fade"
            style={{...delay, gridTemplateColumns:'1fr 72px 88px 32px'}}>
            <input type="text" value={pe.name} onChange={e=>onUpdatePending(it.id,'name',e.target.value)}
              className="px-2.5 py-1.5 border border-blue-200 rounded-lg text-sm font-bold text-gray-800 focus:border-blue-500 focus:outline-none" />
            <input type="number" value={pe.price} min="0" step="1" onChange={e=>onUpdatePending(it.id,'price',e.target.value)}
              className="px-2 py-1.5 border border-blue-200 rounded-lg text-sm text-center focus:border-blue-500 focus:outline-none" />
            <select value={pe.category} onChange={e=>onUpdatePending(it.id,'category',e.target.value)}
              className="px-2 py-1.5 border border-blue-200 rounded-lg text-xs focus:border-blue-500 focus:outline-none">
              {CATS.map(c=><option key={c.k} value={c.k}>{c.s}</option>)}
            </select>
            <button onClick={()=>onUpdatePending(it.id,'has_custom_options',!pe.has_custom_options)}
              className={`w-7 h-7 rounded-lg text-sm transition ${pe.has_custom_options?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-300 hover:bg-gray-200'}`}
              title="甜度/冰塊">☕</button>
          </div>
        );

        // ══ 一般顯示列 ══
        return (
          <div key={it.id} className="flex items-center gap-3 px-3 py-2.5 bg-white rounded-xl border border-gray-100 hover:border-orange-200 hover:bg-orange-50/20 group transition anim-fade"
            style={delay}>
            <div className="flex-1 min-w-0">
              <span className="font-bold text-sm text-gray-800">{it.name}</span>
              {Array.isArray(it.sizes)&&it.sizes.length>0&&(
                <span className="ml-2 text-xs text-gray-400">{it.sizes.map(s=>`${s.label}$${s.price}`).join(' / ')}</span>
              )}
            </div>
            <span className="text-orange-600 font-bold text-sm shrink-0">
              {Array.isArray(it.sizes)&&it.sizes.length>0?`NT$${it.sizes.map(s=>s.price).join('/')}`:(`NT$${it.price}`)}
            </span>
            <span className="text-xs px-2 py-0.5 rounded-full bg-orange-50 text-orange-600 shrink-0">{catL(it.category)}</span>
            {it.has_custom_options&&<span className="text-xs text-purple-600 shrink-0">☕</span>}
            {!it.is_public&&<span className="text-xs text-yellow-600 shrink-0">🔒</span>}
            {canEdit&&(
              <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition shrink-0">
                {onEdit&&<button onClick={e=>{e.stopPropagation();onEdit(it);}} className="text-xs text-blue-500 hover:text-blue-700 font-bold px-1">✏️</button>}
                {onDelete&&<button onClick={e=>{e.stopPropagation();onDelete(it.id);}} className="text-xs text-red-400 hover:text-red-600 font-bold px-1">🗑</button>}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

      </div>
    </Modal>
  );

// 帳號資訊編輯 Modal
function ProfileModal({ user, profile, onClose, onSave }) {
  const [f, setF] = useState({ full_name: profile?.full_name || '', organization: profile?.organization || '', unit: profile?.unit || '' });
  const [saving, setSaving] = useState(false);
  const [pwd, setPwd] = useState({ current: '', next: '', confirm: '' });
  const [pwdSaving, setPwdSaving] = useState(false);
  const [pwdMsg, setPwdMsg] = useState(null); // { text, ok }

  const save = async () => {
    setSaving(true);
    const { error } = await sb.from('profiles').upsert({ id: user.id, ...f, updated_at: new Date() });
    setSaving(false);
    if (error) alert('更新失敗'); else { onSave(); onClose(); }
  };

  const changePwd = async () => {
    setPwdMsg(null);
    if (!pwd.current || !pwd.next || !pwd.confirm) { setPwdMsg({ text: '請填寫所有密碼欄位', ok: false }); return; }
    if (pwd.next.length < 6) { setPwdMsg({ text: '新密碼至少需要 6 碼', ok: false }); return; }
    if (pwd.next !== pwd.confirm) { setPwdMsg({ text: '新密碼與確認密碼不符', ok: false }); return; }
    setPwdSaving(true);
    // 先用現有密碼重新登入驗證
    const { error: signInErr } = await sb.auth.signInWithPassword({ email: user.email, password: pwd.current });
    if (signInErr) { setPwdMsg({ text: '目前密碼錯誤', ok: false }); setPwdSaving(false); return; }
    const { error: updateErr } = await sb.auth.updateUser({ password: pwd.next });
    setPwdSaving(false);
    if (updateErr) { setPwdMsg({ text: '更新失敗：' + updateErr.message, ok: false }); }
    else { setPwdMsg({ text: '✅ 密碼已成功更新', ok: true }); setPwd({ current: '', next: '', confirm: '' }); }
  };

  return (
    <Modal onClose={onClose} title="👤 個人資料設定">
      <div className="p-5 space-y-4">
        {/* 個人資料 */}
        <div><label className="block text-sm font-bold text-gray-700 mb-1">姓名</label><input type="text" value={f.full_name} onChange={e => setF({...f, full_name: e.target.value})} className="w-full px-3 py-2 border rounded-xl" /></div>
        <div><label className="block text-sm font-bold text-gray-700 mb-1">服務機關</label><input type="text" value={f.organization} onChange={e => setF({...f, organization: e.target.value})} placeholder="例如：市政府" className="w-full px-3 py-2 border rounded-xl" /></div>
        <div><label className="block text-sm font-bold text-gray-700 mb-1">服務單位/課別</label><input type="text" value={f.unit} onChange={e => setF({...f, unit: e.target.value})} placeholder="例如：資訊課" className="w-full px-3 py-2 border rounded-xl" /></div>
        <button onClick={save} disabled={saving} className="w-full py-3 btn-p rounded-xl font-bold">{saving ? '儲存中...' : '💾 儲存個人資料'}</button>

        {/* 分隔線 */}
        <div className="border-t border-gray-200 pt-4">
          <p className="text-sm font-black text-gray-700 mb-3">🔑 變更密碼</p>
          <div className="space-y-2">
            <input type="password" placeholder="目前密碼" value={pwd.current} onChange={e => setPwd({...pwd, current: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
            <input type="password" placeholder="新密碼（至少 6 碼）" value={pwd.next} onChange={e => setPwd({...pwd, next: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
            <input type="password" placeholder="確認新密碼" value={pwd.confirm} onChange={e => setPwd({...pwd, confirm: e.target.value})} onKeyDown={e => e.key === 'Enter' && changePwd()} className="w-full px-3 py-2 border rounded-xl text-sm" />
          </div>
          {pwdMsg && <p className={`text-sm mt-2 px-3 py-2 rounded-lg ${pwdMsg.ok ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'}`}>{pwdMsg.text}</p>}
          <button onClick={changePwd} disabled={pwdSaving} className="w-full py-2.5 mt-3 bg-gray-700 hover:bg-gray-800 text-white rounded-xl font-bold text-sm transition">{pwdSaving ? '更新中...' : '🔒 更新密碼'}</button>
        </div>
      </div>
    </Modal>
  );
}

  const uploadImg = async (file) => { const ext = file.name.split('.').pop(); const fn = `brand-${Date.now()}.${ext}`; const { error } = await sb.storage.from('menu-images').upload(fn, file, { upsert: true }); if (error) { show('圖片上傳失敗', 'error'); return null } return sb.storage.from('menu-images').getPublicUrl(fn).data.publicUrl; };

  useEffect(() => { ldGbs(); ldM(); ldMenus(); ldBrands(); }, []);
  
  const gOut = async () => { await sb.auth.signOut(); setIsGuest(false); setGuestName(''); setUserProfile(null); setView('home') };
  const goHome = () => { setView('home'); setSel(null); };
  const checkAdminPwd = async (inputPwd) => {

    const { data } = await sb.from('system_config').select('value').eq('key', 'admin_pwd').maybeSingle();
    if (data && data.value === inputPwd) { setIsAdmin(true); setShowAdminLogin(false); show('管理者登入成功', 'success'); setView('admin'); } else { show('密碼錯誤', 'error'); }
  };

  // ── 解析 Gemini/OCR 結果並存入資料庫（完全重寫版）──
  const parseOcr = async (text, mid) => {
    
    try {
      if (!text || !text.trim()) { show('❌ OCR 未回傳任何文字內容', 'error'); return; }

      const DRINK_KW = ['茶','咖啡','飲料','奶','拿鐵','沙瓦','汽水','果汁','豆漿','鮮奶','珍珠','紅茶','綠茶','烏龍','可樂','啤酒','氣泡','酸梅','仙草','愛玉','shake','latte','tea','coffee','milk','juice','soda','drink'];
      const OTHER_KW = ['運費','加購','配料','加料','加麵','加飯','甜點','蛋糕','網購'];
      const guessCategory = (name) => {
        const n = (name||'').toLowerCase();
        if (DRINK_KW.some(k => n.includes(k))) return 'drink';
        if (OTHER_KW.some(k => n.includes(k))) return 'shopping';
        return 'main';
      };
      const mapCat = (c) => { if(c==='drink') return 'drink'; if(c==='main') return 'main'; if(c==='group') return 'group'; return 'shopping'; };
      const makeItem = (name, price, cat, sizes) => {
        const obj = { name: String(name||'').trim(), price: sizes ? 0 : (Number(price)||0), category: cat, has_custom_options: cat==='drink', merchant_id: mid||null, is_public: true, created_by: user?.id||null };
        if (sizes && sizes.length > 0) obj.sizes = sizes;
        return obj;
      };

      let itemsToInsert = [];

      // ── Step 1：清除 markdown 反引號 ──
      const stripped = text.replace(/^\s*```[\w]*\s*$/gm, '').trim();

      // ── Step 2：嘗試整體 JSON.parse ──
      let jsonParsed = false;
      try {
        const jStart = stripped.indexOf('{'); const jEnd = stripped.lastIndexOf('}');
        if (jStart !== -1 && jEnd > jStart) {
          const parsed = JSON.parse(stripped.slice(jStart, jEnd + 1));
          if (parsed.items && Array.isArray(parsed.items) && parsed.items.length > 0) {
            itemsToInsert = parsed.items.map(it => {
              const cat = mapCat(it.category || '');
              if (cat === 'group') return makeItem(it.name, 0, 'group', null);
              const hasSizes = Array.isArray(it.sizes) && it.sizes.length > 0;
              const sizesData = hasSizes ? it.sizes.map(s=>({ label: String(s.label||'').trim(), price: Number(s.price)||0 })).filter(s=>s.label) : null;
              return makeItem(it.name, it.price, cat || guessCategory(String(it.name||'')), sizesData);
            }).filter(it => it.name.length > 0);
            jsonParsed = true;
          }
        }
      } catch(_) {}

      // ── Step 3：JSON 截斷時逐個品項 regex 提取 ──
      if (!jsonParsed) {
        try {
          const objRx = /\{([^{}]+)\}/g; let m;
          while ((m = objRx.exec(stripped)) !== null) {
            const chunk = '{' + m[1] + '}';
            try {
              const it = JSON.parse(chunk);
              if (it.name && it.name.trim()) {
                const cat = mapCat(it.category || guessCategory(it.name));
                const hasSizes = Array.isArray(it.sizes) && it.sizes.length > 0;
                const sizesData = hasSizes ? it.sizes.map(s=>({ label: String(s.label||'').trim(), price: Number(s.price)||0 })).filter(s=>s.label) : null;
                itemsToInsert.push(makeItem(it.name, it.price, cat, sizesData));
              }
            } catch(_) {
              // regex 強制提取
              const name  = (chunk.match(/"name"\s*:\s*"([^"]+)"/)  || [])[1];
              const price = (chunk.match(/"price"\s*:\s*(\d+)/)     || [])[1];
              const cat   = (chunk.match(/"category"\s*:\s*"([^"]+)"/) || [])[1];
              if (name && name.trim()) itemsToInsert.push(makeItem(name, price||0, mapCat(cat || guessCategory(name)), null));
            }
          }
        } catch(_) {}
      }

      // ── Step 4：Fallback 純文字行解析 ──
      if (itemsToInsert.length === 0) {
        stripped.split('\n').filter(l=>l.trim()).forEach(line => {
          try {
            // 跳過 JSON 結構行
            if (line.trim().match(/^[{}\[\],"]+$/) || line.trim().startsWith('"name"') || line.trim().startsWith('"price"') || line.trim().startsWith('"category"') || line.trim().startsWith('"items"')) return;
            let mt = line.match(/^(.+?)\s+\$?(\d+)\s*$/);
            if (!mt) mt = line.match(/^(.+?)[\s\t]+(\d+)/);
            const cat = mt ? guessCategory(mt[1]) : guessCategory(line);
            if (mt && mt[1].trim().length > 0) {
              itemsToInsert.push(makeItem(mt[1].trim().replace(/[.\-\s]+$/, ''), parseInt(mt[2])||0, cat, null));
            } else if (line.trim().length > 1 && !/^\d+$/.test(line.trim())) {
              itemsToInsert.push(makeItem(line.trim(), 0, cat, null));
            }
          } catch(_) {}
        });
      }

      if (itemsToInsert.length === 0) {
        show('⚠️ 無法解析品項，請檢查照片或手動輸入', 'warning');
        return;
      }

      show(`⏳ 準備寫入 ${itemsToInsert.length} 個品項...`, 'info');

      // ── 步驟1：先用最精簡欄位測試一筆，確認資料庫連線正常 ──
      const testItem = { name: itemsToInsert[0].name, price: itemsToInsert[0].price, category: itemsToInsert[0].category, merchant_id: mid||null, is_public: true };
      const { error: testErr } = await sb.from('menus').insert([testItem]);
      if (testErr) {
        show('❌ 資料庫寫入失敗：' + testErr.message, 'error');
        return;
      }

      // ── 步驟2：測試通過，寫入其餘品項（去掉第一筆，已寫入）──
      const rest = itemsToInsert.slice(1);
      if (rest.length > 0) {
        // 先嘗試完整欄位（含 sizes, has_custom_options）
        const { error: e1 } = await sb.from('menus').insert(rest);
        if (e1) {
          show('⚠️ 寫入失敗改用備援：' + e1.message, 'warning');

          const { error: e2 } = await sb.from('menus').insert(simple);
          if (e2) {
            show('❌ 備援寫入也失敗：' + e2.message, 'error');
            return;
          }
        }
      }

      
      const cats = itemsToInsert.reduce((a,i)=>{ a[i.category]=(a[i.category]||0)+1; return a; }, {});
      const catStr = Object.entries(cats).map(([k,v])=>{ const l=k==='main'?'🍱主餐':k==='drink'?'🧋飲料':'🛍️其他'; return `${l}×${v}`; }).join('、');
      show(`✅ 已新增 ${itemsToInsert.length} 個品項（${catStr}）`);
      ldMenus();

    } catch(fatalErr) {
      show('❌ OCR錯誤：' + (fatalErr.message || String(fatalErr)), 'error');
    }
  };

  const OrderPrintPage = () => {
    const [ords, setOrds] = useState([]); const [ld, setLd] = useState(true);
    const g = sel;
    useEffect(() => { if (g) { setLd(true); sb.from('orders').select('*').eq('group_buy_id', g.id).order('created_at', { ascending: true }).then(({ data }) => { setOrds(data || []); setLd(false); }); } }, [g]);
    const tot = ords.reduce((s, o) => s + parseFloat(o.amount || 0), 0);
    if (!g) return null;
    return (
      <div className="min-h-screen bg-white main-container">
        <Nav />

  const OrderSelectPage = () => {
    const [pwdTarget, setPwdTarget] = useState(null); // 待驗證的團購
    const [pwdInput, setPwdInput] = useState('');
    const doEnter = (g) => {
      if (g.password) { setPwdTarget(g); setPwdInput(''); }
      else { setSel(g); setView('orderPrint'); }
    };
    const confirmPwd = () => {
      if (pwdInput === pwdTarget.password) { setSel(pwdTarget); setView('orderPrint'); setPwdTarget(null); setPwdInput(''); }
      else show('密碼錯誤', 'error');
    };
    return (
      <div className="min-h-screen bg-pattern">
        <Nav />
        <main className="max-w-6xl mx-auto px-4 py-6">

          {loading ? <div className="text-center py-16 text-orange-400">載入中...</div> : gbs.length === 0 ? <div className="text-center py-16"><p>沒有團購資料</p></div> : 
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{gbs.map((g, i) => (<div key={g.id} className="bg-white rounded-2xl shadow-sm cursor-pointer p-4 border border-orange-50 hover:border-blue-400 hover:shadow-lg transition anim-fade" style={{ animationDelay: `${Math.min(i, 6) * 50}ms` }} onClick={() => doEnter(g)}><div className="flex justify-between items-start mb-2"><h3 className="font-bold text-gray-900 leading-tight">{g.title}</h3><span className="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-500">{g.password ? '🔒 需要密碼' : '點擊查看'}</span></div><div className="space-y-1 text-sm text-gray-600"><p>🏪 {g.shop_name}</p><p>📅 {fmtDT(g.end_date, g.description)}</p><p>👤 {g.organizer_name}</p></div></div>))}</div>
          }
          {pwdTarget && (
            <div className="fixed inset-0 bg-black/50 modal-bk z-50 flex items-center justify-center p-4" onClick={() => setPwdTarget(null)}>

                <h3 className="text-lg font-black text-orange-900 mb-1">🔒 需要密碼</h3>
                <p className="text-sm text-gray-500 mb-4">「{pwdTarget.title}」設有密碼保護</p>

                  type="password"
                  placeholder="請輸入團購密碼"
                  value={pwdInput}
                  onChange={e => setPwdInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && confirmPwd()}

                  className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl text-center text-lg focus:border-orange-500 focus:outline-none mb-4"

            <button type="button" onClick={gLogin} className="w-full py-2 bg-white border border-gray-300 rounded-xl font-medium text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-2 text-sm">Google 登入</button>
          </form>

      </div>
      <div className="max-w-sm w-full"><Disclaimer /></div>

  const MerchantsPage = () => {

      setBatchESaving(true);

      for (const id of selMs) { await sb.from('merchants').delete().eq('id', id); }

    const [restData, setRestData] = useState(null);

    // ── 執行回存 ──────────────────────────────────────────

    const save = async (e) => { e.preventDefault(); if (!f.name.trim()) return; const fullAddr = composeAddr(f.city, f.district, f.address); if (em) { await sb.from('merchants').update({ name: f.name, description: f.description, phone: f.phone, address: fullAddr }).eq('id', em); show('已更新') } else { const { error } = await sb.from('merchants').insert([{ name: f.name, description: f.description, phone: f.phone, address: fullAddr, owner_id: user?.id || null, is_public: true }]); if (error) show('失敗', 'error'); else show('商家已建立') } reset(); ldM() };
