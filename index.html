// ===== IMPROVED OCR =====
function OcrScanner({onResult,onClose,merchantName}){
  const[prog,setProg]=useState(0);const[stat,setStat]=useState('準備中...');const[scanning,setScanning]=useState(false);const[img,setImg]=useState(null);const[result,setResult]=useState('');const fRef=useRef();const canvasRef=useRef();

  const onFile=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImg(ev.target.result);r.readAsDataURL(f)};

  // Image preprocessing for better OCR
  const preprocessImage=(imgSrc)=>new Promise((resolve)=>{
    const canvas=canvasRef.current||document.createElement('canvas');
    const ctx=canvas.getContext('2d');const image=new Image();
    image.onload=()=>{
      // Scale up small images
      const scale=Math.max(1,1500/Math.max(image.width,image.height));
      canvas.width=image.width*scale;canvas.height=image.height*scale;
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      // Increase contrast & convert to grayscale
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const d=imgData.data;
      for(let i=0;i<d.length;i+=4){
        const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        // Apply threshold for cleaner text
        const v=gray>140?255:(gray>80?gray*1.5:0);
        d[i]=d[i+1]=d[i+2]=Math.min(255,v);
      }
      ctx.putImageData(imgData,0,0);
      // Apply sharpening
      resolve(canvas.toDataURL('image/png'));
    };
    image.src=imgSrc;
  });

  // Post-process OCR text to fix common errors
  const cleanOcrText=(text)=>{
    let t=text;
    // Fix common Chinese OCR errors
    t=t.replace(/[|｜l1]/g,m=>m==='|'||m==='｜'?'':m);
    // Fix price patterns: ensure space between name and number
    t=t.replace(/([^\d\s])(\d{2,})/g,'$1 $2');
    // Remove garbage characters
    t=t.replace(/[^\u4e00-\u9fff\u3400-\u4dbf\w\s\.\-\+\(\)（）\/,，、$＄:：·]+/g,' ');
    // Clean up multiple spaces
    t=t.replace(/[ \t]+/g,' ');
    // Remove very short meaningless lines
    t=t.split('\n').filter(l=>l.trim().length>1).join('\n');
    return t.trim();
  };

  const doOcr=async()=>{if(!img)return;setScanning(true);setStat('前處理圖片...');setProg(5);
    try{
      const processed=await preprocessImage(img);
      setProg(10);setStat('載入辨識引擎...');
      const w=await Tesseract.createWorker('chi_tra+eng',1,{
        logger:m=>{if(m.status==='recognizing text'){setProg(10+Math.round(m.progress*85));setStat(`辨識中... ${Math.round(m.progress*100)}%`)}}
      });
      await w.setParameters({
        tessedit_pageseg_mode:'6',
        preserve_interword_spaces:'1',
      });
      const{data:{text}}=await w.recognize(processed);
      await w.terminate();
      const cleaned=cleanOcrText(text);
      setResult(cleaned);setStat('辨識完成！');setProg(100);
    }catch(err){setStat('失敗：'+err.message);setProg(0)}
    setScanning(false);
  };

  return(<Modal onClose={onClose} title={`📸 拍照建立菜單${merchantName?' — '+merchantName:''}`} wide><div className="p-5 space-y-4">
    <canvas ref={canvasRef} style={{display:'none'}}/>
    <p className="text-sm text-gray-500">上傳菜單照片，系統自動辨識。建議拍攝清晰、光線充足的照片。</p>
    <div className="flex flex-wrap gap-3"><input ref={fRef} type="file" accept="image/*" capture="environment" onChange={onFile}/>
      <button onClick={()=>fRef.current?.click()} className="px-5 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700">📷 拍照 / 選圖</button>
      {img&&!scanning&&<button onClick={doOcr} className="px-5 py-3 btn-b rounded-xl font-bold">🔍 開始辨識</button>}</div>
    {img&&<div className="border-2 border-dashed border-orange-200 rounded-xl p-2 bg-orange-50"><img src={img} className="max-h-56 mx-auto rounded-lg"/></div>}
    {scanning&&<div className="space-y-2"><div className="flex items-center gap-3"><div className="spinner"></div><span className="text-sm text-orange-700">{stat}</span></div><div className="w-full bg-gray-200 rounded-full h-2.5"><div className="bg-orange-500 h-2.5 rounded-full transition-all duration-300" style={{width:`${prog}%`}}></div></div></div>}
    {result&&<div className="space-y-3"><label className="text-sm font-bold text-orange-900">辨識結果（可編輯）：</label>
      <textarea value={result} onChange={e=>setResult(e.target.value)} rows={8} className="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none text-sm resize-none font-mono"/>
      <p className="text-xs text-gray-400">每行一個品項，格式「品名 價格」例如：雞腿便當 85</p>
      <button onClick={()=>onResult(result)} className="w-full py-3 btn-p rounded-xl font-bold shadow-lg">✅ 使用辨識結果建立菜單</button></div>}
    {!img&&!scanning&&<div className="border-2 border-dashed border-gray-200 rounded-xl p-10 text-center text-gray-400"><p className="text-4xl mb-2">📷</p><p className="text-sm">點擊上方按鈕拍照或選圖</p></div>}
  </div></Modal>);
}

// ===== MENU ITEM FORM (with sizes support) =====
// Used for EDITING a single existing item
function MenuItemForm({onSave,editData,onCancel,category:defaultCat}){
  const empty={name:'',price:'',category:defaultCat||'main',description:'',is_public:true,sizes:null,has_custom_options:false};
  const[f,setF]=useState(editData||empty);
  const[useSizes,setUseSizes]=useState(!!editData?.sizes);
  const[sizes,setSizes]=useState(editData?.sizes||[{label:'',price:''}]);
  useEffect(()=>{if(editData){setF(editData);setUseSizes(!!editData.sizes);setSizes(editData.sizes||[{label:'',price:''}])}},[editData]);

  const addSize=()=>setSizes(p=>[...p,{label:'',price:''}]);
  const rmSize=(i)=>setSizes(p=>p.filter((_,j)=>j!==i));
  const updSize=(i,k,v)=>setSizes(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));

  const submit=(e)=>{e.preventDefault();if(!f.name.trim())return;
    const finalSizes=useSizes?sizes.filter(s=>s.label&&s.price).map(s=>({...s,price:parseFloat(s.price)})):null;
    if(useSizes&&(!finalSizes||finalSizes.length===0)){alert('請至少輸入一個規格');return}
    const price=useSizes?finalSizes[0].price:parseFloat(f.price||0);
    onSave({...f,price,sizes:finalSizes,has_custom_options:f.has_custom_options||false});
    if(!editData){setF(empty);setUseSizes(false);setSizes([{label:'',price:''}])}
  };

  const isMainOrDrink=f.category==='main'||f.category==='drink';
  const sizeHint=f.category==='main'?'例如：大碗、小碗':'例如：大杯、中杯、小杯';

  return(<form onSubmit={submit} className="space-y-4">
    <div className="grid sm:grid-cols-3 gap-3">
      <div><label className="block text-sm font-bold text-orange-900 mb-1">品名 *</label><input type="text" required value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="雞腿便當" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>
      {!useSizes&&<div><label className="block text-sm font-bold text-orange-900 mb-1">價格 NT$ *</label><input type="number" required={!useSizes} value={f.price} onChange={e=>setF({...f,price:e.target.value})} min="0" step="1" placeholder="85" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"/></div>}
      <div><label className="block text-sm font-bold text-orange-900 mb-1">分類</label><select value={f.category} onChange={e=>setF({...f,category:e.target.value})} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none">{CATS.map(c=><option key={c.k} value={c.k}>{c.l}</option>)}</select></div>
    </div>

    {isMainOrDrink&&<div className="flex flex-wrap gap-4">
      <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={useSizes} onChange={e=>{setUseSizes(e.target.checked);if(!e.target.checked)setSizes([{label:'',price:''}])}} className="w-4 h-4 rounded accent-orange-600"/><span className="text-sm text-gray-700">設定多種規格（{sizeHint}）</span></label>
      {f.category==='drink'&&<label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={f.has_custom_options} onChange={e=>setF({...f,has_custom_options:e.target.checked})} className="w-4 h-4 rounded accent-orange-600"/><span className="text-sm text-gray-700">甜度/冰塊選項</span></label>}
    </div>}

    {useSizes&&<div className="bg-blue-50 rounded-xl p-4 border border-blue-100 space-y-2">
      <p className="text-sm font-bold text-blue-900 mb-2">規格設定（{sizeHint}）</p>
      {sizes.map((s,i)=><div key={i} className="flex gap-2 items-center">
        <input type="text" value={s.label} onChange={e=>updSize(i,'label',e.target.value)} placeholder="規格名稱" className="flex-1 px-3 py-2 border rounded-lg text-sm"/>
        <input type="number" value={s.price} onChange={e=>updSize(i,'price',e.target.value)} placeholder="價格" min="0" className="w-24 px-3 py-2 border rounded-lg text-sm"/>
        {sizes.length>1&&<button type="button" onClick={()=>rmSize(i)} className="text-red-400 hover:text-red-600 text-lg px-1">×</button>}
      </div>)}
      <button type="button" onClick={addSize} className="text-sm text-blue-600 hover:text-blue-800 font-bold">＋ 新增規格</button>
    </div>}

    <div className="flex items-center justify-between pt-1">
      <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={f.is_public} onChange={e=>setF({...f,is_public:e.target.checked})} className="w-4 h-4 rounded accent-orange-600"/><span className="text-sm text-gray-600">公開</span></label>
      <div className="flex gap-2">{editData&&<button type="button" onClick={onCancel} className="px-4 py-2 bg-gray-200 text-gray-600 rounded-xl font-bold text-sm">取消</button>}<button type="submit" className="px-5 py-2 btn-p rounded-xl font-bold text-sm shadow">{editData?'💾 儲存':'➕ 新增'}</button></div>
    </div>
  </form>);
}
