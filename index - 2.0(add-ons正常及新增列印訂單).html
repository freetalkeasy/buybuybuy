function BatchMenuForm({ onBatchSave, onClose }) {

  const validRows = rows.filter(r => r.name.trim() && r.price);
  const submit = async () => { if (!validRows.length) { alert('請至少輸入一個品項'); return; } setSaving(true); const items = validRows.map(r => ({ name: r.name.trim(), price: parseFloat(r.price), category: r.category, has_custom_options: r.has_custom_options, is_public: true })); const ok = await onBatchSave(items); if (ok) { setSaved(p => [...p, ...items]); setRows([emptyRow(), emptyRow(), emptyRow()]) } setSaving(false); };

      const basePrice = state.size ? state.size.price : it.price; const total = (basePrice + topObj.price) * state.qty;
      let desc = it.name; if (state.size) desc += `(${state.size.label})`;
      if (!isShopping) { if (isMain) desc += ` / ${state.rice} / ${state.spice}`; else if (isDrink) desc += ` / ${state.sugar} / ${state.ice}`; if (toppingList.length > 0 && state.topping !== '無') desc += ` +${state.topping}`; }

              <div className="text-right shrink-0"><span className={`px-2.5 py-1 rounded-full text-xs font-bold ${act ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>{act ? '🟢 進行中' : '🔴 已結束'}</span><button onClick={cpSh} className={`mt-2 block w-full px-2 py-1 rounded text-xs font-bold ${sc?'bg-green-500 text-white':'bg-orange-100 text-orange-700'}`}>{sc?'已複製':'分享'}</button></div>

          {act && (<div className="space-y-4"><div className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100 flex items-center gap-4"><span className="font-bold text-orange-900 shrink-0">你的姓名：</span><input type="text" value={oName} onChange={e => setOName(e.target.value)} placeholder="請輸入姓名..." className="flex-1 px-4 py-2 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none font-bold text-center" /></div><div className="bg-white rounded-2xl shadow-md border border-orange-100 overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-left border-collapse excel-table min-w-[1000px]"><thead><tr><th className="p-3">品項名稱</th><th className="p-3 w-32">規格/價格</th><th className="p-3 w-28">甜度/飯量</th><th className="p-3 w-28">冰塊/辣度</th><th className="p-3 w-36">加料 (+元)</th><th className="p-3 w-48">備註</th><th className="p-3 w-16">數量</th><th className="p-3 w-20">操作</th></tr></thead><tbody className="divide-y divide-gray-100">{Object.entries(menuByCategory).map(([catKey, items]) => (<React.Fragment key={catKey}><tr className="bg-orange-50"><td colSpan="8" className="px-4 py-2 text-xs font-black text-orange-700 uppercase">{catL(catKey)}</td></tr>{items.map(it => { const state = rowStates[it.id] || { sugar: '正常', ice: '正常冰', rice: '正常', spice: '不辣', topping: '無', qty: 1, note: '' }; const isShopping = it.category === 'shopping'; const isMain = it.category === 'main'; const isDrink = !isShopping && !isMain; const currentToppings = isMain ? TOPPINGS_MAIN : (isDrink ? TOPPINGS_DRINK : []); return (<tr key={it.id} className="hover:bg-orange-50/30"><td className="p-3 font-bold text-gray-800">{it.name}</td><td className="p-3">{it.sizes ? <select value={state.size?.label} onChange={e => updateRow(it.id, 'size', it.sizes.find(s => s.label === e.target.value))} className="input-excel">{it.sizes.map(s => <option key={s.label} value={s.label}>{s.label} (${s.price})</option>)}</select> : <span className="font-bold text-orange-600 ml-2"           <div className="grid md:grid-cols-2 gap-5"><div className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100"><h3 className="font-bold text-orange-900 mb-3">📋 訂單記錄 ({ords.length})</h3><div className="space-y-2 max-h-[400px] overflow-y-auto pr-1">{ords.map(o => (<div key={o.id} className="p-3 bg-orange-50 rounded-xl border border-orange-100 flex justify-between items-start group"><div><p className="font-bold text-orange-900 text-sm">{o.customer_name}</p><p className="text-xs text-orange-700 whitespace-pre-line">{o.items}</p></div><div className="text-right shrink-0"><p className="font-bold text-orange-600 text-sm">NT${parseFloat(o.amount).toLocaleString()}</p><button onClick={() => delOrd(o.id)} className="text-xs text-red-400 font-bold opacity-0 group-hover:opacity-100 transition mt-1">🗑</button></div></div>))}</div></div><div className="bg-white rounded-2xl shadow-sm p-4 border border-orange-100 h-fit"><h3 className="font-bold text-orange-900 mb-3">💰 應付總計</h3><div className="text-3xl font-black text-orange-600 text-center py-6 border-t-2 border-orange-100 border-double">NT${tot.toLocaleString()}</div></div></div>

      <div id="glist" className="flex items-center justify-between mb-4"><h2 className="text-lg font-bold text-orange-900">📦 目前團購</h2><button onClick={ldGbs} className="text-sm text-orange-500 hover:text-orange-700">🔄 重整</button></div>

n(true) }} className="w-full py-2.5 px-4 bg-white border-2 border-red-200 rounded-xl font-medium text-red-600 hover:bg-red-50 flex items-center justify-center gap-2 text-sm">🛡️ 管理者登入</button></div>

  const MerchantsPage = () => {
    const [sf, setSf] = useState(false); const [em, setEm] = useState(null); const [f, setF] = useState({ name: '', description: '', phone: '', address: '', city: '', district: '' });

    const actMerchant = merchants.find(m => m.id === activeM);
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-6xl mx-auto px-4 py-6"><button onClick={goHome} className="text-orange-600 hover:text-orange-800 mb-3 inline-block text-sm">← 返回首頁</button><div className="flex flex-wrap items-center justify-between gap-3 mb-5"><h2 className="text-xl font-black text-orange-900">🏪 商家菜單管理</h2><div className="flex gap-2"><button onClick={() => { setSf(!sf); setEm(null); setF({ name: '', description: '', phone: '', address: '', city: '', district: '' }) }} className="px-4 py-2 btn-p rounded-xl font-bold text-sm">{sf ? '✕ 收起' : '➕ 新增商家'}</button></div></div>{sf && <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-5 anim-slide"><h3 className="font-bold text-orange-900 mb-3">{em ? '✏️ 編輯商家' : '➕ 新增商家'}</h3><form onSubmit={save} className="space-y-3"><div className="grid sm:grid-cols-2 gap-3"><div><label className="block text-sm font-bold text-orange-900 mb-1">名稱 *</label><input type="text" required value={f.name} onChange={e => setF({ ...f, name: e.target.value })} placeholder="王記便當" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div><label className="block text-sm font-bold text-orange-900 mb-1">電話</label><input type="text" value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div></div><div className="grid sm:grid-cols-2 gap-3"><div><label className="block text-sm font-bold text-orange-900 mb-1">縣市</label><select value={f.city} onChange={e => setF({ ...f, city: e.target.value, district: '' })} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none"><option value="">-- 選擇縣市 --</option>{TW_CITIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div><div><label className="block text-sm font-bold text-orange-900 mb-1">鄉鎮市區</label><select value={f.district} onChange={e => setF({ ...f, district: e.target.value })} disabled={!f.city} className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none disabled:bg-gray-100"><option value="">-- 選擇區域 --</option>{(TW_REGIONS[f.city] || []).map(d => <option key={d} value={d}>{d}</option>)}</select></div></div><div><label className="block text-sm font-bold text-orange-900 mb-1">詳細地址</label><input type="text" value={f.address} onChange={e => setF({ ...f, address: e.target.value })} placeholder="路/街/巷/號" className="w-full px-3 py-2.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:outline-none" /></div><div className="flex gap-2"><button type="submit" className="px-5 py-2.5 btn-p rounded-xl font-bold">{em ? '💾 儲存' : '➕ 建立'}</button><button type="button" onClick={reset} className="px-5 py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold">取消</button></div></form></div>}<div className="grid lg:grid-cols-3 gap-5"><div className="lg:col-span-1"><div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">{merchants.map(m => { const loc = parseCityDist(m.address); return (<div key={m.id} onClick={() => setActiveM(m.id)} className={`m-card bg-white rounded-xl shadow-sm p-3.5 cursor-pointer ${activeM === m.id ? 'border-orange-400 bg-orange-50' : ''}`}><div className="flex justify-between items-start"><div className="min-w-0"><h3 className="font-bold text-orange-900 truncate">{m.name}</h3>{loc.city && <p className="text-xs text-blue-600 mt-0.5">📍 {loc.city}{loc.district}</p>}{m.phone && <p className="text-xs text-gray-400">📞 {m.phone}</p>}</div><span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full shrink-0">{mCnt(m.id)}</span></div><div className="flex gap-2 mt-2"><button onClick={e => { e.stopPropagation(); setEm(m.id); const p = parseCityDist(m.address); setF({ name: m.name, description: m.description || '', phone: m.phone || '', address: p.street, city: p.city, district: p.district }); setSf(true); scrollTo({ top: 0, behavior: 'smooth' }) }} className="text-xs text-blue-500 font-bold">✏️</button><button onClick={e => { e.stopPropagation(); del(m.id) }} className="text-xs text-red-400 font-bold">🗑</button></div></div>) })}</div></div><div className="lg:col-span-2">{activeM && actMerchant ? (<div className="anim-fade"><div className="bg-white rounded-2xl shadow-md p-4 border border-blue-100 mb-4"><div className="flex justify-between items-center"><div><h3 className="text-lg font-bold text-blue-900">🏪 {actMerchant.name} 的菜單</h3><p className="text-sm text-gray-400 mt-0.5">{mm.length} 品項</p></div><div className="flex gap-2"><button onClick={() => { setMenuSf(!menuSf); setMenuEd(null) }} className="px-3 py-1.5 btn-p rounded-lg font-bold text-xs">{menuSf && !menuEd ? '✕' : '➕ 批次新增'}</button></div></div></div><div className="flex gap-1.5 mb-3 flex-wrap"><span onClick={() => setTab('all')} className={`cpill ${tab === 'all' ? 'cpill-a' : 'cpill-i'}`}>全部</span>{CATS.map(c => <span key={c.k} onClick={() => setTab(c.k)} className={`cpill ${tab === c.k ? 'cpill-a' : 'cpill-i'}`}>{c.s}</span>)}</div>{menuEd && <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-4 anim-slide"><h3 className="font-bold text-orange-900 mb-3">✏️ 編輯品項</h3><MenuItemForm onSave={saveItem} editData={mm.find(x => x.id === menuEd)} onCancel={() => { setMenuEd(null); setMenuSf(false) }} /></div>}{menuSf && !menuEd && <div className="bg-white rounded-2xl shadow-md p-5 border border-orange-100 mb-4 anim-slide"><h3 className="font-bold text-orange-900 mb-3">➕ 批次新增品項</h3><BatchMenuForm onBatchSave={batchSaveItems} onClose={() => setMenuSf(false)} /></div>}<MenuList items={filtered} onEdit={(it) => { setMenuEd(it.id); setMenuSf(true) }} onDelete={delItem} /></div>) : (<div className="flex items-center justify-center h-64 text-gray-400"><div className="text-center"><p className="text-4xl mb-2">👈</p><p>選擇左側商家來管理菜單</p></div></div>)}</div></div></main></div>);
  };

  const Create = () => {
    const [f, setF] = useState({ title: '', shopName: '', endDate: todayS(), mid: '' });
    const go = async (e) => { e.preventDefault(); const code = genCode(); const { error } = await sb.from('group_buys').insert([{ title: f.title, shop_name: f.shopName, end_date: f.endDate, code, organizer_name: cName() }]); if (!error) { show('建立成功！'); ldGbs(); setView('home'); } };
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-xl mx-auto px-4 py-8"><div className="bg-white p-8 rounded-3xl shadow-xl border border-orange-100"><h2 className="text-2xl font-black text-orange-900 mb-6 text-center">🛒 新增團購</h2><form onSubmit={go} className="space-y-4"><input type="text" required value={f.title} onChange={e => setF({ ...f, title: e.target.value })} placeholder="團購標題" className="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none" /><select value={f.mid} onChange={e => { const m = merchants.find(x => x.id === e.target.value); setF({ ...f, mid: e.target.value, shopName: m ? m.name : '' }) }} className="w-full px-4 py-3 bg-gray-50 border rounded-xl"><option value="">-- 選擇已有商家 --</option>{merchants.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select><input type="date" required value={f.endDate} onChange={e => setF({ ...f, endDate: e.target.value })} className="w-full px-4 py-3 bg-gray-50 border rounded-xl" /><button type="submit" className="w-full py-4 btn-p rounded-2xl font-black text-lg shadow-lg">🚀 發布團購</button></form></div></main></div>);
  };

  const AdminPage = () => {
    const [adminGbs, setAdminGbs] = useState([]); const delGb = async (id) => { if (!confirm('確定刪除？')) return; await sb.from('group_buys').delete().eq('id', id); setAdminGbs(p => p.filter(g => g.id !== id)); show('已刪除') };
    useEffect(() => { sb.from('group_buys').select('*').order('created_at', { ascending: false }).then(({ data }) => setAdminGbs(data || [])) }, []);
    return (<div className="min-h-screen bg-pattern"><Nav /><main className="max-w-6xl mx-auto px-4 py-8"><h2 className="text-2xl font-black text-red-900 mb-6">🛡️ 管理者後台</h2><div className="bg-white p-6 rounded-3xl shadow-md"><h3 className="font-bold text-gray-800 mb-4">所有團購列表</h3><div className="space-y-2">{adminGbs.map(g => <div key={g.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl"><span>{g.title} ({g.shop_name})</span><button onClick={() => delGb(g.id)} className="text-red-500 text-sm">刪除</button></div>)}</div></div></main></div>);
  };

  const R = () => { 
    switch (view) { 
      case 'login': return <Login />; 
      case 'create': return <Create />; 
      case 'detail': return <Detail />; 
      case 'merchants': return <MerchantsPage />; 
      case 'orderSelect': return <OrderSelectPage />; // 新增：選擇團購頁面
      case 'orderPrint': return <OrderPrintPage />;   // 新增：訂單列表與列印頁面
      case 'admin': return isAdmin ? <AdminPage /> : <Home />; 
      default: return <Home /> 
    } 
  };
  return (<>{R()}{toast && <Toast {...toast} onClose={() => setToast(null)} />}{shareModal && <ShareModal groupBuy={shareModal} onClose={() => { setShareModal(null); setView('home') }} />}{showAdminLogin && <Modal onClose={() => setShowAdminLogin(false)} title="🛡️ 管理者登入"><div className="p-6 space-y-4"><input type="password" id="admin-pwd-input" placeholder="管理者密碼" className="w-full h-[52px] px-4 border-2 border-red-200 rounded-xl text-center text-lg focus:border-red-500 focus:outline-none" onKeyDown={e => { if (e.key === 'Enter') { checkAdminPwd(e.target.value) } }} /><button onClick={() => { const v = document.getElementById('admin-pwd-input')?.value; checkAdminPwd(v) }} className="w-full h-[52px] bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition shadow-lg">登入管理後台</button></div></Modal>}</>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GroupBuyApp />);
setTimeout(() => document.getElementById('loading-screen').classList.add('hide'), 1000);
</script>
</body>
</html>
